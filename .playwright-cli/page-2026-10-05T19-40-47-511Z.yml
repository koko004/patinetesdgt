            - paragraph
            - paragraph [ref=f189e529]:
              - strong [ref=f189e530]: "Rendimiento Dualtron:"
            - paragraph [ref=f189e531]: Con sus potentes motores y sus sistemas de suspensión avanzados, los patinetes Dualtron garantizan un rendimiento inigualable. Descubre la velocidad y la autonomía en tu patin Dualtron.
            - paragraph
            - paragraph [ref=f189e532]:
              - strong [ref=f189e533]: "Diseño y Calidad de Dualtron:"
            - paragraph [ref=f189e534]:
              - text: La estética elegante se combina con durabilidad en cada patinete de la marca Dualtron.
              - strong [ref=f189e535]: Fabricados con materiales de alta calidad
              - text: ", estos patinetes no solo ofrecen un rendimiento espectacular, sino que también destacan por su estilo y resistencia duradera."
            - paragraph
            - paragraph [ref=f189e536]:
              - strong [ref=f189e537]: "Experiencia Personalizada con Dualtron:"
            - paragraph [ref=f189e538]:
              - text: Desde el todoterreno Dualtron Eagle hasta la portabilidad del Dualtron Mini,
              - strong [ref=f189e539]: nuestra gama se adapta a diferentes estilos de vida
              - text: . Como distribuidor oficial de minimotors, nos comprometemos a brindarte acceso exclusivo a la experiencia Dualtron.
            - paragraph
            - paragraph [ref=f189e540]:
              - strong [ref=f189e541]: "Talleres Especializados y Repuestos Originales:"
            - paragraph [ref=f189e542]: Queremos ofrecerte la mejor atención postventa. Todas nuestras tiendas son talleres especializados de Dualtron, lo que significa que no solo te proporcionamos estos patinetes eléctricos de última generación, sino también mantenimiento de calidad. Trabajamos con repuestos originales de Dualtron para garantizar el rendimiento y la durabilidad de tu patinete eléctrico.
            - paragraph
            - paragraph [ref=f189e543]:
              - text: Descubre la excelencia en movilidad con Dualtron, donde
              - strong [ref=f189e544]: la innovación y el rendimiento
              - text: se fusionan para llevar tus desplazamientos al siguiente nivel.
