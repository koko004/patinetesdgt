    - generic [ref=f58e914]:
      - paragraph [ref=f58e915]:
        - text: Los
        - strong [ref=f58e916]: patinetes eléctricos Dualtron
        - text: son la referencia mundial en movilidad eléctrica personal de alto rendimiento. Electyum es uno de los
        - strong [ref=f58e917]: principales distribuidores oficiales de Dualtron en Europa
        - text: ", lo que nos permite ofrecer el catálogo más amplio de modelos Minimotors, con acceso prioritario a novedades, reposiciones y los precios más competitivos del mercado."
      - heading "¿Por qué elegir un patinete eléctrico Dualtron?" [level=2] [ref=f58e918]
      - paragraph [ref=f58e919]: "Dualtron no es simplemente una marca de patinetes eléctricos: es el estándar de calidad contra el que se miden el resto. Estos son los motivos por los que sus modelos dominan el mercado internacional:"
      - list [ref=f58e920]:
        - listitem [ref=f58e921]:
          - strong [ref=f58e922]: "Catálogo más amplio del mundo:"
          - text: desde modelos urbanos homologados DGT hasta patinetes de alto rendimiento off-road. Siempre hay un Dualtron para cada perfil de usuario.
        - listitem [ref=f58e923]:
          - strong [ref=f58e924]: "Componentes de primera calidad:"
          - text: baterías LG, motores BLDC, frenos hidráulicos y suspensión ajustable en los modelos más avanzados.
        - listitem [ref=f58e925]:
          - strong [ref=f58e926]: "Construcción en aleación de aluminio:"
          - text: robustos y duraderos, pero sorprendentemente ligeros y manejables para un uso personal diario.
        - listitem [ref=f58e927]:
          - strong [ref=f58e928]: "Resistencia al agua:"
          - text: materiales tratados para aguantar condiciones climáticas adversas, algo poco común en la competencia.
        - listitem [ref=f58e929]:
          - strong [ref=f58e930]: "Potencia real en cualquier terreno:"
          - text: motores capaces de superar pendientes de más de 20º sin perder fuerza, tanto en asfalto como en superficies irregulares.
        - listitem [ref=f58e931]:
          - strong [ref=f58e932]: "Modelos homologados DGT:"
          - text: todos los patinetes Dualtron distribuidos por Electyum incluyen certificado de limitación a 25 km/h y certificado europeo CE para circular legalmente.
      - heading "Gama de patinetes Dualtron disponibles en Electyum" [level=2] [ref=f58e933]
      - paragraph [ref=f58e934]:
        - text: "El catálogo Dualtron en Electyum cubre todos los perfiles: desde usuarios urbanos que buscan un"
        - strong [ref=f58e935]: patinete homologado para el día a día
        - text: hasta riders que exigen la máxima potencia y autonomía. Entre los modelos más destacados encontrarás la gama Victor —con versiones homologadas DGT y hasta 120 km de autonomía—, el Storm para quienes buscan una conducción deportiva extrema, y el X Limited, pensado para dominar cualquier terreno con su motor dual de 12.000W y ruedas antipinchazo de 13 pulgadas.
      - heading "Preguntas frecuentes sobre patinetes eléctricos Dualtron" [level=2] [ref=f58e936]
      - heading "¿Qué diferencia a Dualtron del resto de marcas de patinetes eléctricos?" [level=3] [ref=f58e937]
      - paragraph [ref=f58e938]: "Dualtron combina tres factores que pocas marcas logran a la vez: el catálogo más extenso del mercado mundial, componentes de primerísima calidad y una construcción capaz de aguantar un uso intensivo durante años. Sus patinetes están diseñados para ser a la vez potentes, robustos y manejables, con modelos que van desde opciones urbanas asequibles hasta auténticas bestias de la carretera."
      - heading "¿Los patinetes Dualtron están homologados para circular en España?" [level=3] [ref=f58e939]
      - paragraph [ref=f58e940]: Sí. Los modelos distribuidos por Electyum incluyen certificado de limitación a 25 km/h y certificado europeo CE, cumpliendo con la normativa de la DGT para patinetes eléctricos. Los modelos de la gama Victor cuentan además con homologación DGT específica para circular legalmente por vías urbanas.
      - heading "¿Cuál es el plazo de entrega de un patinete Dualtron?" [level=3] [ref=f58e941]
      - paragraph [ref=f58e942]:
        - text: Los patinetes eléctricos Dualtron se entregan en un plazo medio de
        - strong [ref=f58e943]: 24 a 72 horas
        - text: en la península, en función de la comunidad autónoma y la hora de realización del pedido. Todos los envíos incluyen un
        - strong [ref=f58e944]: número de seguimiento
        - text: para que puedas conocer el estado de tu pedido en todo momento.
      - heading "¿Puedo financiar mi patinete Dualtron en Electyum?" [level=3] [ref=f58e945]
      - paragraph [ref=f58e946]: "Sí, y de forma muy sencilla en 4 pasos sin papeleo:"
      - list [ref=f58e947]:
        - listitem [ref=f58e948]:
          - strong [ref=f58e949]: Añade al carrito
          - text: el modelo deseado y pulsa
          - emphasis [ref=f58e950]: comprar ahora
          - text: .
        - listitem [ref=f58e951]:
          - strong [ref=f58e952]: Selecciona Sequra
          - text: como método de pago en el checkout.
        - listitem [ref=f58e953]:
          - strong [ref=f58e954]: Rellena un formulario simple
          - text: con solo tu DNI y número de móvil.
        - listitem [ref=f58e955]:
          - text: Recibe una
          - strong [ref=f58e956]: respuesta inmediata.
      - heading "¿Dónde puedo consultar el manual de mi patinete Dualtron?" [level=3] [ref=f58e957]
      - paragraph [ref=f58e958]:
        - text: Puedes consultar y descargar los
        - link "manuales de usuario de los patinetes Dualtron" [ref=f58e959] [cursor=pointer]:
          - /url: https://dualtron-shop.com/es/manuales-de-usuario-dualtron-speedway/
        - text: directamente en la web oficial de la marca.
