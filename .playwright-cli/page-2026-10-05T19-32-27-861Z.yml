    - generic [ref=f108e198]:
      - heading "Patinete Eléctrico Dualtron Thunder 3" [level=2] [ref=f108e200]
      - generic [ref=f108e202]:
        - heading "Dualtron Thunder 3 | El Patinete Eléctrico más Potente de 11000W" [level=3] [ref=f108e203]
        - heading [level=3]
        - paragraph [ref=f108e204]:
          - text: El
          - strong [ref=f108e205]: Dualtron Thunder 3
          - text: llega para redefinir los límites de la movilidad eléctrica. Basado en el legendario legado de la línea Thunder, esta tercera generación no es solo una actualización; es una revolución en ingeniería, seguridad y potencia. Con un diseño de chasis elegante y una resistencia al agua certificada, el Thunder 3 está preparado para conquistar tanto el asfalto urbano como los terrenos más exigentes.
        - heading "Características Principales de Última Generación" [level=3] [ref=f108e206]
        - heading "Pantalla Inteligente EY4 con Protección IPX7" [level=3] [ref=f108e207]
        - paragraph [ref=f108e208]:
          - text: Olvídate de las preocupaciones por la lluvia. El Thunder 3 introduce la nueva
          - strong [ref=f108e209]: pantalla central LCD EY4
          - text: ", totalmente impermeable (IPX7) y con conectividad"
          - strong [ref=f108e210]: Bluetooth
          - text: . Vincúlalo con la App oficial de Dualtron para gestionar parámetros de conducción, estadísticas y seguridad directamente desde tu smartphone.
        - heading "Potencia Bruta y Aceleración Overtake" [level=3] [ref=f108e211]
        - paragraph [ref=f108e212]:
          - text: Equipado con un sistema de motor dual que alcanza los
          - strong [ref=f108e213]: 11000W de potencia máxima
          - text: ", este patinete ofrece un incremento de fuerza de entre el 5% y el 10% respecto a su predecesor. Además, incluye la función"
          - strong [ref=f108e214]: Overtake
          - text: ", diseñada para momentos donde necesitas un extra de aceleración inmediata."
        - heading "Seguridad y Control Total" [level=3] [ref=f108e215]
        - paragraph [ref=f108e216]:
          - text: Para domar a esta "bestia", Dualtron ha integrado un sistema de
          - strong [ref=f108e217]: frenado hidráulico NUTT de 4 pistones
          - text: con una función de refrigeración integrada única en el mercado. Para garantizar la estabilidad a altas velocidades, se incluye de serie un
          - strong [ref=f108e218]: amortiguador de dirección hidráulico
          - text: ", eliminando vibraciones y movimientos no deseados."
        - heading "Especificaciones Técnicas Detalladas" [level=2] [ref=f108e219]
        - paragraph [ref=f108e220]: Característica Especificación Potencia Máxima 11000 W (Motor Dual) Velocidad Máxima100 km/h Batería LG 72V 40Ah (Celdas de alta capacidad)Autonomía Máxima Hasta 170 km Frenos Disco Hidráulico NUTT 4 pistones (Refrigerados) SuspensiónBrazo oscilante con cartuchos reemplazables Neumáticos Ultra anchos de 11 pulgadas Resistencia al Agua IPX5 (Chasis) / IPX7 (Pantalla)Carga Máxima150 kg Manillar XL de 700 mm para mayor control
        - heading "Innovaciones en Diseño y Durabilidad" [level=2] [ref=f108e221]
        - list [ref=f108e222]:
          - listitem [ref=f108e223]:
            - strong [ref=f108e224]: "Sistema de Plegado de Triple Seguridad:"
            - text: Nueva columna de dirección reforzada y sistema de plegado rediseñado para garantizar que la estructura se mantenga rígida y segura incluso tras un uso intensivo.
          - listitem [ref=f108e225]:
            - strong [ref=f108e226]: "Iluminación de Alta Potencia:"
            - text: Incorpora faros dobles frontales de gran alcance que garantizan visibilidad total en conducción nocturna, complementados con el icónico sistema de luces LED laterales de Dualtron.
          - listitem [ref=f108e227]:
            - strong [ref=f108e228]: "Gestión de Carga Eficiente:"
            - text: Cuenta con dos puertos de carga. Utilizando un cargador rápido y ambos puertos, puedes reducir el tiempo de carga de 26 horas a tan solo
            - strong [ref=f108e229]: 8 horas
            - text: .
          - listitem [ref=f108e230]:
            - strong [ref=f108e231]: "Resistencia Todo Clima:"
            - text: Es el primer modelo de la marca con certificación de resistencia al agua IPX5 para el marco, lo que permite su uso bajo la lluvia con total confianza.
        - heading "¿Qué incluye la caja?" [level=2] [ref=f108e232]
        - list [ref=f108e233]:
          - listitem [ref=f108e234]: Patinete Eléctrico Dualtron Thunder 3.
          - listitem [ref=f108e235]: Cargador Estándar.
          - listitem [ref=f108e236]: Amortiguador de dirección hidráulico (preinstalado).
          - listitem [ref=f108e237]: Kit de herramientas multiusos.
          - listitem [ref=f108e238]: Manual de usuario.
        - paragraph [ref=f108e239]: El Dualtron Thunder 3 es una máquina de alto rendimiento diseñada para usuarios experimentados. Su equilibrio entre la potencia bruta, la comodidad de su suspensión de cartuchos y la seguridad de sus frenos de 4 pistones lo convierten en la elección perfecta para quienes no aceptan compromisos en su transporte diario o viajes de larga distancia.
        - heading "Potencia, Autonomía y Rendimiento Extremo en el nuevo Thunder 3" [level=3] [ref=f108e240]
        - paragraph [ref=f108e241]:
          - text: Si estás buscando comprar el
          - strong [ref=f108e242]: mejor patinete eléctrico de alta gama
          - text: ", el"
          - strong [ref=f108e243]: Dualtron Thunder 3
          - text: se posiciona como el referente absoluto en movilidad urbana y todoterreno. Equipado con una impresionante batería
          - strong [ref=f108e244]: LG 72V 40Ah
          - text: ", este modelo no solo garantiza una autonomía de hasta 170 km, sino que redefine la velocidad y la seguridad gracias a sus frenos de 4 pistones y su certificación de resistencia al agua IPX5. Es la opción predilecta para usuarios expertos que exigen un rendimiento profesional en cada trayecto."
        - paragraph [ref=f108e245]:
          - text: La ingeniería de
          - strong [ref=f108e246]: Minimotors
          - text: alcanza su punto álgido con este scooter eléctrico potente, integrando una pantalla digital EY4 con Bluetooth y un sistema de plegado reforzado único en su categoría. Ya sea para trayectos largos o para disfrutar de la máxima potencia en terrenos difíciles, el
          - strong [ref=f108e247]: Dualtron Thunder 3
          - text: ofrece una experiencia de conducción superior, combinando tecnología de vanguardia con un diseño robusto y elegante. Hazte con el rey de los
          - strong [ref=f108e248]: patinetes eléctricos Dualtron
          - text: y eleva tu movilidad a un nivel nunca antes visto.
