    - generic [ref=f66e207]:
      - heading "Patinete Eléctrico Dualtron Togo" [level=2] [ref=f66e209]
      - generic [ref=f66e211]:
        - 'heading "Dualtron Togo: El Patinete Eléctrico de Minimotors más Ágil y Potente" [level=3] [ref=f66e212]'
        - paragraph [ref=f66e213]:
          - text: El nuevo
          - strong [ref=f66e214]: Dualtron Togo
          - text: llega a Electyum para redefinir el concepto de patinete eléctrico urbano de alto rendimiento. Desarrollado por la prestigiosa firma
          - strong [ref=f66e215]: Minimotors
          - text: ", este modelo combina la robustez característica de la marca con una agilidad sin precedentes. Es la solución perfecta para quienes buscan un transporte diario fiable, potente y, sobre todo, adaptado a la"
          - strong [ref=f66e216]: nueva normativa de circulación
          - text: .
        - paragraph [ref=f66e217]: Diseñado para soportar un uso intensivo, el Dualtron Togo destaca por su chasis reforzado, su sistema de suspensión inteligente y una gestión de energía eficiente que te permitirá moverte por la ciudad con total libertad y seguridad.
        - heading "Rendimiento y Potencia Superior" [level=3] [ref=f66e218]
        - paragraph [ref=f66e219]: El corazón del Dualtron Togo es su motor de alto rendimiento. Dependiendo de la configuración elegida, ofrece una entrega de potencia progresiva pero contundente, ideal para sortear el tráfico urbano y superar obstáculos sin pérdida de velocidad.
        - list [ref=f66e220]:
          - listitem [ref=f66e221]:
            - strong [ref=f66e222]: "Potencia Nominal:"
            - text: Hasta 650W (en versión 48V) para un empuje constante.
          - listitem [ref=f66e223]:
            - strong [ref=f66e224]: "Capacidad de Ascenso:"
            - text: Supera pendientes de hasta el 15 por ciento (26 por ciento de inclinación) sin esfuerzo.
          - listitem [ref=f66e225]:
            - strong [ref=f66e226]: "Velocidad:"
            - text: Capaz de alcanzar entre 34 y 40 km/h (limitado de fábrica a 25 km/h para cumplir con la normativa VMP y certificado por importador).
        - heading "Autonomía de Largo Alcance y Batería LG" [level=3] [ref=f66e227]
        - paragraph [ref=f66e228]:
          - text: No te preocupes por el cargador durante el día. Equipado con celdas de alta calidad
          - strong [ref=f66e229]: LG
          - text: ", el Dualtron Togo garantiza una vida útil prolongada y una entrega de energía estable."
        - list [ref=f66e230]:
          - listitem [ref=f66e231]:
            - strong [ref=f66e232]: "Capacidad:"
            - text: Batería de 48V 15Ah LG (disponible también en versiones 36V 12Ah y 48V 12Ah).
          - listitem [ref=f66e233]:
            - strong [ref=f66e234]: "Autonomía Máxima:"
            - text: Recorre hasta 50 km con una sola carga, ideal para trayectos interurbanos.
          - listitem [ref=f66e235]:
            - strong [ref=f66e236]: "Gestión de Carga:"
            - text: Tiempo de carga optimizado de entre 6 a 8 horas para una carga completa.
        - heading "Confort y Seguridad en Cualquier Terreno" [level=3] [ref=f66e237]
        - paragraph [ref=f66e238]:
          - text: A diferencia de otros patinetes urbanos rígidos, el Togo incorpora tecnología de
          - strong [ref=f66e239]: doble suspensión de aire
          - text: ", lo que se traduce en una conducción suave incluso sobre adoquines o pavimentos irregulares."
        - list [ref=f66e240]:
          - listitem [ref=f66e241]:
            - strong [ref=f66e242]: "Sistema de Frenado Triple:"
            - text: Combina frenos de tambor de alta durabilidad con un sistema de frenado regenerativo e-ABS, permitiendo detenciones precisas y seguras.
          - listitem [ref=f66e243]:
            - strong [ref=f66e244]: "Ruedas de 9 Pulgadas:"
            - text: Neumáticos con cámara de aire que ofrecen un agarre superior y una amortiguación adicional contra impactos.
          - listitem [ref=f66e245]:
            - strong [ref=f66e246]: "Tracción Trasera Deportiva:"
            - text: Mejora la maniobrabilidad y proporciona una sensación de conducción más dinámica y divertida.
        - heading "Tecnología y Conectividad" [level=3] [ref=f66e247]
        - paragraph [ref=f66e248]:
          - text: El Dualtron Togo no solo es potente, también es inteligente. Incorpora una
          - strong [ref=f66e249]: pantalla LCD multifunción
          - text: de última generación para monitorizar todos los parámetros de tu viaje en tiempo real y es compatible con
          - strong [ref=f66e250]: App móvil
          - text: para personalizar la experiencia de conducción.
        - list [ref=f66e251]:
          - listitem [ref=f66e252]:
            - strong [ref=f66e253]: "Iluminación Completa:"
            - text: Equipado con intermitentes integrados para señalizar tus movimientos y aumentar tu visibilidad.
          - listitem [ref=f66e254]:
            - strong [ref=f66e255]: "Seguridad Activa:"
            - text: Incluye timbre y certificado de limitación de velocidad para cumplir con la ley vigente.
          - listitem [ref=f66e256]:
            - strong [ref=f66e257]: "Construcción:"
            - text: Base (deck) de goma antideslizante para una posición de conducción firme y segura.
