                  - paragraph [ref=f180e632]:
                    - strong [ref=f180e633]: Este patinete cumple con la normativa y certificación de la DGT para VMP y podrá ser utilizado más allá del 2027.
                  - heading [level=3] [ref=f180e634]:
                    - strong [ref=f180e635]: PANTALLA TFT 3'' A COLOR
                  - paragraph [ref=f180e636]:
                    - text: Ten información de las funciones del
                    - strong [ref=f180e637]: Masscity Blade M10 PRO
                    - text: con un rápido vistazo a su pantalla TFT a color.
                  - heading "CONEXIÓN BLUETOOTH CON APP TEVERUN" [level=3] [ref=f180e638]
                  - paragraph [ref=f180e639]:
                    - text: Conecta tu
                    - strong [ref=f180e640]: Masscity Blade M10 PRO Certificado
                    - text: con la APP Teverun que encontrarás en la tienda de aplicaciones Android o IOS y configura el patinete a tu gusto. Además tendrás información detallada de todos los parámetros de tu vehículo.
                  - heading "ON-OFF CON TARJETA NFC" [level=3] [ref=f180e641]
                  - paragraph [ref=f180e642]: Sistema de encendido y apagado del patinete con tarjeta NFC. Aproxima tu tarjeta al punto NFC y podrás encender y apagar el M10PRO fácilmente. También podrás configurar tu smartphone para encender y apagar el patiente.
                  - heading "SISTEMA ANTI ROBO" [level=3] [ref=f180e643]
                  - paragraph [ref=f180e644]: Podrás configurar una contraseña que se solicita cuando enciendes el Blade M10PRO. De esta forma tendrás dos niveles de seguridad anti robo.
                  - heading "SMART BMS" [level=3] [ref=f180e645]
                  - paragraph [ref=f180e646]:
                    - text: Ten control total sobre el estado de la batería del
                    - strong [ref=f180e647]: Blade M10 PRO
                    - text: . Sabrás en tiempo real el voltaje de todas las series de la batería, ciclos de carga, alarmas y mucho más.
                  - heading "DOS MOTORES DE 500W" [level=3] [ref=f180e648]
                  - paragraph [ref=f180e649]: Un total de 1000w (2400w de pico) que te llevarán todo lo lejos que tu necesites. Podrás activar o desactivar el motor delantero según tus necesidades. Potencia máxima autorizada por la DGT.
                  - heading "BATERÍA DE 48V 15.6Ah" [level=3] [ref=f180e650]
                  - paragraph [ref=f180e651]:
                    - text: Montada con celdas de alta calidad, la batería del
                    - strong [ref=f180e652]: Masscity Blade M10 PRO Certificado DGT
                    - text: te proporcionará muchos kms de autonomía y una vida útil extensa. Incorpora BMS inteligente y que podrás conectar a tu teléfono móvil.
                  - heading "LUCES RGB" [level=3] [ref=f180e653]
                  - paragraph [ref=f180e654]: Luces led en mastil y chasis totalmente programables tanto en colores como en tipo de destello, parpadeo, etc. Todo desde la app de tu móvil.
                  - heading "RUEDAS Y SUSPENSIONES" [level=3] [ref=f180e655]
                  - paragraph [ref=f180e656]: Neumáticos de alto agarre para uso urbano de 9» que junto a la suspensión en ambas ruedas te ofrecen seguridad y comodidad en todos tus recorridos.
                  - heading "FRENOS DE DISCO + REGENERATIVO" [level=3] [ref=f180e657]
                  - paragraph [ref=f180e658]: Seguridad garantizada gracias a sus frenos de disco en ambas ruedas. Además con cada frenada la energía generada sirve para cargar la batería.
