                    - text: — estrecho, silencioso, vivo desde parado, con batería extraíble que se carga en cualquier enchufe doméstico. Un peldaño por debajo está el
                    - strong [ref=f66e574]: NQi Sport
                    - text: como entrada de gama sobre la misma plataforma conectada. Y el próximo
                    - strong [ref=f66e575]: FQiX 150
                    - text: trae una sensación de conducción más deportiva a la misma categoría de 45 km/h.
                  - paragraph [ref=f66e576]:
                    - text: Para la auténtica última milla — el trayecto de la estación a la oficina, o trayectos cortos por el barrio — los patinetes eléctricos
                    - strong [ref=f66e577]: KQi
                    - text: completan la oferta urbana de NIU.
            - listitem [ref=f66e578]:
              - button "¿Cuál es el mejor scooter eléctrico para ir a trabajar?" [ref=f66e579] [cursor=pointer]
              - region:
                - generic [ref=f66e580]:
                  - paragraph [ref=f66e581]: Depende de tu distancia diaria y de si tu ruta incluye carreteras más rápidas.
                  - paragraph [ref=f66e582]:
                    - text: Para trayectos urbanos de hasta unos
                    - strong [ref=f66e583]: 40 km al día
                    - text: en vías a 50 km/h, el
                    - strong [ref=f66e584]: NQi Sport
                    - text: ", el"
                    - strong [ref=f66e585]: NQiX 150
                    - text: o el próximo
                    - strong [ref=f66e586]: FQiX 150
                    - text: son la opción más sencilla. Para distancias más largas o tramos a 80–100 km/h, el
                    - strong [ref=f66e587]: NQiX 300
                    - text: y el
                    - strong [ref=f66e588]: FQi 500
                    - text: suben el listón — misma plataforma conectada, más autonomía, más velocidad máxima.
                  - paragraph [ref=f66e589]:
                    - text: "Para quienes no quieren renunciar a nada: el"
                    - strong [ref=f66e590]: NQiX 500
                    - text: es el scooter más avanzado y potente de NIU — diseñado para ofrecer máximo rendimiento, tecnología de última generación y practicidad diaria. Rápido, ágil y preparado para cualquier trayecto.
                  - paragraph [ref=f66e591]: Lo que hace que ir a trabajar en un NIU sea realmente cómodo es la combinación de baterías extraíbles (cargas en la oficina o en casa), la NIU Smart App y una red de concesionarios por toda Europa.
            - listitem [ref=f66e592]:
              - button "¿Qué scooter eléctricos tienen baterías extraíbles?" [ref=f66e593] [cursor=pointer]
              - region:
                - generic [ref=f66e594]:
                  - paragraph [ref=f66e595]:
                    - text: Las baterías extraíbles son un sello de NIU — toda la gama actual está construida en torno a ellas. Eso incluye el
                    - strong [ref=f66e596]: NQi GTS, NQi Sport, NQiX 150, NQiX 300, NQiX 500, FQi 500, XQi3
                    - text: y los próximos
                    - strong [ref=f66e597]: FQiX 150 y FQiX 300
                    - text: .
                  - paragraph [ref=f66e598]: Desbloqueas el asiento (o el compartimento de batería, según el modelo), sacas la batería y la cargas dentro de casa en cualquier enchufe doméstico — sin wallbox, sin cableado en el parking, sin electricista. Es una de las principales razones por las que NIU funciona para quien vive de alquiler, en piso o sin garaje con corriente. Los modelos de mayor autonomía usan dos baterías que puedes cambiar y cargar de forma independiente, y desde el Model Year 2026 el NQiX 500 admite incluso una tercera batería.
            - listitem [ref=f66e599]:
              - button "¿Qué scooter eléctrico es adecuado para largas distancias?" [ref=f66e600] [cursor=pointer]
              - region:
                - generic [ref=f66e601]:
                  - paragraph [ref=f66e602]:
                    - text: Para distancias de verdad, mira el
                    - strong [ref=f66e603]: NQiX 300
                    - text: y el
                    - strong [ref=f66e604]: NQiX 500
                    - text: . Ambos llevan dos baterías y una mecánica más potente que los modelos urbanos, cubriendo cómodamente trayectos regionales con una sola carga.
                  - paragraph [ref=f66e605]:
                    - text: El NQiX 500 es la actual nave insignia — pensado para turismo en vías rápidas, smart-conectado y reconocido como mejor scooter eléctrico en pruebas comparativas independientes.
                    - strong [ref=f66e606]: Desde el Model Year 2026, el NQiX 500 admite además una tercera batería
                    - text: — lo que amplía claramente la autonomía real para tours más largos y rutas de fin de semana.
            - listitem [ref=f66e607]:
              - button "¿Hay scooter eléctricos con app?" [ref=f66e608] [cursor=pointer]
              - region:
                - generic [ref=f66e609]:
                  - paragraph [ref=f66e610]:
                    - text: Sí — y NIU fue una de las primeras marcas en convertir la app conectada en estándar y no en extra opcional. Todo NIU viene con la
                    - strong [ref=f66e611]: NIU Smart App
                    - text: ": nivel de batería y autonomía restante en tiempo real, ubicación GPS, alertas antirrobo, historial de viaje, estado de servicio y actualizaciones OTA."
                  - paragraph [ref=f66e612]:
                    - text: Aplica a toda la gama —
                    - strong [ref=f66e613]: NQi, NQiX, FQi, FQiX, XQi y KQi
                    - text: — desde el scooter urbano al modelo performance, pasando por la moto eléctrica ligera y el patinete eléctrico. Tu vehículo envía datos a la nube en cuanto lo enciendes, y tú los ves en el móvil estés donde estés.
            - listitem [ref=f66e614]:
              - button "¿Qué motos eléctricas no requieren carnet de moto?" [ref=f66e615] [cursor=pointer]
              - region:
                - generic [ref=f66e616]:
                  - paragraph [ref=f66e617]: La clase de carnet depende del modelo y de su velocidad máxima.
                  - paragraph [ref=f66e618]:
                    - text: En España, los
                    - strong [ref=f66e619]: modelos 45 km/h
                    - text: (NIU NQi GTS, NQi Sport, NQiX 150 en versión 45 km/h) se conducen con el
                    - strong [ref=f66e620]: permiso AM
                    - text: ", desde los 15 años. Los modelos de"
                    - strong [ref=f66e621]: clase A1 (hasta 11 kW, ~95 km/h)
                    - text: requieren
                    - strong [ref=f66e622]: permiso A1
                    - text: (desde los 16) o
                    - strong [ref=f66e623]: permiso B con 3 años de antigüedad
                    - text: ", que te permite conducir motocicletas hasta 125 cm³ dentro del territorio español."
                  - paragraph [ref=f66e624]: Tu concesionario NIU indica la categoría exacta para cada modelo — sin sorpresas en la matriculación.
            - listitem [ref=f66e625]:
              - button "¿Qué scooter eléctricos tienen 100 km de autonomía?" [ref=f66e626] [cursor=pointer]
              - region:
                - generic [ref=f66e627]:
                  - paragraph [ref=f66e628]:
                    - text: 100 km con una sola carga es claramente terreno NIU. El
                    - strong [ref=f66e629]: NQiX 500
                    - text: llega a unos
                    - strong [ref=f66e630]: 100 km
                    - text: por carga, y el
                    - strong [ref=f66e631]: NQiX 300
                    - text: alcanza unos
                    - strong [ref=f66e632]: 120 km
                    - text: . Desde el Model Year 2026, el NQiX 500 admite además una tercera batería — ampliando aún más la autonomía real.
                  - paragraph [ref=f66e633]: Las cifras de autonomía se basan en el ciclo WMTC ciudad. Los números reales dependen de velocidad, peso del piloto y temperatura, pero la línea NQiX está diseñada para cubrir un trayecto diario típico ida y vuelta con una sola carga — y algo más.
            - listitem [ref=f66e634]:
              - button "¿Cuánto dura la batería?" [ref=f66e635] [cursor=pointer]
              - region:
                - generic [ref=f66e636]:
                  - paragraph [ref=f66e637]:
                    - text: NIU usa
                    - strong [ref=f66e638]: celdas pouch de iones de litio
                    - text: dimensionadas para
                    - strong [ref=f66e639]: 800–1.000 ciclos de carga completos
                    - text: . Pasado ese punto, la batería conserva alrededor del
                    - strong [ref=f66e640]: 70–80 %
                    - text: de su capacidad original — no está « muerta », sólo con algo menos de autonomía.
                  - paragraph [ref=f66e641]:
                    - text: En la práctica, a unos 100 km por carga, se traduce en una vida útil de batería de
                    - strong [ref=f66e642]: 80.000–100.000 km
                    - text: antes de tener que pensar en sustituirla. La mayoría de pilotos vende o cambia su scooter mucho antes de llegar a ese kilometraje.
            - listitem [ref=f66e643]:
              - button "¿Cuánto cuesta un scooter eléctrico al año, comparado con uno de gasolina?" [ref=f66e644] [cursor=pointer]
              - region:
                - generic [ref=f66e645]:
                  - paragraph [ref=f66e646]: "Con 5.000 km al año y un precio eléctrico de 0,32 €/kWh:"
                  - paragraph [ref=f66e647]:
                    - text: •
                    - strong [ref=f66e648]: "NQiX 500 (electricidad):"
                    - text: unos
                    - strong [ref=f66e649]: 65 € al año
                    - text: •
                    - strong [ref=f66e650]: "Scooter 125 cm³ gasolina (combustible):"
                    - text: unos
                    - strong [ref=f66e651]: 220 € al año
                  - paragraph [ref=f66e652]:
                    - text: "A esto se añade: en España los vehículos eléctricos disfrutan de un descuento de hasta el"
                    - strong [ref=f66e653]: 75 % en el IVTM
                    - text: (impuesto municipal de circulación, según ayuntamiento), nada de cambios de aceite, ni bujías, ni escape que reparar. Los costes reales de mantenimiento suelen quedar en el
                    - strong [ref=f66e654]: 30–50 %
                    - text: de un equivalente de gasolina — y la diferencia se agranda con los años.
            - listitem [ref=f66e655]:
              - button "¿Qué marca lidera el mercado de scooter eléctricos?" [ref=f66e656] [cursor=pointer]
              - region:
                - generic [ref=f66e657]:
                  - paragraph [ref=f66e658]:
                    - strong [ref=f66e659]: NIU
                    - text: es una de las mayores marcas mundiales de vehículos eléctricos de dos ruedas, con millones de usuarios en más de 50 países. NIU fue la primera marca en producir scooter eléctricos conectados a escala y sigue marcando el listón en tecnología de batería, integración de app y calidad de diseño.
                  - paragraph [ref=f66e660]:
                    - text: Recientemente, el
                    - strong [ref=f66e661]: NQiX 500
                    - text: se ha situado en lo alto de las comparativas independientes — la misma referencia que siguen pilotos, concesionarios y periodistas del sector.
            - listitem [ref=f66e662]:
              - button "¿Qué vehículos eléctricos son los más adecuados para la movilidad urbana?" [ref=f66e663] [cursor=pointer]
              - region:
                - generic [ref=f66e664]:
                  - paragraph [ref=f66e665]:
                    - text: Para la ciudad quieres algo silencioso, fácil de aparcar, con bajos costes de uso y cero emisiones. Los
                    - strong [ref=f66e666]: scooter eléctricos
                    - text: cumplen los cuatro mejor que los coches eléctricos en trayectos por debajo de unos 25 km, y mejor que las e-bikes en cuanto necesitas protección real ante el clima o llevar pasajero.
                  - paragraph [ref=f66e667]: Toda la gama NIU — desde el compacto NQi Sport pasando por la línea NQiX hasta la serie performance FQi — cubre todo, desde la última milla hasta el commuter regional, sobre la misma plataforma conectada.
