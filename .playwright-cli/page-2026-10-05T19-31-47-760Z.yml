      - generic [ref=f96e186]:
        - 'heading "Dualtron Togo Limited: El mejor patinete eléctrico de 60 V homologado por la DGT" [level=3] [ref=f96e187]'
        - paragraph [ref=f96e188]:
          - text: El
          - strong [ref=f96e189]: Dualtron Togo Limited
          - text: es un patinete eléctrico
          - strong [ref=f96e190]: homologado por la DGT
          - text: ", diseñado específicamente para quienes buscan un modelo potente, fiable y cómodo para sus desplazamientos urbanos diarios. Equipado con un motor de alto rendimiento y una gestión de energía eficiente, este modelo ofrece el equilibrio perfecto entre rendimiento profesional y practicidad ciudadana."
        - heading "Rendimiento sólido para moverte sin límites" [level=3] [ref=f96e191]
        - paragraph [ref=f96e192]:
          - text: El corazón del Togo Limited es su
          - strong [ref=f96e193]: motor de 900 W
          - text: ", que proporciona una aceleración fluida y una respuesta inmediata ante cualquier situación de tráfico. Su velocidad está limitada electrónicamente a"
          - strong [ref=f96e194]: 25 km/h
          - text: ", cumpliendo estrictamente con la normativa vigente para Vehículos de Movilidad Personal (VMP) homologados."
        - paragraph [ref=f96e195]: Gracias a su configuración de motor de alto par, este patinete permite afrontar pendientes moderadas con solvencia, manteniendo una conducción estable y sin pérdidas de potencia notables, lo que lo posiciona como una herramienta de transporte sumamente fiable.
        - heading "Gestión de energía y batería de 60 V" [level=3] [ref=f96e196]
        - paragraph [ref=f96e197]:
          - text: Este modelo incorpora una batería de alta densidad de
          - strong [ref=f96e198]: 60 V y 15 Ah
          - text: ", capaz de ofrecer una"
          - strong [ref=f96e199]: autonomía de hasta 50 km
          - text: "con una sola carga. Esta capacidad lo convierte en la opción ideal para:"
        - list [ref=f96e200]:
          - listitem [ref=f96e201]:
            - strong [ref=f96e202]: "Trayectos diarios al trabajo:"
            - text: Olvida la necesidad de cargar el dispositivo tras cada trayecto.
          - listitem [ref=f96e203]:
            - strong [ref=f96e204]: "Movilidad de media distancia:"
            - text: Conecta diferentes puntos de la ciudad con total libertad.
          - listitem [ref=f96e205]:
            - strong [ref=f96e206]: "Uso intensivo:"
            - text: Rendimiento estable y entrega de energía constante incluso en niveles bajos de carga.
        - 'heading "Seguridad avanzada: Frenado y estabilidad" [level=3] [ref=f96e207]'
        - paragraph [ref=f96e208]: "La seguridad es una prioridad en el diseño del Dualtron Togo Limited. Para garantizar un control total, el patinete dispone de:"
        - list [ref=f96e209]:
          - listitem [ref=f96e210]:
            - strong [ref=f96e211]: "Frenado progresivo:"
            - text: Sistema de frenos de tambor delantero y trasero, que ofrece una respuesta predecible y potente, ideal para el entorno urbano.
          - listitem [ref=f96e212]:
            - strong [ref=f96e213]: "Bajo mantenimiento:"
            - text: A diferencia de los frenos de disco, este sistema es más resistente al desgaste y requiere ajustes menos frecuentes.
          - listitem [ref=f96e214]:
            - strong [ref=f96e215]: "Ruedas Tubeless de 10 pulgadas:"
            - text: Neumáticos sin cámara que proporcionan una mayor absorción de irregularidades, mejorando la estabilidad en asfalto y minimizando el riesgo de pinchazos.
        - heading "Control inteligente con pantalla EY4" [level=3] [ref=f96e216]
        - paragraph [ref=f96e217]:
          - text: El Togo Limited incluye la avanzada
          - strong [ref=f96e218]: pantalla EY4 multifunción
          - text: ", un centro de control intuitivo que permite al usuario monitorizar en tiempo real:"
        - list [ref=f96e219]:
          - listitem [ref=f96e220]: Velocidad de circulación exacta.
          - listitem [ref=f96e221]: Estado y nivel de la batería.
          - listitem [ref=f96e222]: Modo de conducción seleccionado.
          - listitem [ref=f96e223]: Configuraciones avanzadas del sistema y odómetro.
        - heading "Diseño robusto y ergonómico" [level=3] [ref=f96e224]
        - paragraph [ref=f96e225]:
          - text: Con un peso optimizado de
          - strong [ref=f96e226]: 26 kg
          - text: ", el Dualtron Togo Limited logra un equilibrio excepcional entre robustez estructural y manejabilidad. Su chasis está diseñado para soportar una carga máxima de hasta"
          - strong [ref=f96e227]: 100 kg
          - text: ", asegurando durabilidad y firmeza en cada trayecto. Es un patinete pensado para resistir el ritmo de la vida moderna sin sacrificar la estética minimalista de la marca."
