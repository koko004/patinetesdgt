    - generic [ref=f78e198]:
      - heading "Patinete Eléctrico Dualtron Victor 2026 (EY4)" [level=2] [ref=f78e200]
      - generic [ref=f78e202]:
        - 'heading "Dualtron Victor: El Patinete Eléctrico Urbano Más Potente y Versátil" [level=3] [ref=f78e203]'
        - paragraph [ref=f78e204]:
          - text: El
          - strong [ref=f78e205]: Dualtron Victor
          - text: llega para redefinir el concepto de movilidad personal, basándose en el prestigioso legado del Dualtron 3. Este patinete eléctrico ha sido rediseñado desde cero para ofrecer un rendimiento óptimo y características avanzadas sin comprometer su presupuesto, logrando una relación inmejorable entre
          - strong [ref=f78e206]: calidad de construcción, potencia y precio
          - text: .
        - paragraph [ref=f78e207]: Es el vehículo ideal tanto para los desplazamientos diarios como para la exploración de nuevos horizontes, garantizando una conducción estimulante, segura y práctica en cualquier entorno.
        - heading "Rendimiento y Potencia de Nivel Superior" [level=3] [ref=f78e208]
        - paragraph [ref=f78e209]:
          - text: El Dualtron Victor se posiciona como uno de los patinetes eléctricos urbanos más potentes del mercado actual. Equipado con
          - strong [ref=f78e210]: dos motores BLDC
          - text: que proporcionan una potencia nominal de 1200W cada uno, genera un total de
          - strong [ref=f78e211]: 2400W de potencia nominal
          - text: .
        - list [ref=f78e212]:
          - listitem [ref=f78e213]:
            - strong [ref=f78e214]: "Velocidad y Agilidad:"
            - text: Alcanza una velocidad máxima de hasta
            - strong [ref=f78e215]: 80 km/h
            - text: (en terrenos privados), permitiendo desplazamientos eficientes.
          - listitem [ref=f78e216]:
            - strong [ref=f78e217]: "Capacidad de Ascenso:"
            - text: Su impresionante torque le permite superar pendientes pronunciadas de hasta un
            - strong [ref=f78e218]: 43% (23 grados)
            - text: sin esfuerzo.
          - listitem [ref=f78e219]:
            - strong [ref=f78e220]: "Modos de Conducción:"
            - text: Incluye un botón
            - strong [ref=f78e221]: SINGLE/DUAL
            - text: que permite activar uno o ambos motores para gestionar el consumo de energía según la necesidad del trayecto.
        - heading "Autonomía y Gestión Inteligente de Energía" [level=3] [ref=f78e222]
        - paragraph [ref=f78e223]:
          - text: Disponible en versiones de alta capacidad, el Victor utiliza un sistema de
          - strong [ref=f78e224]: 60V
          - text: para ofrecer una aceleración sensible y largo alcance.
        - list [ref=f78e225]:
          - listitem [ref=f78e226]:
            - strong [ref=f78e227]: "Batería de Alta Gama:"
            - text: Equipado con opciones de
            - strong [ref=f78e228]: 24Ah, 27Ah y 30Ah
            - text: ", alcanzando autonomías que van desde los 75 km hasta los"
            - strong [ref=f78e229]: 100 km
            - text: con una sola carga.
          - listitem [ref=f78e230]:
            - strong [ref=f78e231]: "Sistema BMS Inteligente:"
            - text: El Sistema de Gestión de Baterías (BMS) de Dualtron supervisa y protege continuamente las celdas contra el sobrecalentamiento, la sobrecarga y la sobredescarga, prolongando la vida útil del vehículo.
          - listitem [ref=f78e232]:
            - strong [ref=f78e233]: "Carga Eficiente:"
            - text: Cuenta con dos puertos de carga que permiten reducir los tiempos de espera significativamente mediante el uso de cargadores rápidos.
        - heading "Suspensión Personalizable y Confort de Marcha" [level=3] [ref=f78e234]
        - paragraph [ref=f78e235]:
          - text: Para asegurar una conducción suave en superficies irregulares, el Dualtron Victor incorpora un sofisticado
          - strong [ref=f78e236]: sistema de suspensión de caucho
          - text: en ambas ruedas.
        - paragraph [ref=f78e237]:
          - text: "Lo que realmente diferencia a este modelo es su capacidad de personalización: el sistema utiliza"
          - strong [ref=f78e238]: cinco tipos de cartuchos reemplazables
          - text: . Esto permite a los usuarios ajustar la dureza de la suspensión según sus preferencias personales o el estado del firme, ya sean adoquines, baches o asfalto liso.
        - heading "Seguridad Avanzada en Cada Trayecto" [level=3] [ref=f78e239]
        - paragraph [ref=f78e240]: "La seguridad es el pilar fundamental del diseño de este explorador urbano:"
        - list [ref=f78e241]:
          - listitem [ref=f78e242]:
            - strong [ref=f78e243]: "Frenado Hidráulico:"
            - text: Sistema de frenos hidráulicos delanteros y traseros asistidos por discos de
            - strong [ref=f78e244]: 140 mm
            - text: ", que garantizan una frenada progresiva y potente."
          - listitem [ref=f78e245]:
            - strong [ref=f78e246]: "Asistencia Eléctrica:"
            - text: Incluye un sistema de frenado eléctrico que suaviza la deceleración y apoya la frenada mecánica.
          - listitem [ref=f78e247]:
            - strong [ref=f78e248]: "Neumáticos Anchos:"
            - text: Sus ruedas de
            - strong [ref=f78e249]: 10 x 3 pulgadas
            - text: con cámara de aire ofrecen una tracción y control excepcionales, incluso en condiciones climáticas adversas.
          - listitem [ref=f78e250]:
            - strong [ref=f78e251]: "Iluminación Integral:"
            - text: Equipado con faros LED frontales, luces de freno traseras y tiras de luces LED decorativas para una visibilidad de 360 grados.
        - heading "Tecnología y Diseño Inteligente" [level=3] [ref=f78e252]
        - paragraph [ref=f78e253]:
          - text: El Dualtron Victor no solo es potente, sino también inteligente. Gracias a la nueva
          - strong [ref=f78e254]: pantalla EY4
          - text: con conectividad
          - strong [ref=f78e255]: Bluetooth
          - text: ", puedes vincular el patinete a la"
          - strong [ref=f78e256]: APP móvil de Dualtron
          - text: "(disponible en iOS y Android) para:"
        - list [ref=f78e257]:
          - listitem [ref=f78e258]: Realizar seguimiento de estadísticas (ODO, velocidad, batería).
          - listitem [ref=f78e259]: Personalizar modos de conducción y control de crucero.
          - listitem [ref=f78e260]: Ajustar el color y los efectos de la iluminación LED.
        - paragraph [ref=f78e261]:
          - text: Su diseño plegable, que incluye el manillar, permite guardarlo cómodamente en maleteros o espacios reducidos, manteniendo una estructura robusta capaz de soportar hasta
          - strong [ref=f78e262]: 120 kg
          - text: de carga.
        - heading "Especificaciones Técnicas" [level=3] [ref=f78e263]
        - paragraph [ref=f78e264]:
          - text: Característica Detalle Técnico Motor Dual BLDC Hub Motor 1200W x 2 (Nominal) Potencia Total 2400W Batería 60V (Opciones 24Ah / 27Ah / 30Ah)Velocidad Máxima 25 km/h (Limitado) / 80 km/h (Desbloqueado) Autonomía Máxima Hasta 100 km (Versión 30Ah)Frenos Hidráulicos delanteros y traseros + Asistencia Eléctrica Suspensión Sistema de caucho con cartuchos reemplazables Ruedas10" x 3.0" con cámaras de aire Carga Máxima120 kg Peso 33,5 kg Dimensiones Plegado 1110 x 279 x 560 mm Conectividad Pantalla EY4 + APP Móvil (iOS/Android)
          - strong [ref=f78e265]: Rendimiento de Alta Gama y Autonomía Superior en Movilidad Eléctrica
        - paragraph [ref=f78e266]:
          - text: Si buscas
          - strong [ref=f78e267]: comprar el mejor patinete eléctrico potente
          - text: para moverte por la ciudad, el
          - strong [ref=f78e268]: Dualtron Victor
          - text: es la referencia absoluta en el mercado de
          - strong [ref=f78e269]: movilidad eléctrica urbana
          - text: . Este modelo destaca por su impresionante
          - strong [ref=f78e270]: doble motor de 2400W
          - text: ", que permite alcanzar una"
          - strong [ref=f78e271]: velocidad máxima de 80 km/h
          - text: en entornos privados y superar pendientes pronunciadas con total agilidad. Gracias a su robusta construcción y tecnología heredada de Minimotors, se posiciona como el
          - strong [ref=f78e272]: scooter eléctrico de alto rendimiento
          - text: preferido por los usuarios que no quieren elegir entre potencia y portabilidad.
        - paragraph [ref=f78e273]:
          - text: La experiencia de conducción se eleva gracias a su
          - strong [ref=f78e274]: batería de 60V
          - text: de alta capacidad, capaz de ofrecer una
          - strong [ref=f78e275]: autonomía de hasta 100 km
          - text: ", ideal para quienes necesitan un vehículo de larga distancia sin depender de cargas constantes. Además de su potencia, la seguridad es clave en este"
          - strong [ref=f78e276]: patinete eléctrico con frenos hidráulicos
          - text: y suspensión ajustable, garantizando un control total en cada trayecto. Con la integración de la
          - strong [ref=f78e277]: pantalla EY4 y la APP oficial de Dualtron
          - text: ", el Victor no es solo un medio de transporte, sino el"
