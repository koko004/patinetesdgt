                - paragraph [ref=f262e574]:
                  - text: Patinete Eléctrico
                  - strong [ref=f262e575]: JOYOR T-PRO certificado por la DGT
                  - text: está diseñado para usuarios que exigen potencia, comodidad y fiabilidad en la movilidad urbana diaria. Con su sistema de doble motor, suspensión avanzada y batería de larga duración, ofrece un viaje suave y potente por toda la ciudad.
                - paragraph [ref=f262e576]: Ya sea que viajes diariamente o explores nuevas rutas, el T-PRO combina rendimiento, control y diseño inteligente para una experiencia de conducción superior.
                - list [ref=f262e577]:
                  - listitem [ref=f262e578]: ✓ Autonomía de hasta 70-90 km
                  - listitem [ref=f262e579]: ✓ Motores dobles de 500W nominales (1000W de potencia total nominal, 1600W pico máximo)
                  - listitem [ref=f262e580]: ✓ Suspensión hidráulica delantera y trasera
                  - listitem [ref=f262e581]: ✓ Frenos de disco hidráulicos delanteros y traseros
                  - listitem [ref=f262e582]: ✓ Llaves NFC para mayor seguridad
                  - listitem [ref=f262e583]: ✓ Neumáticos neumáticos de 10” para máxima estabilidad
                  - listitem [ref=f262e584]: ✓ Sistema completo de iluminación con intermitentes integrados
                  - listitem [ref=f262e585]: ✓ Pantalla LCD multicolor
                - paragraph [ref=f262e586]:
                  - text: Certificado por la DGT, el
                  - strong [ref=f262e587]: Joyor T-PRO DGT
                  - text: cumple con todos los requisitos legales para su uso en vías públicas en España.
                - paragraph [ref=f262e588]:
                  - strong [ref=f262e589]: Rendimiento imparable con doble motor
                - paragraph [ref=f262e590]:
                  - text: Equipado con dobles motores de 500W, el
                  - strong [ref=f262e591]: Joyor T-PRO
                  - text: ofrece una aceleración potente y una potencia constante para la conducción urbana. Ya sea navegando el tráfico o subiendo calles de la ciudad, el rendimiento siempre está de tu lado.
                - paragraph [ref=f262e592]:
                  - strong [ref=f262e593]: Conquista las pendientes urbanas con facilidad
                - paragraph [ref=f262e594]: Conquista las pendientes urbanas con facilidadDiseñado para manejar inclinaciones de hasta 20°, el T-PRO te brinda la confianza para desplazarte por entornos urbanos exigentes sin perder impulso.
                - paragraph [ref=f262e595]:
                  - strong [ref=f262e596]: Viaja más lejos, con menos estrés
                - paragraph [ref=f262e597]: Disfruta de hasta 90 km de autonomía con una sola carga. Perfecto para desplazamientos diarios y recorridos largos por la ciudad sin preocuparte constantemente por el nivel de batería.
                - paragraph [ref=f262e598]:
                  - strong [ref=f262e599]: Rendimiento Avanzado de la Batería
                - paragraph [ref=f262e600]: La batería de alta capacidad garantiza una salida estable, una larga vida útil y un rendimiento confiable para el uso diario. 48 V 26 Ah
                - paragraph [ref=f262e601]:
                  - strong [ref=f262e602]: Viaje suave, en cada calle
                - paragraph [ref=f262e603]: Desde el asfalto liso hasta caminos irregulares, la T-PRO está diseñada para absorber las vibraciones y ofrecer un viaje cómodo y controlado en todas las condiciones urbanas.
                - paragraph [ref=f262e604]:
                  - strong [ref=f262e605]: Frenado hidráulico, confianza total
                - paragraph [ref=f262e606]: Los frenos de disco hidráulicos delanteros y traseros ofrecen una potencia de frenado precisa y una respuesta suave, brindándote control total a cualquier velocidad.
                - paragraph [ref=f262e607]:
                  - strong [ref=f262e608]: Domina la carretera, conquista la ciudad
                - paragraph [ref=f262e609]: Equipado con neumáticos neumáticos de 10”, el T-PRO ofrece un excelente agarre, absorción de impactos y estabilidad, ideal tanto para calles lisas como para superficies más irregulares.
                - paragraph [ref=f262e610]:
                  - strong [ref=f262e611]: Sistema Avanzado de Suspensión Hidráulica
                - paragraph [ref=f262e612]: Con suspensión hidráulica de muelle delantera y trasera, el T-PRO absorbe los impactos de manera eficiente, mejorando la estabilidad y el confort en cada viaje.
                - paragraph [ref=f262e613]:
                  - strong [ref=f262e614]: Sistema completo de iluminación y señales de giro
                - paragraph [ref=f262e615]: Conduce con total visibilidad gracias a una potente luz frontal, luz de freno trasera y señales de giro integradas. El Joyor T-PRO está diseñado para una conducción segura en el tráfico urbano y en condiciones de poca luz.
                - paragraph [ref=f262e616]:
                  - strong [ref=f262e617]: Dóblalo rápido, llévalo fácil
                - paragraph [ref=f262e618]: El Joyor T-PRO cuenta con un sistema de plegado fuerte y confiable, que te permite plegar y guardar el scooter rápidamente cuando lo necesites. 29,6 kg
                - paragraph [ref=f262e619]:
                  - strong [ref=f262e620]: Diseñado para la comodidad y un diseño inteligente
                - paragraph [ref=f262e621]: Con una tabla ancha, estructura sólida y diseño ergonómico, la T-PRO garantiza una posición de conducción cómoda y estable para el uso diario.
                - paragraph [ref=f262e622]:
                  - strong [ref=f262e623]: Controla todo desde un solo lugar
                - paragraph [ref=f262e624]: "La pantalla LCD multicolor y el panel de control te brindan acceso completo a las funciones esenciales:"
