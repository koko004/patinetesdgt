              - generic [ref=f158e537]:
                - generic [ref=f158e540]:
                  - 'heading "Patinete Eléctrico Rovoron R5 (60V 21Ah): El equilibrio perfecto entre potencia y agilidad urbana" [level=2] [ref=f158e541]'
                  - paragraph [ref=f158e542]:
                    - text: ¿Preparado para llevar tu movilidad al siguiente nivel? El patinete eléctrico
                    - strong [ref=f158e543]: Rovoron R5
                    - text: en su versión de 60V 21Ah llega para demostrar que no tienes que renunciar a la agilidad cuando buscas un rendimiento de alta gama. Desarrollado por la prestigiosa familia Minimotors, el R5 es el vehículo definitivo para quienes exigen velocidad, estabilidad y componentes de primera calidad.
                  - paragraph [ref=f158e544]: En imoveblue.es, tu tienda especializada en nueva movilidad, te presentamos esta máquina homologada y lista para dominar el asfalto.
                  - heading "Rendimiento y Autonomía Sin Excusas" [level=2] [ref=f158e545]
                  - list [ref=f158e546]:
                    - listitem [ref=f158e547]: "Potencia Dual de hasta 3000W: Sus dos potentes motores, gestionados por controladores Sine Wave (2x30A), generan un pico máximo de 3000W. Aceleración contundente y fuerza de sobra para subir pendientes de hasta el 30% de desnivel sin perder el ritmo."
                    - listitem [ref=f158e548]: "Batería Samsung 60V 21Ah: Olvídate del estrés por la carga. Gracias a la fiabilidad de sus celdas Samsung de 60 voltios y 21 amperios, disfrutarás de hasta 60 kilómetros de autonomía con una sola carga. Ideal para trayectos largos y desplazamientos diarios de ida y vuelta."
                    - listitem [ref=f158e549]: "Homologado por la DGT: Circula 100% legal y sin preocupaciones. El Rovoron R5 viene limitado de fábrica a 25 km/h para cumplir con la normativa vigente de Vehículos de Movilidad Personal (VMP) en España."
                  - heading "Máximo Confort y Seguridad en Ruta" [level=2] [ref=f158e550]
                  - list [ref=f158e551]:
