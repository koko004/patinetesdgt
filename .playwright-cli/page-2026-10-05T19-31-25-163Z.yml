    - generic [ref=f90e205]:
      - heading "Patinete Eléctrico Dualtron Victor Luxury Plus EY4" [level=2] [ref=f90e207]
      - generic [ref=f90e209]:
        - 'heading "Dualtron Victor Luxury Plus: El Patinete Eléctrico de Alta Gama con Mayor Autonomía y Confort" [level=3] [ref=f90e210]'
        - paragraph [ref=f90e211]: El Dualtron Victor Luxury Plus se posiciona como el referente definitivo dentro de la gama Victor. Diseñado específicamente para aquellos usuarios que no quieren sacrificar agilidad por espacio, este modelo ofrece dimensiones ampliadas y características tecnológicas de vanguardia, manteniendo la potencia bruta característica de la marca.
        - paragraph [ref=f90e212]: Es la opción ideal para conductores de mayor estatura o para quienes buscan una base de apoyo más amplia y una postura de conducción erguida y relajada, tanto en trayectos urbanos como en aventuras de larga distancia.
        - heading "Ergonomía y Confort Mejorados" [level=3] [ref=f90e213]
        - paragraph [ref=f90e214]: "El Victor Luxury Plus ha sido rediseñado para maximizar la comodidad del usuario mediante dos modificaciones estructurales clave:"
        - list [ref=f90e215]:
          - listitem [ref=f90e216]:
            - strong [ref=f90e217]: "Tubo de dirección extendido:"
            - text: El manillar es 60 mm más alto que el modelo estándar, facilitando una postura ergonómica que reduce la fatiga en brazos y espalda.
          - listitem [ref=f90e218]:
            - strong [ref=f90e219]: "Base (Deck) ampliada:"
            - text: La plataforma cuenta con 60 mm adicionales de longitud, proporcionando un espacio generoso para los pies que mejora significativamente la estabilidad y el control.
          - listitem [ref=f90e220]:
            - strong [ref=f90e221]: "Suspensión ajustable:"
            - text: Equipado con el sistema de cartuchos de goma Dualtron, permite personalizar la amortiguación en 9 niveles diferentes para adaptarse a cualquier tipo de pavimento.
        - heading "Rendimiento y Autonomía de Largo Alcance" [level=3] [ref=f90e222]
        - paragraph [ref=f90e223]: Equipado con dos motores BLDC de 1300W cada uno, este patinete entrega una potencia nominal de 2600W, capaz de alcanzar velocidades de hasta 80 km/h (uso exclusivo en terrenos privados) y superar pendientes pronunciadas sin esfuerzo.
        - paragraph [ref=f90e224]: "Para gestionar esta potencia, el Victor Luxury Plus ofrece configuraciones de batería de alta densidad:"
        - list [ref=f90e225]:
          - listitem [ref=f90e226]:
            - strong [ref=f90e227]: "Batería 60V 31.5Ah / 35Ah:"
            - text: Permite alcanzar una autonomía impresionante de hasta 110-120 km con una sola carga.
          - listitem [ref=f90e228]:
            - strong [ref=f90e229]: "Gestión Inteligente (BMS):"
            - text: Un sistema avanzado protege las celdas contra sobrecargas, cortocircuitos y sobrecalentamiento, alargando la vida útil del componente.
          - listitem [ref=f90e230]:
            - strong [ref=f90e231]: "Doble puerto de carga:"
            - text: Permite conectar dos cargadores simultáneamente para reducir el tiempo de espera a la mitad.
        - heading "Tecnología y Seguridad de Vanguardia" [level=3] [ref=f90e232]
        - paragraph [ref=f90e233]: "La seguridad es el pilar central de este modelo. No solo se trata de ir rápido, sino de ir seguro en cualquier condición:"
        - list [ref=f90e234]:
          - listitem [ref=f90e235]:
            - strong [ref=f90e236]: "Frenado Hidráulico NUTT:"
            - text: Frenos de disco hidráulicos de 140 mm en ambas ruedas que garantizan una detención precisa y progresiva.
          - listitem [ref=f90e237]:
            - strong [ref=f90e238]: "Pantalla Inteligente EY4:"
            - text: La nueva pantalla panorámica de alta visibilidad es compatible con la App oficial de Dualtron (iOS y Android), permitiendo configurar el control de crucero, los modos de potencia y personalizar la iluminación LED.
          - listitem [ref=f90e239]:
            - strong [ref=f90e240]: "Iluminación Integral:"
            - text: Incluye faro delantero de alta intensidad, intermitentes para señalización de giro, bocina electrónica y un spoiler trasero multifuncional que integra luz de freno y actúa como asa de transporte.
        - heading "Especificaciones Técnicas Detalladas" [level=3] [ref=f90e241]
        - list [ref=f90e242]:
          - listitem [ref=f90e243]:
            - strong [ref=f90e244]: "Motor:"
            - text: Dual Motor 1300W x 2 (Potencia nominal 2600W).
          - listitem [ref=f90e245]:
            - strong [ref=f90e246]: "Velocidad máxima:"
            - text: 80 km/h (Limitado a 25 km/h por normativa vigente. Deslimitado solo para uso en propiedades privadas).
          - listitem [ref=f90e247]:
            - strong [ref=f90e248]: "Batería:"
            - text: 31.5Ah / 35Ah (Celdas de alta calidad CN/LG/Samsung según versión).
          - listitem [ref=f90e249]:
            - strong [ref=f90e250]: "Autonomía:"
            - text: Entre 90 km y 120 km (Dependiendo del peso del conductor y modo de conducción).
          - listitem [ref=f90e251]:
            - strong [ref=f90e252]: "Tiempo de carga:"
            - text: 7 a 15 horas (Reducible con cargador rápido o doble cargador).
          - listitem [ref=f90e253]:
            - strong [ref=f90e254]: "Ruedas:"
            - text: Neumáticos de 10 pulgadas con cámara de aire para mayor absorción.
          - listitem [ref=f90e255]:
            - strong [ref=f90e256]: "Frenos:"
            - text: Hidráulicos NUTT delanteros y traseros de 140 mm + Freno eléctrico.
          - listitem [ref=f90e257]:
            - strong [ref=f90e258]: "Carga máxima:"
            - text: 120 kg.
          - listitem [ref=f90e259]:
            - strong [ref=f90e260]: "Peso:"
            - text: 37.4 kg.
          - listitem [ref=f90e261]:
            - strong [ref=f90e262]: "Dimensiones:"
            - text: Distancia entre ejes de 940 mm y altura libre al suelo de 180 mm.
          - listitem [ref=f90e263]:
            - strong [ref=f90e264]: "Plegado:"
            - text: Manillar y mástil plegables para almacenamiento optimizado.
          - listitem [ref=f90e265]:
            - strong [ref=f90e266]: "Conectividad:"
            - text: Pantalla EY4 con conexión Bluetooth a App Dualtron.
          - listitem [ref=f90e267]:
            - strong [ref=f90e268]: "Certificación:"
            - text: Homologado por la DGT (Modelo 2025).
        - heading "Contenido del paquete" [level=3] [ref=f90e269]
        - list [ref=f90e270]:
          - listitem [ref=f90e271]: 1 x Patinete Eléctrico Dualtron Victor Luxury Plus.
          - listitem [ref=f90e272]: 1 x Cargador estándar.
          - listitem [ref=f90e273]: 1 x Kit de herramientas básico.
          - listitem [ref=f90e274]: 1 x Manual de usuario.
        - paragraph [ref=f90e275]:
          - text: "Potencia Dual de 2600W y Diseño Ergonómico: La Evolución de la Movilidad Urbana Premium Si buscas"
          - strong [ref=f90e276]: comprar el mejor patinete eléctrico potente
          - text: de 2026, el
          - strong [ref=f90e277]: Dualtron Victor Luxury Plus
          - text: es la opción definitiva para quienes exigen rendimiento sin compromisos. Este modelo destaca en el mercado de la
          - strong [ref=f90e278]: movilidad urbana
          - text: por su impresionante configuración de
          - strong [ref=f90e279]: doble motor
          - text: ", que entrega una potencia constante para superar cualquier pendiente. Además, al estar"
          - strong [ref=f90e280]: homologado por la DGT
          - text: ", garantiza una circulación segura y legal, combinando la velocidad de un vehículo de alto rendimiento con la fiabilidad de la ingeniería coreana de Minimotors."
        - paragraph [ref=f90e281]:
          - text: La experiencia de conducción se eleva gracias a su
          - strong [ref=f90e282]: batería de largo alcance
          - text: ", capaz de ofrecer hasta"
          - strong [ref=f90e283]: 120 km de autonomía
          - text: ", eliminando la ansiedad por la carga en trayectos largos. Este"
