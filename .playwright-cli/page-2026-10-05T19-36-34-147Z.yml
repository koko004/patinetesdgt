                  - 'heading "Patinete Eléctrico Rovoron R5 Pro (60V 37Ah): La experiencia Premium definitiva sin límites de distancia" [level=2] [ref=f160e555]'
                  - paragraph [ref=f160e556]:
                    - text: Para aquellos que no se conforman con lo estándar, llega el patinete eléctrico
                    - strong [ref=f160e557]: Rovoron R5 Pro
                    - text: en su versión tope de gama de 60V 37Ah. Bajo el inconfundible sello de calidad de Minimotors, este modelo coge la base excelente del R5 y la eleva a la categoría "Pro", incorporando componentes de rendimiento superior para los pilotos más exigentes pero a un precio nunca imaginado, haciéndolo accesible cualquier rider.
                  - paragraph [ref=f160e558]:
                    - text: En imoveblue.es sabemos que buscas lo mejor del mercado. El
                    - strong [ref=f160e559]: Rovoron R5 Pro certificado por la DGT
                    - text: combina una autonomía monstruosa con una frenada y un control de nivel superior. Es, sin duda, la máquina total para la ciudad y más allá.
                  - heading "¿Qué diferencia la versión Rovoron R5 pro de la versión R5 normal?" [level=2] [ref=f160e560]
                  - list [ref=f160e561]:
                    - listitem [ref=f160e562]: Frenos de disco hidráulico para una frenada mas precisa y potente.
                    - listitem [ref=f160e563]: Batería infinita de mayor capacidad de 60V 37Ah con celdas Samsung
                    - listitem [ref=f160e564]: Manillar plegable para ahorrar espacio a la hora de guardarlo
                  - heading "¿Qué hace al R5 Pro el rey de la calle?" [level=2] [ref=f160e565]
                  - list [ref=f160e566]:
                    - listitem [ref=f160e567]: "Frenada Hidráulica de Alta Precisión (Exclusivo Pro): La potencia exige control. A diferencia de las versiones estándar, el modelo Pro incorpora frenos de disco hidráulicos que ofrecen un tacto mucho más suave, preciso y una capacidad de detención radicalmente superior. Tu seguridad, garantizada a cualquier velocidad."
                    - listitem [ref=f160e568]: "Autonomía Extrema (Batería 60V 37Ah): Equipado con un pack de baterías masivo, este patinete es un auténtico maratoniano. Disfruta de hasta 110 kilómetros de autonomía con una sola carga. Olvídate del cargador durante días y lánzate a hacer rutas largas sin ansiedad por la batería."
                    - listitem [ref=f160e569]: "Potencia Dual Arrolladora: Cuenta con un motor dual de altísimo rendimiento impulsado por controladores Sine Wave. Con más de 3000W de potencia pico, disfrutarás de una aceleración fulgurante, capaz de devorar cuestas y pendientes pronunciadas como si no existieran."
                    - listitem [ref=f160e570]:
                      - text: "100% Homologado (DGT): Muévete con la máxima tranquilidad. El"
                      - strong [ref=f160e571]: Rovoron R5 Pro
                      - text: cumple con todas las normativas de la DGT para Vehículos de Movilidad Personal (VMP) en España, estando limitado a 25 km/h.
                  - heading "Tecnología, Confort y Diseño Premium" [level=2] [ref=f160e572]
                  - list [ref=f160e573]:
                    - listitem [ref=f160e574]: "Neumáticos Tubeless de 10\" Extra Anchos: Ruedas sin cámara (10x3.0-6.5) diseñadas para agarrarse al asfalto en las curvas más cerradas y reducir casi a cero el riesgo de pinchazos."
                    - listitem [ref=f160e575]: "Suspensión Dual Avanzada: Su sistema de suspensión delantera y trasera por muelles está calibrado para soportar conducción intensiva, filtrando a la perfección baches, resaltos y adoquines."
                    - listitem [ref=f160e576]: "Iluminación y Certificación IPX6: Déjate ver gracias a su potente faro LED, luces de freno y detalles lumínicos en el chasis. Además, su certificación IPX6 lo protege contra lluvias inesperadas y charcos, sellando su electrónica."
