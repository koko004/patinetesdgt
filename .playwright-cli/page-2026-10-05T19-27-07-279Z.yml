    - generic [ref=f28e291]:
      - heading "Odyssr Rodeo Mono" [level=2] [ref=f28e293]
      - generic [ref=f28e295]:
        - heading "Patinete eléctrico Odyssr Rodeo Mono 800W Homologado DGT" [level=3] [ref=f28e296]
        - paragraph [ref=f28e297]:
          - text: El
          - strong [ref=f28e298]: Odyssr Rodeo Mono
          - text: es un patinete eléctrico de alto rendimiento diseñado para la movilidad urbana avanzada. Combina la potencia y la robustez necesarias para afrontar desniveles exigentes con la total tranquilidad que ofrece su
          - strong [ref=f28e299]: homologación por la DGT
          - text: (Dirección General de Tráfico). Es el vehículo ideal para usuarios que buscan un transporte diario fiable, seguro y de largo alcance.
        - heading "Especificaciones Técnicas Básicas" [level=2] [ref=f28e300]
        - paragraph [ref=f28e301]: Detalle Técnico Motorización Motor Dual de 800W nominales Batería Ión de Litio 52V 18Ah (936 Wh) Autonomía Máxima Hasta 60 km (según condiciones de conducción) Velocidad Máxima 25 km/h (Limitado de fábrica por normativa VMP) Sistema de Frenado Frenos de disco (delantero y trasero) Neumáticos 10″ Pulgadas - Tipo Tubeless (sin cámara) Ángulo de Subida Hasta 35º de pendiente Pantalla multifunción LCD integrada Capacidad de Carga Hasta 120 kg Peso del Vehículo 28 kg Certificación Homologado por la DGT
        - heading "Características Destacadas y Análisis Técnico" [level=2] [ref=f28e302]
        - heading "1. Sistema de Propulsión y Potencia Dinámica" [level=3] [ref=f28e303]
        - paragraph [ref=f28e304]:
          - text: Equipado con un sistema de
          - strong [ref=f28e305]: Motor Dual de 800W
          - text: ", el Odyssr Rodeo Mono ofrece una aceleración lineal y una fuerza de empuje superior a la media del mercado urbano. Esta configuración le permite afrontar pendientes pronunciadas de hasta"
          - strong [ref=f28e306]: 35º de inclinación
          - text: sin apenas pérdida de velocidad, ideal para ciudades con topografía irregular. Aunque su velocidad está electrónicamente limitada a
          - strong [ref=f28e307]: 25 km/h
          - text: para cumplir estrictamente con la normativa legal de Vehículos de Movilidad Personal (VMP), el torque disponible garantiza una respuesta inmediata en situaciones de tráfico.
        - heading "2. Gestión Energética y Autonomía Real" [level=3] [ref=f28e308]
        - paragraph [ref=f28e309]:
          - text: El corazón del patinete es su batería de alta capacidad de
          - strong [ref=f28e310]: 52V y 18Ah
          - text: ", lo que se traduce en una reserva de energía total de"
          - strong [ref=f28e311]: 936 Wh
          - text: . Gracias a esta arquitectura de voltaje superior (52V), el patinete mantiene un rendimiento óptimo incluso cuando el nivel de carga empieza a descender. Consigue una autonomía extendida de
          - strong [ref=f28e312]: hasta 60 kilómetros
          - text: con una sola carga, reduciendo la frecuencia de carga y eliminando el estrés por la distancia en los trayectos diarios.
        - 'heading "3. Seguridad Activa: Frenado y Neumáticos" [level=3] [ref=f28e313]'
        - list [ref=f28e314]:
          - listitem [ref=f28e315]:
            - strong [ref=f28e316]: "Frenos de Disco:"
            - text: Monta un sistema de frenado de disco de alta fricción que garantiza distancias de parada mínimas y seguras, incluso sobre superficies mojadas o en descensos prolongados.
          - listitem [ref=f28e317]:
            - strong [ref=f28e318]: "Ruedas Tubeless de 10″:"
            - text: Al prescindir de cámara de aire (
            - emphasis [ref=f28e319]: tubeless
            - text: ), el riesgo de reventón o pinchazo por pellizco se reduce drásticamente. El diámetro de 10 pulgadas aporta un efecto giroscópico estabilizador y absorbe con mayor eficacia las imperfecciones del asfalto, grietas y adoquines.
        - heading "4. Interfaz de Usuario y Control" [level=3] [ref=f28e320]
        - paragraph [ref=f28e321]:
          - text: El cuadro de mandos cuenta con una
          - strong [ref=f28e322]: pantalla multifunción LCD
          - text: "de alta visibilidad en exteriores. Este display permite monitorizar en tiempo real todos los parámetros críticos del viaje:"
        - list [ref=f28e323]:
          - listitem [ref=f28e324]: Velocidad instantánea.
          - listitem [ref=f28e325]: Estado y nivel de carga de la batería.
          - listitem [ref=f28e326]: Modo de conducción seleccionado.
          - listitem [ref=f28e327]: Kilometraje total y parcial.
        - paragraph [ref=f28e328]:
          - text: ⚠️
          - strong [ref=f28e329]: "Nota de Cumplimiento Legal:"
          - text: Este modelo cuenta con el certificado de homologación oficial de la DGT, lo que garantiza que cumple con todos los requisitos técnicos de seguridad, iluminación, frenado y limitación de velocidad exigidos para circular de forma totalmente legal por las vías públicas urbanas
        - heading "Descubre el patinete eléctrico con motor dual y 60 km de autonomía ideal para la ciudad" [level=3] [ref=f28e330]
        - paragraph [ref=f28e331]:
          - text: Si buscas el vehículo de movilidad personal definitivo para tus trayectos diarios, el
          - strong [ref=f28e332]: patinete eléctrico Odyssr Rodeo Mono
          - text: es la solución perfecta. Este modelo destaca en el mercado actual por ser un
          - strong [ref=f28e333]: patinete eléctrico homologado por la DGT
          - text: ", lo que te garantiza circular con total legalidad y seguridad por las vías urbanas de España. Equipado con un potente"
          - strong [ref=f28e334]: motor dual de 800W
          - text: y una
          - strong [ref=f28e335]: batería de 52V 18Ah
          - text: ", este patinete ofrece una aceleración excepcional capaz de superar pendientes de hasta 35º y proporciona una impresionante"
          - strong [ref=f28e336]: autonomía de hasta 60 kilómetros
          - text: con una sola carga, eliminando por completo la preocupación por la distancia.
        - paragraph [ref=f28e337]:
          - text: La experiencia de conducción y la seguridad activa se elevan a otro nivel gracias a sus prestaciones premium. El Odyssr Rodeo Mono incorpora unas
          - strong [ref=f28e338]: ruedas de 10 pulgadas tubeless
          - text: (sin cámara) que reducen drásticamente el riesgo de pinchazos y aseguran una estabilidad óptima en el asfalto. Su eficiente
          - strong [ref=f28e339]: sistema de frenado de disco
          - text: garantiza una parada firme y segura en cualquier situación, mientras que su
          - strong [ref=f28e340]: pantalla multifunción LCD
          - text: integrada te permite controlar la velocidad, el modo de conducción y el estado de la batería en tiempo real. Disfruta de la libertad urbana con un patinete potente, robuste y diseñado para durar. El
          - strong [ref=f28e341]: Odyssr Rodeo Mono 52V 18Ah (Homologado DGT)
          - text: "es un patinete eléctrico homologado para circular por vías públicas según la normativa DGT española. Seguro, fiable y legal: la forma más inteligente de moverte por la ciudad sin preocupaciones."
