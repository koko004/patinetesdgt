                - paragraph [ref=f13e187]
                - paragraph [ref=f13e188]:
                  - text: El
                  - strong [ref=f13e189]: KuKirin G2
                  - text: se trata de un patinete eléctrico de la marca Kugoo que está diseñado para el día a día. Gracias a sus especificaciones, califica como una gran opción para transporte de movilidad cotidiano. Su potencia de motor permite subir pendientes con gran inclinación, además de sus
                  - strong [ref=f13e190]: neumáticos resistentes, autonomía y pantalla LCD
                  - text: . Una gran opción plegable que te permite cargarlo con facilidad para guardarlo cuando no lo utilices.
                - paragraph [ref=f13e191]:
                  - text: Permite ser conducido incluso bajo la lluvia debido a su certificación. Su iluminación hace de la vista nocturna una visión clara. Dispone de un gran soporte de peso, permitiendo hasta 120Kg sin disminuir su potencia.
                  - strong [ref=f13e192]: Con 3 modos de velocidad podrás conducir en la velocidad de tu preferencia
                  - text: sin cansarte de la mano por aceleración.
                - paragraph [ref=f13e193]
                - heading [level=2] [ref=f13e194]:
                  - strong [ref=f13e195]: "KuKirin G2: nueva versión"
                - paragraph [ref=f13e196]: La marca KuKirin continúa evolucionando sus modelos más populares, y el G2 no es la excepción. En su nueva versión, el patinete eléctrico presenta una serie de mejoras técnicas y de diseño que refuerzan su fiabilidad y rendimiento para el día a día.
                - paragraph [ref=f13e197]: "Entre las principales novedades destacan:"
                - list [ref=f13e198]:
                  - listitem [ref=f13e199]:
                    - paragraph [ref=f13e200]:
                      - strong [ref=f13e201]: Disco de freno trasero ampliado de 140 mm a 160 mm
                      - text: ", proporcionando una frenada más potente y progresiva."
                  - listitem [ref=f13e202]:
                    - paragraph [ref=f13e203]:
                      - strong [ref=f13e204]: Nueva luz trasera integrada en el chasis
                      - text: ", mejorando tanto la visibilidad como la estética."
                  - listitem [ref=f13e205]:
                    - paragraph [ref=f13e206]:
                      - strong [ref=f13e207]: Guardabarros trasero reforzado
                      - text: ", más resistente a impactos y vibraciones."
                  - listitem [ref=f13e208]:
                    - paragraph [ref=f13e209]:
                      - strong [ref=f13e210]: Base completamente sellada
                      - text: ", que ofrece mayor protección contra el agua y las condiciones climáticas."
                  - listitem [ref=f13e211]:
                    - paragraph [ref=f13e212]:
                      - strong [ref=f13e213]: Horquilla delantera rediseñada
                      - text: ", con mejoras en la estabilidad, durabilidad y comportamiento en terrenos irregulares."
                - heading [level=3] [ref=f13e214]:
                  - strong [ref=f13e215]: Diseño plegable
                - paragraph [ref=f13e216]:
                  - text: El KuKirin G2 dispone de un
                  - strong [ref=f13e217]: modelo plegable, gracias a su mecanismo con un solo botón
                  - text: ", se pliega y despliega en pocos segundos. Además, dispone de un sistema de bloqueo que asegura que no se despliegue accidentalmente durante el transporte, ofreciendo una experiencia de uso segura para que puedas cargarlo fácilmente."
                - heading [level=3] [ref=f13e218]:
                  - strong [ref=f13e219]: Pantalla LCD
                - paragraph [ref=f13e220]:
                  - text: La
                  - strong [ref=f13e221]: pantalla táctil LCD está incorporada en el manillar
                  - text: ", es una pantalla inteligente y de alta definición, lo que proporciona información en tiempo real sobre la velocidad, la batería, el kilometraje y la marcha actual. De esta forma, puedes estar al tanto sobre las características al conducir. Añadiendo que, puedes cambiar modos de conducción, ajustando el brillo para situaciones bajo el sol o en oscuridad puedas ver con claridad."
                - heading [level=3] [ref=f13e222]:
                  - strong [ref=f13e223]: Motor de gran potencia
                - paragraph [ref=f13e224]:
                  - text: Cuenta con un
                  - strong [ref=f13e225]: motor de cubo integrado de 800W
                  - text: y un modo de aceleración con el que experimentarás una aceleración suave y una potencia continua. Sus tres modos de velocidad te permiten elegir entre 15 km/h,25Km/h y 45 km/h, adaptándose a tus necesidades diarias y permitiendo conducirlo dentro de las normativas europeas. Su potencia permite subir pendientes de hasta 20° de inclinación y permite un peso máximo de 120 kg, ideal para cualquier persona.
                - heading [level=3] [ref=f13e226]:
                  - strong [ref=f13e227]: Autonomía de gran alcance
                - paragraph [ref=f13e228]:
                  - text: Equipado con una
                  - strong [ref=f13e229]: batería de litio de alto rendimiento de 48V y 15Ah
                  - text: ", permite una autonomía de hasta 55 km a velocidad media. Ideal para desplazamientos diarios o escapadas de fin de semana, este scooter te permite explorar sin preocuparte por la carga. Además, toma un tiempo de carga de 8-9 horas, por lo que puedes conectarlo a cargar durante las noches para que en la mañana tengas un VMP totalmente funcional."
                - heading [level=3] [ref=f13e230]:
                  - strong [ref=f13e231]: Neumáticos todoterreno
                - paragraph [ref=f13e232]:
                  - text: Equipado con
                  - strong [ref=f13e233]: neumáticos de vacío de 10
                  - text: ” dispone de un excelente agarre y absorción de impactos. Estos neumáticos reducen significativamente el riesgo de caídas, garantizando una conducción segura y cómoda en diversas condiciones de la carretera. Desde el asfalto urbano hasta senderos podrás vivir nuevas experiencias seguras y a todo terreno.
                - heading [level=3] [ref=f13e234]:
                  - strong [ref=f13e235]: Frenos de calidad
                - paragraph [ref=f13e236]:
                  - text: Los
                  - strong [ref=f13e237]: frenos de disco delanteros y traseros garantizan una respuesta rápida y segura
                  - text: ", incluso a altas velocidades. La distancia de frenado, controlada entre 4 y 10 metros, asegura un frenado eficiente en situaciones de emergencia. Su disipación de calor rápida permite un frenado seguro y estratégico que te ayudara en caso improvistos."
                - heading [level=3] [ref=f13e238]:
                  - strong [ref=f13e239]: Peso ligero y facilidad de guardado
                - paragraph [ref=f13e240]:
                  - text: Cuenta con un
                  - strong [ref=f13e241]: peso neto de aproximadamente 26 kg
                  - text: y un diseño estructural optimizado, este patinete eléctrico es fácil de transportar y almacenar. Su tamaño compacto plegado lo hace ideal para llevar al trabajo o guardar en el maletero del automóvil.
                - heading "Especificaciones técnicas del Kukirin G2" [level=2] [ref=f13e242]
