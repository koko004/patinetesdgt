              - generic [ref=f172e685]:
                - heading "MASSCITY TEVERUN BLADE GT II+ Certificado por la DGT, tecnologçia y vanguardia" [level=2] [ref=f172e686]
                - paragraph [ref=f172e687]:
                  - text: El
                  - strong [ref=f172e688]: MASSCITY BLADE GT II+ Certificado
                  - text: es el patinete más perfecto y tecnológicamente más avanzado del mercado. Gracia a su pantalla TFT insertada en el manillar y sus innumerables funciones podrás tener información detallada en tiempo real de la batería, motores, controladores, etc. Además, gracias a su conectividad Bluetooth podrás llevar un control total del patinete desde la APP Teverun.
                - paragraph [ref=f172e689]: Sus dos motores de 500w nominales te llevarán donde necesites con una comodidad y fiabilidad premium.
                - paragraph [ref=f172e690]:
                  - text: La batería de 52v 20.8ah del
                  - strong [ref=f172e691]: MASSCITY TEVERUN BLADE GT II 2 Plus Certificado
                  - text: otorga amplio rango de recorrido. Sus ruedas de 11 pulgadas junto a con el sistema de suspensión hace al Blade GT II+ un patinete extremadamente confortable.
                - paragraph [ref=f172e692]: Tanto si eres un usuario nuevo de patinete eléctrico como si ya has probado esta nueva forma de movilidad las sensaciones que va a despertar en ti conducir un BLADE GT II+ te van a sorprender.
                - paragraph [ref=f172e693]:
                  - text: Gracias a todas sus innovaciones técnicas y sus altos standard de calidad este patinete te va a enamorar. Su rápida respuesta gracias a sus dos motores de 500w y batería de 52v y la seguridad que transmite hacen del
                  - strong [ref=f172e694]: Blade GT II+
                  - text: un vehículo ideal para todos aquellos que quieren desplazarse a diario con garantías y sin problemas.
                - paragraph [ref=f172e695]: En cuanto al servicio post venta, en MASSCITY estacomprometidos para que tu experiencia como usuario sea excelente y por ello disponemos de todos los recambios de este modelo para que si lo necesitas no tengas que esperar.
                - paragraph [ref=f172e696]: Este patinete cumple con la normativa y certificación de la DGT para VMP y podrá ser utilizado más allá del 2027.
                - paragraph [ref=f172e697]:
                  - strong [ref=f172e698]: PANTALLA TFT 3'' A COLOR
                - paragraph [ref=f172e699]: Ten control total de las funciones del Blade GT II+ con un rápido vistazo a su pantalla TFT.
                - paragraph [ref=f172e700]:
                  - strong [ref=f172e701]: CONEXIÓN BLUETOOTH CON APP TEVERUN
                - paragraph [ref=f172e702]: Conecta tu Blade GT II+ con la APP Teverun que encontrarás en la tienda de aplicaciones Android o IOS y configura el patinete a tu gusto. Además tendrás información detallada de todos los parámetros de tu vehículo.
                - paragraph [ref=f172e703]:
                  - strong [ref=f172e704]: ON-OFF CON TARJETA NFC
                - paragraph [ref=f172e705]: Sistema de encendido y apagado del patinete con tarjeta NFC. Aproxima tu tarjeta al punto NFC y podrás encender y apagar el GT II+ fácilmente. También podrás configurar tu smartphone para encender y apagar el patiente.
                - paragraph [ref=f172e706]:
                  - strong [ref=f172e707]: SISTEMA ANTI ROBO
                - paragraph [ref=f172e708]:
                  - text: Podrás configurar una contraseña que se solicita cuando enciendes el
                  - strong [ref=f172e709]: Blade GT 2+
                  - text: . De esta forma tendrás dos niveles de seguridad anti robo.
                - paragraph [ref=f172e710]:
                  - strong [ref=f172e711]: SMART BMS
                - paragraph [ref=f172e712]: Ten control total sobre el estado de la batería del GT II+. Sabrás en tiempo real el voltaje de todas las series de la batería, ciclos de carga, alarmas y mucho más.
                - paragraph [ref=f172e713]:
                  - strong [ref=f172e714]: DOS MOTORES DE 500W
                - paragraph [ref=f172e715]: Un total de 1000w (2900w de pico) que te llevarán todo lo lejos que tu necesites. Podrás activar o desactivar el motor delantero según tus necesidades. Potencia máxima autorizada por la DGT.
                - paragraph [ref=f172e716]:
                  - strong [ref=f172e717]: BATERÍA DE 52V 20.8Ah
                - paragraph [ref=f172e718]:
                  - text: Montada con celdas de alta calidad, la batería del
                  - strong [ref=f172e719]: MASSCITY BLADE GT II+ Certificado
                  - text: te proporcionará muchos kms de autonomía y una vida útil extensa. Incorpora BMS inteligente y que podrás conectar a tu teléfono móvil.
                - paragraph [ref=f172e720]:
                  - strong [ref=f172e721]: LUCES RGB
                - paragraph [ref=f172e722]: Luces led en mastil y chasis totalmente programables tanto en colores como en tipo de destello, parpadeo, etc. Todo desde la app de tu móvil.
                - paragraph [ref=f172e723]:
                  - strong [ref=f172e724]: RUEDAS Y SUSPENSIONES
                - paragraph [ref=f172e725]: Neumáticos de alto agarre para uso urbano de 11» súper anchas que junto a la suspensión en ambas ruedas te ofrecen seguridad y comodidad en todos tus recorridos.
                - paragraph [ref=f172e726]:
                  - strong [ref=f172e727]: AMORTIGUADOR DE DIRECCIÓN
                - paragraph [ref=f172e728]: El Blade GT II+ incluye un amortiguador en la rueda delantera especialmente diseñado para tener un control más preciso en la dirección.
                - paragraph [ref=f172e729]:
                  - strong [ref=f172e730]: FRENOS DE DISCO + REGENERATIVO
                - paragraph [ref=f172e731]: Seguridad garantizada gracias a sus frenos de disco hidráulicos en ambas ruedas. Además con cada frenada la energía generada sirve para cargar la batería.
                - paragraph [ref=f172e732]:
                  - strong [ref=f172e733]: SISTEMA DE PLEGADO CON 3 NIVELES DE SEGURIDAD
                - paragraph [ref=f172e734]:
                  - text: El plegado es uno de los puntos más sensibles de un patinete eléctrico.
                  - link "MASSCITY BLADE GT II+ Certificado" [ref=f172e735] [cursor=pointer]:
                    - /url: https://www.imoveblue.es/patinetes-electricos-certificados-dgt/1226-masscity-blade-gt-ii-certificado.html
                  - text: lo soluciona de una forma sencilla y eficaz evitando cualquier tipo de holgura en el mástil.
                - paragraph [ref=f172e736]:
                  - strong [ref=f172e737]: LUCES, INTERMITENTES Y REFLECTANTES
                - paragraph [ref=f172e738]:
                  - text: El
                  - strong [ref=f172e739]: Blade GT II+
                  - text: "incluye un completo sistema de luces compuesto por:"
                - list [ref=f172e740]:
                  - listitem [ref=f172e741]: Foco delantero blanco
                  - listitem [ref=f172e742]: Luz trasera roja
                  - listitem [ref=f172e743]: Luz de frenado
                  - listitem [ref=f172e744]: Intermitentes delanteros y traseros
                  - listitem [ref=f172e745]: Además incluye un completo set de reflectantes.
                - heading "MASSCITY BLADE GT II+ Certificado especificaciones" [level=2] [ref=f172e746]
