                - generic [ref=f172e610]:
                  - paragraph [ref=f172e611]: La marca Española patinetes eléctricos y ebikes Masscity destaca por su excelente calidad-precio. En nuestra tienda online podrás comprar patinetes Masscity con total garantía ya que somos distribuidor oficial Masscity en España.
                  - paragraph [ref=f172e612]: Además, al ser distribuidor oficial Masscity podrás usar toda la la red de talleres oficiales de España ante cualquier incidencia.
                - generic [ref=f172e613]:
                  - paragraph [ref=f172e614]:
                    - text: En imoveblue.es, tu tranquilidad es lo primero y es lo que nos diferencia del resto de tiendas. Por eso, te ofrecemos un Servicio de Garantía Completo y Servicio postventa Premium para que solo te preocupes de disfrutar de tu vehículo.
                    - strong [ref=f172e615]: Nos diferenciamos por aportar siempre soluciones
                    - text: a cualquier problema que tenga tu vehículo en cualquier punto del país.
                  - heading "Garantía Oficial y Cobertura" [level=2] [ref=f172e616]
                  - list [ref=f172e617]:
                    - listitem [ref=f172e618]:
                      - paragraph [ref=f172e619]: "Garantía Oficial de 3 Años: Todos nuestros vehículos y productos cuentan con la Garantía Oficial del fabricante de 3 años desde la fecha de compra."
                    - listitem [ref=f172e620]:
                      - paragraph [ref=f172e621]: "Excepciones: La garantía cubre fallos de fabricación y componentes principales. Quedan excluidas las piezas consideradas de desgaste (como neumáticos, pastillas de freno, etc...) Las baterías y determinados componentes eléctricos de vehículos tendrán una garantía de 6 meses, 1, 2 o 3 años o límite de km en función de las normas de fabricante-marca."
                  - heading "Servicio Premium de Recogida y Reparación Gratuita" [level=2] [ref=f172e622]
                  - list [ref=f172e623]:
                    - listitem [ref=f172e624]:
                      - paragraph [ref=f172e625]: "Máxima Comodidad: Si tu vehículo presenta un fallo cubierto por la garantía, nosotros nos encargamos de todo."
                    - listitem [ref=f172e626]:
                      - paragraph [ref=f172e627]: "Recogida Gratuita: Recogemos tu producto a domicilio sin coste alguno para ti."
                    - listitem [ref=f172e628]:
                      - paragraph [ref=f172e629]: "Reparación Profesional: Será reparado por Técnicos Oficiales en el taller oficial correspondiente para asegurar la máxima calidad."
                    - listitem [ref=f172e630]:
                      - paragraph [ref=f172e631]: "Devolución sin Coste: Una vez reparado, te lo devolvemos en tu domicilio completamente gratis."
                  - heading "Opciones de Solución de Problemas (Según el Caso)" [level=2] [ref=f172e632]
                  - paragraph [ref=f172e633]: "Una vez que contactes con nosotros, evaluaremos tu caso para ofrecerte la solución más rápida y eficiente:"
                  - list [ref=f172e634]:
                    - listitem [ref=f172e635]:
                      - paragraph [ref=f172e636]: Recogida y Reparación Gratuita en Taller Oficial (la opción estándar y más cómoda para ti).
                    - listitem [ref=f172e637]:
                      - paragraph [ref=f172e638]: Envío de Pieza Defectuosa y reparación por parte del cliente (ideal para fallos menores y clientes con conocimientos técnicos).
                    - listitem [ref=f172e639]:
                      - paragraph [ref=f172e640]: Reparación en Taller Colaborador (si disponemos de un taller asociado cerca de tu ubicación, facilitando una solución local y rápida).
                  - heading "Mantenimiento y Red de Talleres" [level=2] [ref=f172e641]
                  - list [ref=f172e642]:
                    - listitem [ref=f172e643]:
                      - paragraph [ref=f172e644]: "Red de Talleres Colaboradores: Además del servicio de garantía, contamos con una red de talleres colaboradores en crecimiento a nivel nacional."
                    - listitem [ref=f172e645]:
                      - paragraph [ref=f172e646]: "Mantenimiento al Día: Puedes utilizar esta red para realizar las revisiones, puestas a punto y el mantenimiento periódico de tu vehículo de forma cómoda y con profesionales de confianza."
                  - heading "¿Tienes un Problema? ¡Contáctanos!" [level=2] [ref=f172e647]
                  - paragraph [ref=f172e648]:
                    - text: Si tienes cualquier incidencia con tu producto o necesitas gestionar la garantía,
                    - strong [ref=f172e649]:
                      - link "simplemente contacta con nuestro equipo" [ref=f172e650] [cursor=pointer]:
                        - /url: https://www.imoveblue.es/contactenos
                    - text: . Te guiaremos en cada paso para resolver tu situación lo antes posible.
                - generic [ref=f172e651]:
                  - paragraph [ref=f172e652]:
                    - strong [ref=f172e653]: ¡Matrícula gratis! ¡Te lo ponemos muy fácil para circular con total legalidad! Tenemos una promoción activa para la compra de patinetes eléctricos y VMP. Te regalamos la matrícula en patinetes eléctricos señalados en la descripción de producto
                    - text: (No compatible con otros regalos o cupones de descuento. Promoción válida para patinetes comprados desde el 12 de febrero hasta el 31 de marzo). Para pedir la matrícula deberás registrar el VMP en la web de la DGT y pagas las tasas, y una vez obtengas el nº de matrícula debes facilitarnos vía email o Whatsapp el certificado de registro de VMP del la DGT y DNI por las 2 caras. En 2-3 días te enviaremos tu matrícula gratis a domicilio.
                  - paragraph [ref=f172e654]:
                    - img "Matrícula patinete gratis" [ref=f172e655]
                  - paragraph [ref=f172e656]:
                    - text: Además en el siguiente enlace os dejamos un
                    - strong [ref=f172e657]:
                      - link "tutorial para poder registrar y matricular vuestro patinete eléctrico o VMP en la DGT" [ref=f172e658] [cursor=pointer]:
                        - /url: https://www.imoveblue.es/content/14-matricular-patinete-electrico-vmp-dgt
                    - text: y obtener la matrícula adhesiva. ¡Es muy sencillo! Si tienes cualquier duda puedes
                    - strong [ref=f172e659]:
                      - link "contactar con nosotros" [ref=f172e660] [cursor=pointer]:
                        - /url: https://www.imoveblue.es/contactenos
                    - text: y te ayudamos en el proceso.
                  - paragraph [ref=f172e661]:
                    - text: Por otro lado, también te ofrecemos un servicio de seguro para patinetes eléctrico y VMP gracias a la colaboración con
                    - strong [ref=f172e662]:
