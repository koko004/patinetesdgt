            - generic [ref=f11e509]:
              - generic [ref=f11e515]:
                - 'heading "Patinete Eléctrico Navee NT5 Max: Potencia SUV y Autonomía Récord en imoveblue.es" [level=2] [ref=f11e516]'
                - paragraph [ref=f11e517]:
                  - text: Si buscas dar un salto de calidad en tu movilidad urbana y dejar atrás los patinetes básicos, el patinete eléctrico
                  - strong [ref=f11e518]: Navee NT5 Max
                  - text: es exactamente lo que necesitas. Diseñado bajo un concepto de "estilo SUV", este modelo combina una potencia arrolladora, una autonomía líder en el mercado y un nivel de confort diseñado para que los baches y desniveles de la ciudad dejen de ser un problema.
                - paragraph [ref=f11e519]: En imoveblue.es te contamos por qué el Navee NT5 Max se ha convertido en el vehículo definitivo para los usuarios más exigentes.
                - heading "¿Por qué el Navee NT5 Max domina las calles?" [level=2] [ref=f11e520]
                - paragraph [ref=f11e521]:
                  - text: El
                  - strong [ref=f11e522]: NT5 Max
                  - text: no es un patinete convencional. Está pensado para quienes recorren largas distancias a diario, necesitan subir pendientes pronunciadas o simplemente buscan la máxima estabilidad en terrenos irregulares.
                - paragraph [ref=f11e523]:
                  - strong [ref=f11e524]: "Motor de 1600W: Aceleración y potencia sin límites"
                - paragraph [ref=f11e525]: "Equipado con un motor que alcanza picos de hasta 1600W de potencia máxima, este patinete ofrece una respuesta inmediata y una aceleración impresionante. Olvídate de perder velocidad en las subidas: el NT5 Max es capaz de afrontar cuestas con hasta un 28-32% de inclinación sin inmutarse."
                - paragraph [ref=f11e526]:
                  - strong [ref=f11e527]: "85 km de Autonomía: Olvídate del cargador"
                - paragraph [ref=f11e528]:
                  - text: Uno de sus mayores atractivos es su batería de alta capacidad (aproximadamente 562 Wh). El
                  - strong [ref=f11e529]: Navee NT5 Max DGT
                  - text: ofrece hasta 65-85 kilómetros de autonomía ( en determinadas condiciones) con una sola carga. Esto te permite utilizarlo durante varios días seguidos para ir al trabajo o hacer rutas largas sin la ansiedad de quedarte tirado a mitad de camino.
                - paragraph [ref=f11e530]:
                  - strong [ref=f11e531]: "Confort Extremo: Doble Suspensión y Neumáticos Tubeless"
                - paragraph [ref=f11e532]: Conducir este patinete es ir flotando sobre el asfalto. Incorpora un avanzado sistema de suspensión delantera telescópica y trasera (Damping Arm™) que absorbe eficazmente los impactos de baches y adoquines. Además, monta unos imponentes neumáticos tubeless de 10,5 pulgadas, preparados para ofrecer un agarre superior en cualquier tipo de terreno, evitando pinchazos frecuentes.
                - paragraph [ref=f11e533]:
                  - strong [ref=f11e534]: Seguridad y Tecnología de Vanguardia
                - list [ref=f11e535]:
                  - listitem [ref=f11e536]: "La potencia no sirve de nada sin control. El Navee NT5 Max destaca por su completísimo equipamiento de seguridad y conectividad:"
                  - listitem [ref=f11e537]: "Frenada impecable: Doble freno de disco (delantero y trasero) asistido por frenado electrónico EABS para detenerte con total precisión."
                  - listitem [ref=f11e538]: "Sistema TCS (Traction Control System): Evita derrapes y mejora la tracción en superficies resbaladizas."
                  - listitem [ref=f11e539]: "A prueba de agua: Cuenta con certificación IPX6, lo que te permite circular bajo la lluvia sin riesgo de dañar sus componentes electrónicos."
                  - listitem [ref=f11e540]: "Inteligencia y conectividad: Pantalla LED, encendido automático de luces, intermitentes integrados, desbloqueo por Bluetooth y compatibilidad con Apple Find My para que siempre sepas dónde está tu patinete."
                - heading "Especificaciones Técnicas del Navee NT5 Max certificado DGT" [level=2] [ref=f11e541]
                - list [ref=f11e542]:
                  - listitem [ref=f11e543]:
                    - strong [ref=f11e544]: Certificad por la DGT con nº C1021
                  - listitem [ref=f11e545]:
                    - strong [ref=f11e546]: Potencia del motor Hasta 1600W (máxima)
                  - listitem [ref=f11e547]: Velocidad máxima 25 km/h (Limitación legal)
                  - listitem [ref=f11e548]: Autonomía máxima Hasta 65-85 km (en determinadas condiciones)
                  - listitem [ref=f11e549]: Batería 46.8V 12Ah (561.6Wh)
                  - listitem [ref=f11e550]: Tiempo de carga 5 - 6 horas
                  - listitem [ref=f11e551]: Neumáticos 10.5" Tubeless todoterreno
                  - listitem [ref=f11e552]: Suspensión Doble (Delantera telescópica y trasera Damping Arm)
                  - listitem [ref=f11e553]: Frenos Disco delantero + Disco trasero + EABS
                  - listitem [ref=f11e554]: Resistencia al agua IPX6 (Apto para lluvia ligera)
                  - listitem [ref=f11e555]: Carga máxima soportada 150 kg
                  - listitem [ref=f11e556]: Peso del patinete 33,5 kg
                - heading "¿Para quién es ideal este patinete eléctrico?" [level=2] [ref=f11e557]
                - paragraph [ref=f11e558]: "El Navee NT5 Max soporta hasta 150 kg de peso gracias a su robusto chasis de estilo automoción. Es la opción definitiva para:"
                - list [ref=f11e559]:
                  - listitem [ref=f11e560]: Trabajadores y estudiantes que recorren la ciudad de punta a punta a diario.
                  - listitem [ref=f11e561]: Usuarios pesados o altos que sienten que los patinetes estándar se quedan cortos de fuerza y estabilidad.
                  - listitem [ref=f11e562]: Conductores exigentes que valoran la seguridad, la tracción en lluvia y la amortiguación premium en sus trayectos.
                - heading "Compra tu Navee NT5 Max al Mejor Precio en imoveblue.es" [level=2] [ref=f11e563]
                - paragraph [ref=f11e564]: En imoveblue.es somos especialistas en movilidad eléctrica. Al comprar tu patinete con nosotros, te garantizas el mejor servicio postventa, envío rápido y total garantía.
                - paragraph [ref=f11e565]: No te conformes con un patinete básico cuando puedes dominar la ciudad con estilo SUV. ¡Añade el Navee NT5 Max a tu carrito ahora y transforma tu forma de moverte para siempre!
