                  - paragraph [ref=f135e856]:
                    - text: Los
                    - strong [ref=f135e857]: patinetes eléctricos Rovoron
                    - text: de Minimotors son considerados los mejores en relación calidad-potencia-precio. En nuestra tienda online podrás comprar patinetes Rovoron Minimotors con total garantía ya que somos distribuidor oficial Rovoron en España. Tenemos acceso a repuestos de todos los patinetes Minimotors-Rovoron. Si necesitas algún recambio en concreto contacta con nosotros.
                  - paragraph [ref=f135e858]:
                    - strong [ref=f135e859]: TRABAJAMOS ÚNICAMENTE CON IMPORTADORES MINIMOTORS OFICIALES DE ESPAÑA Y EUROPA, LO QUE GARANTIZA EL MEJOR SERVICIO POSTVENTA, RECAMBIOS Y GARANTÍAS.
                - generic [ref=f135e860]:
                  - paragraph [ref=f135e861]:
                    - text: En imoveblue.es, tu tranquilidad es lo primero y es lo que nos diferencia del resto de tiendas. Por eso, te ofrecemos un Servicio de Garantía Completo y Servicio postventa Premium para que solo te preocupes de disfrutar de tu vehículo.
                    - strong [ref=f135e862]: Nos diferenciamos por aportar siempre soluciones
                    - text: a cualquier problema que tenga tu vehículo en cualquier punto del país.
                  - heading "Garantía Oficial y Cobertura" [level=2] [ref=f135e863]
                  - list [ref=f135e864]:
                    - listitem [ref=f135e865]:
                      - paragraph [ref=f135e866]: "Garantía Oficial de 3 Años: Todos nuestros vehículos y productos cuentan con la Garantía Oficial del fabricante de 3 años desde la fecha de compra."
                    - listitem [ref=f135e867]:
                      - paragraph [ref=f135e868]: "Excepciones: La garantía cubre fallos de fabricación y componentes principales. Quedan excluidas las piezas consideradas de desgaste (como neumáticos, pastillas de freno, etc...) Las baterías y determinados componentes eléctricos de vehículos tendrán una garantía de 6 meses, 1, 2 o 3 años o límite de km en función de las normas de fabricante-marca."
                  - heading "Servicio Premium de Recogida y Reparación Gratuita" [level=2] [ref=f135e869]
                  - list [ref=f135e870]:
                    - listitem [ref=f135e871]:
                      - paragraph [ref=f135e872]: "Máxima Comodidad: Si tu vehículo presenta un fallo cubierto por la garantía, nosotros nos encargamos de todo."
                    - listitem [ref=f135e873]:
                      - paragraph [ref=f135e874]: "Recogida Gratuita: Recogemos tu producto a domicilio sin coste alguno para ti."
                    - listitem [ref=f135e875]:
                      - paragraph [ref=f135e876]: "Reparación Profesional: Será reparado por Técnicos Oficiales en el taller oficial correspondiente para asegurar la máxima calidad."
                    - listitem [ref=f135e877]:
                      - paragraph [ref=f135e878]: "Devolución sin Coste: Una vez reparado, te lo devolvemos en tu domicilio completamente gratis."
                  - heading "Opciones de Solución de Problemas (Según el Caso)" [level=2] [ref=f135e879]
                  - paragraph [ref=f135e880]: "Una vez que contactes con nosotros, evaluaremos tu caso para ofrecerte la solución más rápida y eficiente:"
                  - list [ref=f135e881]:
                    - listitem [ref=f135e882]:
                      - paragraph [ref=f135e883]: Recogida y Reparación Gratuita en Taller Oficial (la opción estándar y más cómoda para ti).
                    - listitem [ref=f135e884]:
                      - paragraph [ref=f135e885]: Envío de Pieza Defectuosa y reparación por parte del cliente (ideal para fallos menores y clientes con conocimientos técnicos).
                    - listitem [ref=f135e886]:
                      - paragraph [ref=f135e887]: Reparación en Taller Colaborador (si disponemos de un taller asociado cerca de tu ubicación, facilitando una solución local y rápida).
                  - heading "Mantenimiento y Red de Talleres" [level=2] [ref=f135e888]
                  - list [ref=f135e889]:
                    - listitem [ref=f135e890]:
                      - paragraph [ref=f135e891]: "Red de Talleres Colaboradores: Además del servicio de garantía, contamos con una red de talleres colaboradores en crecimiento a nivel nacional."
                    - listitem [ref=f135e892]:
                      - paragraph [ref=f135e893]: "Mantenimiento al Día: Puedes utilizar esta red para realizar las revisiones, puestas a punto y el mantenimiento periódico de tu vehículo de forma cómoda y con profesionales de confianza."
                  - heading "¿Tienes un Problema? ¡Contáctanos!" [level=2] [ref=f135e894]
                  - paragraph [ref=f135e895]:
                    - text: Si tienes cualquier incidencia con tu producto o necesitas gestionar la garantía,
                    - strong [ref=f135e896]:
                      - link "simplemente contacta con nuestro equipo" [ref=f135e897] [cursor=pointer]:
                        - /url: https://www.imoveblue.es/contactenos
                    - text: . Te guiaremos en cada paso para resolver tu situación lo antes posible.
                - generic [ref=f135e898]:
                  - paragraph [ref=f135e899]:
                    - strong [ref=f135e900]: ¡Matrícula gratis! ¡Te lo ponemos muy fácil para circular con total legalidad! Tenemos una promoción activa para la compra de patinetes eléctricos y VMP. Te regalamos la matrícula en patinetes eléctricos señalados en la descripción de producto
                    - text: (No compatible con otros regalos o cupones de descuento. Promoción válida para patinetes comprados desde el 12 de febrero hasta el 31 de marzo). Para pedir la matrícula deberás registrar el VMP en la web de la DGT y pagas las tasas, y una vez obtengas el nº de matrícula debes facilitarnos vía email o Whatsapp el certificado de registro de VMP del la DGT y DNI por las 2 caras. En 2-3 días te enviaremos tu matrícula gratis a domicilio.
