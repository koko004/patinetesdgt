            - generic [ref=f135e926]:
              - generic [ref=f135e932]:
                - heading "Rovoron R7 Certificado por la DGT – El patinete eléctrico revolucionario" [level=2] [ref=f135e933]
                - paragraph [ref=f135e934]:
                  - text: Súbete al
                  - strong [ref=f135e935]: Rovoron R7
                  - text: y siente la diferencia al instante. Desde los primeros metros, sentirás la potencia, sin brusquedad, sino con total confianza. Te moverás con suavidad, dominarás la carretera y cada paseo se convertirá en un momento de placer controlado. El Rovoron R7 no es solo un patinete eléctrico de alto rendimiento. Es una máquina diseñada para quienes buscan llegar más lejos, más rápido y, sobre todo, con mayor comodidad.
                - heading "Rovoron R7, potencia que se siente con cada aceleración" [level=2] [ref=f135e936]
                - paragraph [ref=f135e937]: Al pisar el acelerador, la Rovoron R7 responde al instante. Sus dos motores sin escobillas ofrecen una potencia suave y progresiva, ideal tanto para arranques rápidos como para una aceleración sostenida. Incluso en subidas, la potencia se mantiene constante y estable, sin pérdida de velocidad. Mantienes el control mientras disfrutas de una auténtica sensación de libertad.
                - heading "Especificaciones del motor" [level=2] [ref=f135e938]
                - list [ref=f135e939]:
                  - listitem [ref=f135e940]: Dos motores sin escobillas de 900W
                  - listitem [ref=f135e941]: Potencia máxima hasta 3000W
                  - listitem [ref=f135e942]: Aceleración suave y alto par
                  - listitem [ref=f135e943]: Excelente capacidad para subir colinas
                - heading "Rovoron R7 Un patinete eléctrico rápido" [level=2] [ref=f135e944]
                - paragraph [ref=f135e945]:
                  - text: El
                  - strong [ref=f135e946]: Rovoron R7
                  - text: está diseñado para ofrecer un alto rendimiento sin sacrificar la estabilidad. Para el uso diario, cumple con la normativa, con un límite de velocidad de 25 km/h. En terrenos privados, despliega todo su potencial y puede alcanzar velocidades de hasta 70 km/h. A altas velocidades, el patinete se mantiene estable, equilibrado y ofrece confianza.
                - heading "Velocidad y comportamiento" [level=2] [ref=f135e947]
                - list [ref=f135e948]:
                  - listitem [ref=f135e949]: Velocidad limitada a 25 km/h para cumplir con al normativa DGT
                  - listitem [ref=f135e950]: Hasta 70 km/h en terrenos privados
                  - listitem [ref=f135e951]: Comportamiento estable en carretera, incluso a altas velocidades
                - heading "Duración de la batería del Rovoron R7" [level=2] [ref=f135e952]
                - paragraph [ref=f135e953]:
                  - text: Con la
                  - strong [ref=f135e954]:
                    - link "Rovoron R7" [ref=f135e955] [cursor=pointer]:
                      - /url: https://www.imoveblue.es/patinetes-electricos-certificados-dgt/1717-rovoron-r7.html
                    - text: ","
                  - text: ya no tendrás que controlar constantemente el nivel de batería. Su batería de 60 V de alta capacidad te permite recorrer kilómetros sin preocupaciones. Ideal para largos desplazamientos diarios y rutas largas, se adapta a tu estilo de vida.
                - paragraph [ref=f135e956]:
                  - strong [ref=f135e957]: "Batería y duración de la batería:"
                - list [ref=f135e958]:
                  - listitem [ref=f135e959]: Batería de litio 60 V – 28,6 Ah
                  - listitem [ref=f135e960]: Hasta 90 km de autonomía en modo eco
                  - listitem [ref=f135e961]: Comodidad de conducción diseñada para durar
                - heading "Comodidad y estabilidad" [level=2] [ref=f135e962]
                - paragraph [ref=f135e963]: Cada detalle de la Rovoron R7 está diseñado para tu comodidad. La suspensión delantera y trasera absorbe eficazmente los impactos y las imperfecciones de la carretera. Los neumáticos sin cámara de 11 pulgadas mejoran el agarre y reducen las vibraciones. Disfrutarás de más tiempo con menos fatiga.
                - list [ref=f135e964]:
                  - listitem [ref=f135e965]: Suspensión de resorte delantera y trasera
                  - listitem [ref=f135e966]: Neumáticos sin cámara de 11 pulgadas
                  - listitem [ref=f135e967]: Amplia plataforma para una posición estable.
                  - listitem [ref=f135e968]: Conducción suave en carreteras en mal estado
                - heading "Frenado seguro, incluso a alta velocidad" [level=2] [ref=f135e969]
                - paragraph [ref=f135e970]: La seguridad es esencial cuando se aumenta el rendimiento. El Rovoron R7 está equipado con un sistema de frenado potente y preciso, capaz de responder instantáneamente a tus órdenes. Cada frenada es limpia, progresiva y perfectamente controlada.
                - list [ref=f135e971]:
                  - listitem [ref=f135e972]: Frenos de disco delanteros y traseros
                  - listitem [ref=f135e973]: Sistema EBS y ABS integrados
                  - listitem [ref=f135e974]: Mayor estabilidad durante el frenado de emergencia
                  - listitem [ref=f135e975]: Iluminación completa para una visibilidad óptima.
                - heading "Un diseño robusto y equipamiento de alta gama" [level=2] [ref=f135e976]
                - paragraph [ref=f135e977]: El Rovoron R7 cuenta con un diseño moderno y robusto que inspira confianza. Su chasis reforzado está diseñado para soportar un uso intensivo. El sistema de plegado es robusto, práctico y fiable para el uso diario. La pantalla EY3 conectada te permite mantener un control total de tu scooter.
                - list [ref=f135e978]:
                  - listitem [ref=f135e979]: Chasis robusto y duradero
                  - listitem [ref=f135e980]: Sistema de plegado seguro
                  - listitem [ref=f135e981]: Pantalla EY3 con aplicación móvil
                  - listitem [ref=f135e982]: Intermitentes integrados, luces delanteras y traseras y bocina.
                - paragraph [ref=f135e983]:
                  - text: El
                  - strong [ref=f135e984]: Rovoron R7
                  - text: es un patinete eléctrico diseñado para quienes buscan algo más que simplemente desplazarse. Ofrece potencia, autonomía, comodidad y una auténtica sensación de control. Un modelo completo, fiable y de alto rendimiento, listo para acompañarte en tus desplazamientos diarios y en tus salidas más ambiciosas.
                - heading "Rovoron R7 Certificado DGT especificaciones" [level=2] [ref=f135e985]
                - list [ref=f135e986]:
                  - listitem [ref=f135e987]:
                    - strong [ref=f135e988]: Certificado por la DGT con nº B1137
                  - listitem [ref=f135e989]: Impermeabilidad IPX5
                  - listitem [ref=f135e990]: Autonomía 70-90 kilómetros
                  - listitem [ref=f135e991]: Potencia nominal 1000W
                  - listitem [ref=f135e992]: Pico de potencia máxima 3000W
                  - listitem [ref=f135e993]: Velocidad máxima limitada 25 km/h
                  - listitem [ref=f135e994]: Velocidad máxima zonas privadas 70 km/h
                  - listitem [ref=f135e995]: Ruedas 11" tubeless
                  - listitem [ref=f135e996]: Frenado Disco AV + AR
                  - listitem [ref=f135e997]: Intermitentes Sí
                  - listitem [ref=f135e998]: Peso 49,5 kilogramos
                  - listitem [ref=f135e999]: Suspensión ajustable delantero y trasero
                  - listitem [ref=f135e1000]: Controlador 2 x 60V 25A
                  - listitem [ref=f135e1001]: Pantalla NUEVO EY3
                  - listitem [ref=f135e1002]: Tipo de batería litio 60V 28,6 Ah
                  - listitem [ref=f135e1003]: Pendiente 36% / 20°
                  - listitem [ref=f135e1004]: Dimensiones abierto 1283 x 331 x 606 mm (largo x ancho x alto)
                  - listitem [ref=f135e1005]: Dimensiones plegado 1283 x 606 x 1400 mm (largo x ancho x alto)
