              - generic [ref=f46e646]:
                - paragraph [ref=f46e647]:
                  - strong [ref=f46e648]: Segway GT3 E
                  - text: Certificado DGT redefine lo que puede ser un gran patinete. No es sólo una mejora, es una revolución. Con su autonomía ultralarga, el
                  - strong [ref=f46e649]: GT3 E
                  - text: conquista distancias sin esfuerzo, fusionando potencia bruta con un avanzado sistema de mejora de la estabilidad. Una conducción de nueva generación en la que el rendimiento y la innovación se unen para ofrecer una experiencia emocionante.
                - list [ref=f46e650]:
                  - listitem [ref=f46e651]:
                    - strong [ref=f46e652]: Suspensiones hidráulicas, 2400W de potencia máxima
                  - listitem [ref=f46e653]:
                    - strong [ref=f46e654]: 95 km Alcance máximo
                  - listitem [ref=f46e655]:
                    - strong [ref=f46e656]: 30% Pendiente Máxima de Ascenso
                  - listitem [ref=f46e657]:
                    - strong [ref=f46e658]: Pantalla Inteligente TFT - Interfaz Multifunción
                  - listitem [ref=f46e659]:
                    - strong [ref=f46e660]: Segway AirLock - Tecnología de Desbloqueo Bluetooth
                  - listitem [ref=f46e661]:
                    - strong [ref=f46e662]: Segride™ - Sistema de Mejora de la Estabilidad
                  - listitem [ref=f46e663]:
                    - strong [ref=f46e664]: TCS - Sistema de Control de Tracción
                - paragraph [ref=f46e665]:
                  - strong [ref=f46e666]: Mayor autonomía
                - paragraph [ref=f46e667]: La tecnología patentada de Segway SegRange™ amplía la autonomía, permitiendo trayectos más largos.
                - paragraph [ref=f46e668]: Autonomía en modo Eco[1] 95km at 15 km/h
                - paragraph [ref=f46e669]: Autonomía en modo Sport[2] 75km at 25 km/h
                - paragraph [ref=f46e670]:
                  - strong [ref=f46e671]: Alcance adicional
                - paragraph [ref=f46e672]:
                  - text: Con una batería opcional de 460 Wh (se vende por separado), amplía la autonomía de tu
                  - link [ref=f46e673] [cursor=pointer]:
                    - /url: https://www.imoveblue.es/patinetes-electricos-certificados-dgt/1481-segway-gt3.html
                    - strong [ref=f46e674]: Segway GT3 E
                  - text: en 44 km a 15 km/h, totalizando unos increíbles 139 km. Conduce más lejos, sin preocupaciones.
                - paragraph [ref=f46e675]:
                  - text: "Modo Eco con batería opcional:"
                  - strong [ref=f46e676]
                  - text: 139 km a 15 km/h
                - paragraph [ref=f46e677]: "Modo Sport con batería opcional: 109 km a 25 km/h»."
                - paragraph [ref=f46e678]: "*La batería adicional opcional se vende por separado y está disponible para su compra a partir del tercer trimestre de 2025."
                - paragraph [ref=f46e679]:
                  - strong [ref=f46e680]: Motor potente, conquistador urbano
                - paragraph [ref=f46e681]: Con un motor de 2400 W, el Segway GT3 E garantiza un desplazamiento rápido por zonas urbanas y se adapta fácilmente a pendientes pronunciadas.
                - paragraph [ref=f46e682]: 30% Pendiente Máxima[3]
                - paragraph [ref=f46e683]: 2400W Potencia Máxima
                - paragraph [ref=f46e684]:
                  - strong [ref=f46e685]: Sistema de mejora de la estabilidad
                - paragraph [ref=f46e686]: Experimenta un control de conducción superior con el sistema de mejora de la estabilidad SegRide™ incluso a altas velocidades, en curvas cerradas y en carreteras resbaladizas. Segride™ ofrece el equilibrio perfecto entre agilidad y estabilidad.
                - paragraph [ref=f46e687]:
                  - strong [ref=f46e688]: Resistencia a las perturbaciones
                - paragraph [ref=f46e689]: La distancia de retroceso ampliada en 80 mm, junto con el preciso ángulo de la potencia y la amortiguación de la dirección, mejoran enormemente la resistencia a las perturbaciones externas, garantizando una conducción estable incluso en condiciones impredecibles.s.
                - paragraph [ref=f46e690]:
                  - strong [ref=f46e691]: Controlabilidad
                - paragraph [ref=f46e692]: El manillar curvado ergonómico proporciona un agarre cómodo e intuitivo. Mediante la optimización de la distancia de arrastre y la amortiguación de la dirección, hemos creado un patinete perfectamente equilibrado - ni demasiado rígido ni demasiado suelto - para una experiencia de conducción suave, sensible y controlada.
                - paragraph [ref=f46e693]:
                  - strong [ref=f46e694]: Resistencia al derrape
                - paragraph [ref=f46e695]: El TCS (Sistema de Control de Tracción) proporciona al GT3 E una excelente tracción y control en terrenos difíciles, evitando derrapes y deslizamientos, manteniendo tu conducción estable y bajo control. También puedes desactivarlo.
                - paragraph [ref=f46e696]: "*El TCS está desactivado por defecto. Puedes activarlo a través de la app Segway Mobility."
                - paragraph [ref=f46e697]:
                  - strong [ref=f46e698]: Sistema de suspensión hidráulica
                - paragraph [ref=f46e699]: Amortiguadores dobles hidráulicos delanteros y brazo de arrastre hidráulico trasero.
                - paragraph [ref=f46e700]: El GT3 E está equipada con un sistema de suspensión hidráulica delantera y trasera que proporciona una respuesta inmediata a los baches, reduciendo significativamente el impacto que siente el piloto, ofreciendo un confort y control superiores.»
                - paragraph [ref=f46e701]:
                  - strong [ref=f46e702]: Neumáticos autorreparables sin cámara de 11''
                - paragraph [ref=f46e703]: Los neumáticos autorreparables sin cámara de 11'' con 80 mm de anchura proporcionan a los usuarios de la GT3 E una conducción más suave y estable tanto en las calles de la ciudad como en los caminos más accidentados. La capa de gelatina autosellante del interior de los neumáticos puede soportar pinchazos sin que se produzcan fugas de aire.
                - paragraph [ref=f46e704]:
                  - strong [ref=f46e705]: Frenos de disco delanteros y traseros
                - paragraph [ref=f46e706]: Tanto las ruedas delanteras como las traseras incorporan frenos de disco de alto rendimiento para una mejor disipación del calor y una frenada consistente.
                - paragraph [ref=f46e707]: Esta configuración permite paradas más rápidas y un mayor control, dándote un control total sobre tu velocidad.
                - paragraph [ref=f46e708]:
                  - strong [ref=f46e709]: Pantalla TFT inteligente de 2,4''
                - paragraph [ref=f46e710]: Notificación de llamada entrante
                - paragraph [ref=f46e711]: La pantalla te avisa de las llamadas entrantes, para que nunca pierdas una llamada importante mientras mantienes la concentración en la carretera.
                - paragraph [ref=f46e712]:
                  - strong [ref=f46e713]: Información de conducción en tiempo real
                - paragraph [ref=f46e714]: Mantente en contacto con el estado de conducción de tu GT3 E, incluyendo velocidad, duración de la batería, modos, distancia recorrida y mucho más.
                - paragraph [ref=f46e715]:
                  - strong [ref=f46e716]: Navegación [4]
                - paragraph [ref=f46e717]: A la espera de una futura actualización, la guía de navegación integrada en la pantalla del GT3 E facilita y agiliza la planificación de rutas (véase la cláusula de exención de responsabilidad 4).
                - paragraph [ref=f46e718]: Tecnología de Desbloqueo Bluetooth
                - paragraph [ref=f46e719]: El sistema Segway AirLock desbloquea tu SuperScooter en función de tu proximidad. El GT3 E está listo para circular cuando te acercas.
                - paragraph [ref=f46e720]: Activa y personaliza la distancia de desbloqueo en la app Segway Mobility.
                - paragraph [ref=f46e721]:
                  - strong [ref=f46e722]: Find My de Apple[5]
                - paragraph [ref=f46e723]: Con un rápido vistazo a la aplicación «Find My» de su iPhone, sabrá exactamente dónde se encuentra su SuperScooter.
                - paragraph [ref=f46e724]:
                  - strong [ref=f46e725]: BMS 2.0
                - paragraph [ref=f46e726]: Seguimiento del tiempo de carga
                - paragraph [ref=f46e727]: Programación inteligente de la carga
                - paragraph [ref=f46e728]: Control del estado de la batería
                - paragraph [ref=f46e729]: Protección contra cortocircuitos
