                  - heading "Garantía Oficial y Cobertura" [level=2] [ref=f46e577]
                  - list [ref=f46e578]:
                    - listitem [ref=f46e579]:
                      - paragraph [ref=f46e580]: "Garantía Oficial de 3 Años: Todos nuestros vehículos y productos cuentan con la Garantía Oficial del fabricante de 3 años desde la fecha de compra."
                    - listitem [ref=f46e581]:
                      - paragraph [ref=f46e582]: "Excepciones: La garantía cubre fallos de fabricación y componentes principales. Quedan excluidas las piezas consideradas de desgaste (como neumáticos, pastillas de freno, etc...) Las baterías y determinados componentes eléctricos de vehículos tendrán una garantía de 6 meses, 1, 2 o 3 años o límite de km en función de las normas de fabricante-marca."
                  - heading "Servicio Premium de Recogida y Reparación Gratuita" [level=2] [ref=f46e583]
                  - list [ref=f46e584]:
                    - listitem [ref=f46e585]:
                      - paragraph [ref=f46e586]: "Máxima Comodidad: Si tu vehículo presenta un fallo cubierto por la garantía, nosotros nos encargamos de todo."
                    - listitem [ref=f46e587]:
                      - paragraph [ref=f46e588]: "Recogida Gratuita: Recogemos tu producto a domicilio sin coste alguno para ti."
                    - listitem [ref=f46e589]:
                      - paragraph [ref=f46e590]: "Reparación Profesional: Será reparado por Técnicos Oficiales en el taller oficial correspondiente para asegurar la máxima calidad."
                    - listitem [ref=f46e591]:
                      - paragraph [ref=f46e592]: "Devolución sin Coste: Una vez reparado, te lo devolvemos en tu domicilio completamente gratis."
                  - heading "Opciones de Solución de Problemas (Según el Caso)" [level=2] [ref=f46e593]
                  - paragraph [ref=f46e594]: "Una vez que contactes con nosotros, evaluaremos tu caso para ofrecerte la solución más rápida y eficiente:"
                  - list [ref=f46e595]:
                    - listitem [ref=f46e596]:
                      - paragraph [ref=f46e597]: Recogida y Reparación Gratuita en Taller Oficial (la opción estándar y más cómoda para ti).
                    - listitem [ref=f46e598]:
                      - paragraph [ref=f46e599]: Envío de Pieza Defectuosa y reparación por parte del cliente (ideal para fallos menores y clientes con conocimientos técnicos).
                    - listitem [ref=f46e600]:
                      - paragraph [ref=f46e601]: Reparación en Taller Colaborador (si disponemos de un taller asociado cerca de tu ubicación, facilitando una solución local y rápida).
                  - heading "Mantenimiento y Red de Talleres" [level=2] [ref=f46e602]
                  - list [ref=f46e603]:
                    - listitem [ref=f46e604]:
                      - paragraph [ref=f46e605]: "Red de Talleres Colaboradores: Además del servicio de garantía, contamos con una red de talleres colaboradores en crecimiento a nivel nacional."
                    - listitem [ref=f46e606]:
                      - paragraph [ref=f46e607]: "Mantenimiento al Día: Puedes utilizar esta red para realizar las revisiones, puestas a punto y el mantenimiento periódico de tu vehículo de forma cómoda y con profesionales de confianza."
                  - heading "¿Tienes un Problema? ¡Contáctanos!" [level=2] [ref=f46e608]
                  - paragraph [ref=f46e609]:
                    - text: Si tienes cualquier incidencia con tu producto o necesitas gestionar la garantía,
                    - strong [ref=f46e610]:
                      - link "simplemente contacta con nuestro equipo" [ref=f46e611] [cursor=pointer]:
                        - /url: https://www.imoveblue.es/contactenos
                    - text: . Te guiaremos en cada paso para resolver tu situación lo antes posible.
