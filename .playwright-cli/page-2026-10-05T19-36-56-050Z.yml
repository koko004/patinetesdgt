                    - text: .
                  - paragraph [ref=f162e1003]: TRABAJAMOS ÚNICAMENTE CON IMPORTADORES TEVERUN OFICIALES DE ESPAÑA, LO QUE GARANTIZA EL MEJOR SERVICIO POSTVENTA, RECAMBIOS Y GARANTÍAS.
                - generic [ref=f162e1004]:
                  - paragraph [ref=f162e1005]:
                    - text: En imoveblue.es, tu tranquilidad es lo primero y es lo que nos diferencia del resto de tiendas. Por eso, te ofrecemos un Servicio de Garantía Completo y Servicio postventa Premium para que solo te preocupes de disfrutar de tu vehículo.
                    - strong [ref=f162e1006]: Nos diferenciamos por aportar siempre soluciones
                    - text: a cualquier problema que tenga tu vehículo en cualquier punto del país.
                  - heading "Garantía Oficial y Cobertura" [level=2] [ref=f162e1007]
                  - list [ref=f162e1008]:
                    - listitem [ref=f162e1009]:
                      - paragraph [ref=f162e1010]: "Garantía Oficial de 3 Años: Todos nuestros vehículos y productos cuentan con la Garantía Oficial del fabricante de 3 años desde la fecha de compra."
                    - listitem [ref=f162e1011]:
                      - paragraph [ref=f162e1012]: "Excepciones: La garantía cubre fallos de fabricación y componentes principales. Quedan excluidas las piezas consideradas de desgaste (como neumáticos, pastillas de freno, etc...) Las baterías y determinados componentes eléctricos de vehículos tendrán una garantía de 6 meses, 1, 2 o 3 años o límite de km en función de las normas de fabricante-marca."
                  - heading "Servicio Premium de Recogida y Reparación Gratuita" [level=2] [ref=f162e1013]
                  - list [ref=f162e1014]:
                    - listitem [ref=f162e1015]:
                      - paragraph [ref=f162e1016]: "Máxima Comodidad: Si tu vehículo presenta un fallo cubierto por la garantía, nosotros nos encargamos de todo."
                    - listitem [ref=f162e1017]:
                      - paragraph [ref=f162e1018]: "Recogida Gratuita: Recogemos tu producto a domicilio sin coste alguno para ti."
                    - listitem [ref=f162e1019]:
                      - paragraph [ref=f162e1020]: "Reparación Profesional: Será reparado por Técnicos Oficiales en el taller oficial correspondiente para asegurar la máxima calidad."
                    - listitem [ref=f162e1021]:
                      - paragraph [ref=f162e1022]: "Devolución sin Coste: Una vez reparado, te lo devolvemos en tu domicilio completamente gratis."
                  - heading "Opciones de Solución de Problemas (Según el Caso)" [level=2] [ref=f162e1023]
                  - paragraph [ref=f162e1024]: "Una vez que contactes con nosotros, evaluaremos tu caso para ofrecerte la solución más rápida y eficiente:"
                  - list [ref=f162e1025]:
                    - listitem [ref=f162e1026]:
                      - paragraph [ref=f162e1027]: Recogida y Reparación Gratuita en Taller Oficial (la opción estándar y más cómoda para ti).
                    - listitem [ref=f162e1028]:
                      - paragraph [ref=f162e1029]: Envío de Pieza Defectuosa y reparación por parte del cliente (ideal para fallos menores y clientes con conocimientos técnicos).
                    - listitem [ref=f162e1030]:
                      - paragraph [ref=f162e1031]: Reparación en Taller Colaborador (si disponemos de un taller asociado cerca de tu ubicación, facilitando una solución local y rápida).
                  - heading "Mantenimiento y Red de Talleres" [level=2] [ref=f162e1032]
                  - list [ref=f162e1033]:
                    - listitem [ref=f162e1034]:
                      - paragraph [ref=f162e1035]: "Red de Talleres Colaboradores: Además del servicio de garantía, contamos con una red de talleres colaboradores en crecimiento a nivel nacional."
                    - listitem [ref=f162e1036]:
                      - paragraph [ref=f162e1037]: "Mantenimiento al Día: Puedes utilizar esta red para realizar las revisiones, puestas a punto y el mantenimiento periódico de tu vehículo de forma cómoda y con profesionales de confianza."
                  - heading "¿Tienes un Problema? ¡Contáctanos!" [level=2] [ref=f162e1038]
                  - paragraph [ref=f162e1039]:
                    - text: Si tienes cualquier incidencia con tu producto o necesitas gestionar la garantía,
                    - strong [ref=f162e1040]:
                      - link "simplemente contacta con nuestro equipo" [ref=f162e1041] [cursor=pointer]:
                        - /url: https://www.imoveblue.es/contactenos
                    - text: . Te guiaremos en cada paso para resolver tu situación lo antes posible.
                - generic [ref=f162e1042]:
