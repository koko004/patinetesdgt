      - paragraph [ref=f26e789]:
        - text: Desde enero de 2021, circular con un
        - strong [ref=f26e790]: patinete eléctrico homologado DGT
        - text: no es una opción, es una obligación. En Electyum encontrarás la mayor selección de
        - strong [ref=f26e791]: patinetes eléctricos homologados
        - text: "del mercado: modelos de las marcas más reconocidas, certificados para circular legalmente por las vías públicas de España, con garantía oficial y envío en 24-72 horas."
      - heading "¿Qué requisitos debe cumplir un patinete eléctrico homologado en España?" [level=2] [ref=f26e792]
      - paragraph [ref=f26e793]:
        - text: La normativa de la
        - link "DGT" [ref=f26e794] [cursor=pointer]:
          - /url: https://www.dgt.es/inicio/
        - text: "establece los siguientes requisitos técnicos obligatorios para que un patinete eléctrico pueda circular por vías públicas en España:"
      - list [ref=f26e795]:
        - listitem [ref=f26e796]:
          - strong [ref=f26e797]: "Potencia máxima del motor:"
          - text: 500 W.
        - listitem [ref=f26e798]:
          - strong [ref=f26e799]: "Velocidad máxima:"
          - text: 25 km/h.
        - listitem [ref=f26e800]:
          - strong [ref=f26e801]: Peso máximo del conjunto
          - text: "(usuario + vehículo): 100 kg."
        - listitem [ref=f26e802]:
          - strong [ref=f26e803]: Sistema de frenado eficiente
          - text: que permita detener el vehículo en espacio reducido.
        - listitem [ref=f26e804]:
          - strong [ref=f26e805]: "Iluminación:"
          - text: luces delantera, trasera y lateral, más elementos reflectantes.
        - listitem [ref=f26e806]:
          - strong [ref=f26e807]: Dispositivo de aviso acústico
          - text: (timbre o señal sonora).
        - listitem [ref=f26e808]:
          - strong [ref=f26e809]: Placa identificativa
          - text: con número de homologación y características técnicas del vehículo.
      - paragraph [ref=f26e810]: Cualquier patinete que no cumpla estos requisitos no puede circular legalmente por vías públicas y su uso puede conllevar multas y sanciones.
