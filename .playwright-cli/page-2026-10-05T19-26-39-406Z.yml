      - heading "Preguntas frecuentes sobre patinetes eléctricos homologados DGT" [level=2] [ref=f26e885]
      - heading "¿Desde cuándo es obligatorio circular con un patinete homologado en España?" [level=3] [ref=f26e886]
      - paragraph [ref=f26e887]: Desde el 2 de enero de 2021. A partir de esa fecha, todos los patinetes eléctricos que circulen por vías públicas en España deben cumplir con los requisitos de homologación establecidos por la DGT, independientemente de cuándo fueron comprados.
      - heading "¿Cómo sé si mi patinete está homologado?" [level=3] [ref=f26e888]
      - paragraph [ref=f26e889]:
        - text: Un
        - strong [ref=f26e890]: patinete eléctrico homologado
        - text: debe contar con una placa identificativa visible en la que consten el número de homologación y las características técnicas del vehículo. Además, debe cumplir los límites de potencia (máx. 500 W), velocidad (máx. 25 km/h) y peso, y estar equipado con luces y dispositivo acústico reglamentarios.
      - heading "¿Se puede homologar un patinete eléctrico que no lo está?" [level=3] [ref=f26e891]
      - paragraph [ref=f26e892]: En la mayoría de los casos no es posible homologar un patinete que no cumple con los requisitos técnicos de la DGT, ya que implicaría modificar componentes clave como el motor o el limitador de velocidad. Lo más recomendable es adquirir directamente un modelo homologado de fábrica.
      - heading "¿Qué multa me pueden poner por circular con un patinete no homologado?" [level=3] [ref=f26e893]
      - paragraph [ref=f26e894]: Circular con un patinete eléctrico no homologado por vías públicas puede conllevar sanciones de entre 200 € y 500 € según la infracción concreta. Además, el vehículo puede ser inmovilizado por los agentes de tráfico.
      - heading "¿Es obligatorio el casco con un patinete homologado?" [level=3] [ref=f26e895]
      - paragraph [ref=f26e896]: La normativa estatal no obliga al uso de casco para mayores de edad en patinetes eléctricos, pero muchos municipios lo exigen por ordenanza local. Sí es obligatorio para menores de 16 años. En cualquier caso, su uso es siempre muy recomendable por seguridad.
      - heading "¿Puedo circular por la calzada con un patinete homologado?" [level=3] [ref=f26e897]
      - paragraph [ref=f26e898]: No. Los patinetes eléctricos homologados deben circular por carriles bici, vías ciclistas o, donde no existan, por zonas de 30 km/h habilitadas para ello. Está prohibido circular por aceras, zonas peatonales y calzadas generales.
