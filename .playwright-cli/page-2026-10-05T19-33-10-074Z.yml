        - paragraph [ref=f120e211]:
          - text: El
          - strong [ref=f120e212]: Dualtron Forever Limited
          - text: no es solo un patinete electrico, es una declaracion de intenciones. Este modelo,
          - strong [ref=f120e213]: homologado por la DGT
          - text: ", combina la legendaria robustez de Minimotors con las exigencias de movilidad urbana moderna. Disenado para quienes buscan potencia bruta sin renunciar a la agilidad, este vehiculo destaca por su peso contenido y una configuracion de motor dual que redefine la aceleracion."
        - heading [level=3] [ref=f120e214]:
          - strong [ref=f120e215]: Rendimiento y Potencia Dual
        - paragraph [ref=f120e216]:
          - text: Equipado con un sistema de
          - strong [ref=f120e217]: motor dual de 900W cada uno
          - text: (1800W nominales), el Forever Limited ofrece una traccion integral que permite superar pendientes pronunciadas y alcanzar velocidades de crucero con una estabilidad pasmosa. Gracias a su arquitectura de
          - strong [ref=f120e218]: 60V
          - text: ", la entrega de energia es instantanea, permitiendo una conduccion deportiva y segura en cualquier entorno."
        - heading [level=3] [ref=f120e219]:
          - strong [ref=f120e220]: Autonomia Adaptada a tu Estilo de Vida
        - paragraph [ref=f120e221]: "Entendemos que cada usuario tiene necesidades diferentes. Por ello, el Dualtron Forever Limited esta disponible en cuatro configuraciones de bateria para que elijas el rango que mejor se adapte a tus trayectos cotidianos o de larga distancia:"
        - list [ref=f120e222]:
          - listitem [ref=f120e223]:
            - strong [ref=f120e224]: "Bateria 18Ah:"
            - text: Ideal para movilidad urbana agil y cargas rapidas.
          - listitem [ref=f120e225]:
            - strong [ref=f120e226]: "Bateria 24Ah:"
            - text: El equilibrio perfecto entre peso y recorrido.
          - listitem [ref=f120e227]:
            - strong [ref=f120e228]: "Bateria 27Ah:"
            - text: Disenada para quienes olvidan cargar el patinete a diario.
          - listitem [ref=f120e229]:
