    - generic [ref=f60e216]:
      - heading "Patinete Eléctrico Dualtron Popular" [level=2] [ref=f60e218]
      - generic [ref=f60e220]:
        - 'heading "Dualtron Popular: El Patinete Eléctrico Potente y Versátil para la Ciudad" [level=3] [ref=f60e221]'
        - paragraph [ref=f60e222]: El Dualtron Popular, conocido cariñosamente como POP, redefine lo que significa la movilidad urbana accesible. Diseñado para ofrecer una conducción compacta, asequible y versátil, este patinete eléctrico es la opción ideal tanto para quienes se desplazan diariamente al trabajo como para ciclistas ocasionales que buscan calidad sin comprometer el presupuesto. Con el POP, el rendimiento de alta gama y la comodidad dejan de ser un lujo para convertirse en un estándar.
        - heading "Configuraciones de Motor a tu Medida" [level=3] [ref=f60e223]
        - paragraph [ref=f60e224]: "El Dualtron POP se adapta a tus necesidades con dos potentes configuraciones de motor:"
        - list [ref=f60e225]:
          - listitem [ref=f60e226]:
            - strong [ref=f60e227]: "Version Single Motor:"
            - text: Equipada con un motor nominal de 450W (con picos superiores), ofrece una conducción suave y relajada, alcanzando velocidades de hasta 45 km/h en entornos privados autorizados.
          - listitem [ref=f60e228]:
            - strong [ref=f60e229]: "Version Dual Motor:"
            - text: Para quienes buscan un impulso extra, la versión bimotor duplica la potencia hasta los 900W nominales, permitiendo alcanzar los 55 km/h en terrenos privados. Esta configuración proporciona un par motor excepcional, ideal para superar pendientes pronunciadas de hasta el 37 por ciento.
        - 'heading "Autonomía Personalizada: Tres Opciones de Batería" [level=3] [ref=f60e230]'
        - paragraph [ref=f60e231]: "Entendemos que cada trayecto es diferente. Por ello, puedes elegir entre tres capacidades de batería de 52V para encontrar el equilibrio perfecto entre peso, autonomía y precio:"
        - list [ref=f60e232]:
          - listitem [ref=f60e233]:
            - strong [ref=f60e234]: "52V 14Ah:"
            - text: Hasta 30 km de autonomía, ideal para trayectos urbanos cortos y máxima ligereza.
          - listitem [ref=f60e235]:
            - strong [ref=f60e236]: "52V 20Ah:"
            - text: Hasta 45 km de autonomía, la opción equilibrada para el uso diario intenso.
          - listitem [ref=f60e237]:
            - strong [ref=f60e238]: "52V 25Ah Samsung:"
            - text: Hasta 60 km de autonomía, diseñada para largas distancias o jornadas completas de uso sin necesidad de recarga frecuente.
        - 'heading "Diseño Inteligente: Portabilidad y Confort" [level=3] [ref=f60e239]'
        - paragraph [ref=f60e240]: El chasis del Dualtron POP ha sido optimizado para la vida en la ciudad. Con un peso que oscila entre los 29.6 kg y los 32.5 kg segun la version, ofrece una robustez estructural envidiable. Su sistema de plegado rápido del mástil y manillar permite guardarlo en el maletero de un coche, debajo de un escritorio o transportarlo en el metro de forma eficiente.
        - paragraph [ref=f60e241]: Para garantizar una conducción suave sobre baches y terrenos irregulares, incorpora un sistema de suspension de muelle neumatico delantero y muelle trasero, complementado con neumaticos hinchables de 9 pulgadas que absorben los impactos y mejoran el agarre.
        - heading "Seguridad y Bajo Mantenimiento" [level=3] [ref=f60e242]
        - paragraph [ref=f60e243]: La seguridad es el pilar central de este modelo. El POP utiliza frenos de tambor delanteros y traseros totalmente cerrados. Este sistema es famoso por su durabilidad y su resistencia al polvo y la suciedad, requiriendo mucho menos mantenimiento que los frenos de disco tradicionales. Ademas, cuenta con asistencia electrica al frenado para una detencion precisa y segura.
        - heading "Tecnologia y Conectividad Avanzada" [level=3] [ref=f60e244]
        - paragraph [ref=f60e245]: "El Dualtron POP no escatima en equipamiento tecnologico:"
        - list [ref=f60e246]:
          - listitem [ref=f60e247]:
            - strong [ref=f60e248]: "Pantalla EY2 y App Móvil:"
            - text: Compatible con la aplicacion Dualtron (iOS/Android), permite monitorizar la velocidad, el estado de la bateria y personalizar los modos de conduccion desde tu smartphone.
          - listitem [ref=f60e249]:
            - strong [ref=f60e250]: "Iluminación Completa:"
            - text: Faros dobles de 3W, luces de freno, intermitentes y claxon integrados para garantizar tu visibilidad en el trafico.
          - listitem [ref=f60e251]:
            - strong [ref=f60e252]: "Ergonomia Superior:"
            - text: Incluye un reposapies trasero que mejora la estabilidad y una base con recubrimiento de goma de facil limpieza y maximo agarre.
        - heading "Especificaciones Técnicas Detalladas" [level=3] [ref=f60e253]
        - list [ref=f60e254]:
          - listitem [ref=f60e255]:
            - strong [ref=f60e256]: "Velocidad Máxima:"
            - text: 25 km/h (limitado por software). Hasta 45-55 km/h en uso privado.
          - listitem [ref=f60e257]:
            - strong [ref=f60e258]: "Potencia Nominal:"
            - text: 900W (Single) / 1800W (Dual en pico).
          - listitem [ref=f60e259]:
            - strong [ref=f60e260]: "Pendiente Máxima:"
            - text: 27 por ciento (Single) / 37 por ciento (Dual).
          - listitem [ref=f60e261]:
            - strong [ref=f60e262]: "Batería:"
            - text: 52V con opciones de 14Ah, 20Ah o 25Ah Samsung.
          - listitem [ref=f60e263]:
            - strong [ref=f60e264]: "Tiempo de Carga:"
            - text: Entre 7 y 12.5 horas segun capacidad.
          - listitem [ref=f60e265]:
            - strong [ref=f60e266]: "Sistema BMS:"
            - text: Proteccion contra sobrecalentamiento, cortocircuito, sobrecorriente y sobrecarga.
          - listitem [ref=f60e267]:
            - strong [ref=f60e268]: "Carga Máxima:"
            - text: 120 kg.
          - listitem [ref=f60e269]:
            - strong [ref=f60e270]: "Neumáticos:"
            - text: 9 pulgadas 70/50-6.1 con camara de aire.
          - listitem [ref=f60e271]:
            - strong [ref=f60e272]: "Frenos:"
            - text: Tambor delantero y trasero mas asistencia electrica.
          - listitem [ref=f60e273]:
            - strong [ref=f60e274]: "Suspension:"
            - text: Amortiguador de muelle neumatico delantero y muelle trasero.
          - listitem [ref=f60e275]:
            - strong [ref=f60e276]: "Dimensiones Desplegado:"
            - text: 1220 x 660 x 1220 mm.
          - listitem [ref=f60e277]:
            - strong [ref=f60e278]: "Dimensiones Plegado:"
            - text: 1230 x 260 x 450 mm.
          - listitem [ref=f60e279]:
            - strong [ref=f60e280]: "Peso:"
            - text: 29.6 kg - 32.5 kg.
        - paragraph [ref=f60e281]: El Dualtron Popular es, sin duda, la democratizacion de la alta gama. Un patinete fiable, potente y diseñado para durar.
        - paragraph [ref=f60e282]:
          - strong [ref=f60e283]: "Dualtron POP: Rendimiento de Alta Gama al Mejor Precio"
        - paragraph [ref=f60e284]:
          - text: Si estás buscando
          - strong [ref=f60e285]: comprar un patinete eléctrico potente
          - text: que combine autonomía y portabilidad, el
          - strong [ref=f60e286]: Dualtron Popular (POP)
          - text: es la solución definitiva. Este modelo se ha consolidado como uno de los
          - strong [ref=f60e287]: mejores patinetes eléctricos de 2026
          - text: gracias a su versatilidad, permitiendo elegir entre versiones de motor único o
          - strong [ref=f60e288]: doble motor de 900W
          - text: . Es el vehículo de movilidad personal ideal para quienes necesitan subir pendientes pronunciadas y buscan un
          - strong [ref=f60e289]: scooter eléctrico Dualtron
          - text: que ofrezca la fiabilidad de una marca premium sin realizar una inversión excesiva.
        - paragraph [ref=f60e290]:
          - text: La experiencia de conducción del
          - strong [ref=f60e291]: Dualtron POP
          - text: destaca por su comodidad superior, integrando un sistema de
          - strong [ref=f60e292]: doble suspensión
          - text: y neumáticos de 9 pulgadas que absorben cualquier irregularidad del asfalto. Con opciones de
          - strong [ref=f60e293]: batería Samsung de larga duración
          - text: que alcanzan hasta los 60 km de autonomía, este patinete se posiciona como el líder en
          - strong [ref=f60e294]: movilidad urbana sostenible
          - text: . Además, su compatibilidad con la
          - strong [ref=f60e295]: App Dualtron
          - text: y su diseño plegable lo convierten en la opción más inteligente para los usuarios que buscan un
          - strong [ref=f60e296]: patinete eléctrico ligero y potente
          - text: para su día a día.
