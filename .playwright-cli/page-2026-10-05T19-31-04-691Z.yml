    - generic [ref=f84e219]:
      - heading "Patinete Eléctrico Dualtron Victor Limited EY4" [level=2] [ref=f84e221]
      - generic [ref=f84e223]:
        - 'heading "Dualtron Victor Limited: El Patinete Eléctrico Urbano de Alta Gama Definitivo" [level=3] [ref=f84e224]'
        - paragraph [ref=f84e225]:
          - text: El
          - strong [ref=f84e226]: Dualtron Victor Limited
          - text: representa la cumbre de la serie Victor. Es el resultado de años de experiencia y retroalimentacion de usuarios, logrando un equilibrio perfecto entre potencia, dimensiones y comodidad. Esta version "V4" condensa las mejoras de sus predecesores (Luxury y Luxury PLUS) en un vehiculo diseñado para quienes no aceptan compromisos en sus desplazamientos diarios.
        - paragraph [ref=f84e227]: Con una plataforma mas amplia, un manillar mas alto y un equipamiento de seguridad de serie completo, el Victor Limited es el patinete electrico de alta gama definitivo para el entorno urbano.
        - heading [level=3] [ref=f84e228]:
          - strong [ref=f84e229]: Mejoras Clave de la Edicion Limited
        - list [ref=f84e230]:
          - listitem [ref=f84e231]:
            - strong [ref=f84e232]: "Dimensiones Optimizadas:"
            - text: Hereda la ergonomia del Luxury PLUS con una cubierta
            - strong [ref=f84e233]: 60mm mas larga
            - text: y un tubo de direccion
            - strong [ref=f84e234]: 60mm mas alto
            - text: ", ideal para usuarios de talla europea que buscan comodidad y estabilidad."
          - listitem [ref=f84e235]:
            - strong [ref=f84e236]: "Seguridad Integral:"
            - text: Equipado con un potente
            - strong [ref=f84e237]: faro delantero, claxon electronico, intermitentes y luces de advertencia
            - text: integradas para una visibilidad total en cualquier condicion.
          - listitem [ref=f84e238]:
            - strong [ref=f84e239]: "Control Inteligente:"
            - text: Incorpora la nueva
            - strong [ref=f84e240]: pantalla EY4
            - text: con conectividad para aplicacion en iOS y Android, permitiendo ajustes personalizados y diagnosticos en tiempo real.
          - listitem [ref=f84e241]:
            - strong [ref=f84e242]: "Acabados Premium:"
            - text: Incluye de serie el reposapies trasero tipo spoiler y una base de goma antideslizante que mejora el agarre y la estetica del conjunto.
        - heading [level=3] [ref=f84e243]:
          - strong [ref=f84e244]: Rendimiento y Potencia
        - paragraph [ref=f84e245]:
          - text: El Victor Limited no solo es comodo, es una bestia en el asfalto. Gracias a sus
          - strong [ref=f84e246]: dos motores de 1300W de potencia nominal
          - text: ", este patinete ofrece una aceleracion lineal y una capacidad de ascenso sobresaliente."
        - list [ref=f84e247]:
          - listitem [ref=f84e248]:
            - strong [ref=f84e249]: "Velocidad Maxima:"
            - text: Limitado a 25 km/h para cumplir con la normativa vigente. Capaz de alcanzar los
            - strong [ref=f84e250]: 80 km/h
            - text: en terrenos privados o zonas sin restricciones.
          - listitem [ref=f84e251]:
            - strong [ref=f84e252]: "Angulo de Escalada:"
            - text: Supera pendientes de hasta el
            - strong [ref=f84e253]: 70 por ciento (35 grados de inclinacion)
            - text: ", eliminando cualquier obstaculo en tu ruta."
          - listitem [ref=f84e254]:
            - strong [ref=f84e255]: "Carga Maxima:"
            - text: Estructura robusta diseñada para soportar hasta
            - strong [ref=f84e256]: 120 kg
            - text: .
        - heading [level=3] [ref=f84e257]:
          - strong [ref=f84e258]: "Elige tu Version: Lite o Pro"
        - paragraph [ref=f84e259]: "Ofrecemos dos configuraciones para adaptarse a tus necesidades de autonomia y presupuesto:"
        - paragraph [ref=f84e260]:
          - strong [ref=f84e261]: CaracteristicaDualtron Victor Limited LITEDualtron Victor Limited PROBateria
          - text: 60V 31.5Ah (CN4500)60V 35Ah (Samsung o LG)
          - strong [ref=f84e262]: Autonomia
          - text: Hasta 98 kmHasta 110 km
          - strong [ref=f84e263]: Tiempo de Carga
          - text: 18 horas20.5 horas
          - strong [ref=f84e264]: Carga Rapida (5A)
          - text: 6 horas y 20 minutos7 horas
          - strong [ref=f84e265]: Uso Recomendado
          - text: Trayectos diarios largosMaxima autonomia y celdas premium
        - heading [level=3] [ref=f84e266]:
          - strong [ref=f84e267]: Especificaciones Tecnicas Detalladas
        - heading [level=4] [ref=f84e268]:
          - strong [ref=f84e269]: Sistema de Suspension Personalizable
        - paragraph [ref=f84e270]: El sistema de suspension de goma delantera y trasera utiliza cartuchos reemplazables. Existen 5 niveles de dureza (desde los cartuchos verdes mas blandos hasta los negros mas duros), permitiendo ajustar la amortiguacion segun tu peso y estilo de conduccion.
        - heading [level=4] [ref=f84e271]:
          - strong [ref=f84e272]: Frenos de Alta Precision
        - paragraph [ref=f84e273]:
          - text: Equipado con un sistema de
          - strong [ref=f84e274]: frenos hidraulicos NUTT
          - text: en ambas ruedas, complementados con asistencia electrica al frenado (KERS). Seguridad garantizada con una respuesta de frenado corta y modulable.
        - heading [level=4] [ref=f84e275]:
          - strong [ref=f84e276]: Neumaticos y Estabilidad
        - paragraph [ref=f84e277]:
          - text: Utiliza neumaticos
          - strong [ref=f84e278]: Tubeless de 10 x 3.0 pulgadas
          - text: . Este tamaño es el compromiso ideal entre maniobrabilidad para zigzaguear en la ciudad y una superficie de contacto lo suficientemente amplia para una adherencia superior.
        - heading [level=4] [ref=f84e279]:
          - strong [ref=f84e280]: Dimensiones y Portabilidad
        - list [ref=f84e281]:
          - listitem [ref=f84e282]:
            - strong [ref=f84e283]: "Desplegado:"
            - text: 1230 x 600 x 1300 mm
          - listitem [ref=f84e284]:
            - strong [ref=f84e285]: "Plegado:"
            - text: 1230 x 260 x 560 mm
          - listitem [ref=f84e286]:
            - strong [ref=f84e287]: "Peso:"
            - text: 39.1 kg
        - heading [level=3] [ref=f84e288]:
          - strong [ref=f84e289]: Seguridad y Tecnologia de Bateria
        - paragraph [ref=f84e290]:
          - text: Ambas versiones cuentan con un
          - strong [ref=f84e291]: BMS (Sistema de Gestion de Bateria) avanzado
          - text: "que monitoriza constantemente las celdas para proteger el vehiculo contra:"
        - list [ref=f84e292]:
          - listitem [ref=f84e293]: Sobrecalentamiento y cortocircuitos.
          - listitem [ref=f84e294]: Sobrecorriente y sobrecarga.
          - listitem [ref=f84e295]: Sobredescarga profunda para prolongar la vida util.
        - paragraph [ref=f84e296]: El patinete se entrega limitado a 25 km/h de fabrica. La velocidad maxima de 80 km/h solo esta disponible para su uso en terrenos privados de acuerdo con la normativa local de cada region.
        - heading "Potencia, Autonomía y Confort en el Nuevo Dualtron Victor Limited V4" [level=3] [ref=f84e297]
        - paragraph [ref=f84e298]:
          - text: Si buscas
          - strong [ref=f84e299]: comprar un patinete eléctrico potente
          - text: que combine la agilidad de un modelo compacto con las prestaciones de un vehículo de alto rendimiento, el
          - strong [ref=f84e300]: Dualtron Victor Limited
          - text: es la elección ideal. Esta evolución del exitoso Dualtron Victor ha sido diseñada específicamente para satisfacer a los usuarios más exigentes que necesitan un
          - strong [ref=f84e301]: patinete eléctrico de largo alcance
          - text: con una autonomía de hasta 110 km. Gracias a su doble motor de 1300W y su estructura mejorada, este modelo se posiciona como el referente en movilidad urbana premium, superando con facilidad pendientes pronunciadas y ofreciendo una estabilidad inigualable en asfalto.
        - paragraph [ref=f84e302]:
          - text: La seguridad y la tecnología son los pilares de este
          - strong [ref=f84e303]: patinete eléctrico Dualtron
          - text: . Equipado con la avanzada pantalla EY4, conectividad mediante App móvil y un sistema de frenos hidráulicos NUTT, el Victor Limited garantiza un control total en cada trayecto. Además, su sistema de suspensión ajustable y los neumáticos tubeless de 10 pulgadas lo convierten en el
          - strong [ref=f84e304]: mejor patinete eléctrico para ciudad
          - text: del mercado actual. No importa si eliges la versión Lite o la Pro con celdas Samsung/LG, estarás adquiriendo un vehículo de movilidad personal que define el futuro del transporte sostenible con la garantía de calidad de Minimotors.
