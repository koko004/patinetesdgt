                - heading "Doble motor para una aceleración más seria" [level=2] [ref=f71e340]
                - paragraph [ref=f71e341]:
                  - text: Este Adasmart monta
                  - strong [ref=f71e342]: dos motores de 500W nominales
                  - text: ", con una potencia total de"
                  - strong [ref=f71e343]: 1000W nominales
                  - text: y hasta
                  - strong [ref=f71e344]: 2400W de pico
                  - text: .
                - paragraph [ref=f71e345]: Esto se nota mucho en ciudad. Sales con más fuerza, subes cuestas con más seguridad y tienes una respuesta mucho más contundente cuando necesitas potencia.
                - paragraph [ref=f71e346]: Es perfecto para riders que buscan un patinete eléctrico rápido, estable y con ese punto racing que se nota al conducir.
                - heading "Batería 31Ah para llegar más lejos" [level=2] [ref=f71e347]
                - paragraph [ref=f71e348]:
                  - text: La batería de
                  - strong [ref=f71e349]: litio 48V 31Ah
                  - text: permite una autonomía máxima de hasta
                  - strong [ref=f71e350]: 100 km
                  - text: en condiciones óptimas.
                - paragraph [ref=f71e351]: Esto lo convierte en un patinete ideal para trayectos largos, ir al trabajo, moverte por ciudad o hacer rutas sin estar mirando la batería cada poco.
                - paragraph [ref=f71e352]: Si quieres un patinete eléctrico con buena autonomía, el Adasmart V Dual 22.5Ah es una opción muy seria.
                - heading "Velocidad, control y seguridad" [level=2] [ref=f71e353]
                - paragraph [ref=f71e354]:
                  - text: El Adasmart V Dual puede alcanzar hasta
                  - strong [ref=f71e355]: 50 km/h
                  - text: ", aunque viene limitado a"
                  - strong [ref=f71e356]: 25 km/h
                  - text: para cumplir con el uso permitido en vía pública.
                - paragraph [ref=f71e357]:
                  - text: Su controladora de
                  - strong [ref=f71e358]: onda sinusoidal 25A + 25A
                  - text: ayuda a que la entrega de potencia sea más suave y precisa. Esto hace que el patinete se sienta más fino, más estable y más fácil de controlar.
                - paragraph [ref=f71e359]:
                  - text: Además, el sistema de
                  - strong [ref=f71e360]: doble freno de disco mecánico
                  - text: ofrece una frenada directa y segura.
                - heading "Ruedas tubeless de 10 pulgadas" [level=2] [ref=f71e361]
                - paragraph [ref=f71e362]:
                  - text: Las ruedas
                  - strong [ref=f71e363]: 10” tubeless
                  - text: ", sin cámara, dan más estabilidad y comodidad al rodar. Son ideales para ciudad, carriles bici y rutas donde necesitas buen agarre."
                - paragraph [ref=f71e364]: Al no llevar cámara, reducen el riesgo de pinchazos típicos por pellizco. Eso se agradece mucho si usas el patinete todos los días.
                - heading "Display LCD, NFC y APP" [level=2] [ref=f71e365]
                - paragraph [ref=f71e366]:
                  - text: Este patinete viene equipado con
                  - strong [ref=f71e367]: display LCD a color
                  - text: ", sistema"
                  - strong [ref=f71e368]: NFC
                  - text: y conexión con
                  - strong [ref=f71e369]: APP
                  - text: .
                - paragraph [ref=f71e370]: Todo esto le da un toque más moderno y cómodo. Puedes controlar mejor el patinete, revisar información importante y tener una experiencia más completa.
                - heading "Chasis de aluminio forjado para más estabilidad" [level=2] [ref=f71e371]
                - paragraph [ref=f71e372]:
                  - text: El chasis de
                  - strong [ref=f71e373]: aluminio forjado
                  - text: le da una estructura fuerte, estable y preparada para uso diario.
                - paragraph [ref=f71e374]: Aun siendo un patinete potente, mantiene un equilibrio muy bueno entre rendimiento y maniobrabilidad. Es ideal para moverse rápido por ciudad, subir cuestas y tener buena sensación de control.
                - heading "La potencia dual definitiva para el día a día" [level=2] [ref=f71e375]
                - paragraph [ref=f71e376]: El Adasmart V Dual 22.5Ah está pensado para riders que quieren un patinete potente, cómodo y con autonomía real.
                - paragraph [ref=f71e377]: Tiene fuerza para rutas exigentes, batería para llegar más lejos y tecnología para que la conducción sea más fina. Si vienes de un patinete básico, el salto se nota muchísimo.
                - heading "Por qué comprar el Adasmart V Dual 31Ah en PatineteStore" [level=2] [ref=f71e378]
                - paragraph [ref=f71e379]:
                  - text: En
                  - strong [ref=f71e380]: PatineteStore
                  - text: sabemos que quien busca un patinete dual quiere potencia de verdad, buena autonomía y componentes que aguanten.
                - paragraph [ref=f71e381]:
                  - text: Este modelo es ideal si estás buscando un
                  - strong [ref=f71e382]: patinete eléctrico rápido barato
                  - text: ", un"
                  - strong [ref=f71e383]: patinete eléctrico potente barato
                  - text: ", un patinete eléctrico tipo Dualtron o un modelo dual con buena relación entre fuerza, autonomía y tecnología."
                - paragraph [ref=f71e384]:
                  - text: Si quieres un patinete que tenga pegada, aguante rutas largas y se sienta estable en el día a día, el
                  - strong [ref=f71e385]: Adasmart V Dual 31Ah
                  - text: es una apuesta muy fuerte.
