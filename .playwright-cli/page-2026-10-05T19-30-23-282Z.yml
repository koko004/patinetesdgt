        - generic [ref=f52e115]:
          - generic [ref=f52e116]: Más potencia para experiencias extraordinarias
          - generic [ref=f52e118]: El sistema de batería de 48 V se combina con un motor de tracción trasera de 400 W para proporcionar aún más potencia. Tanto si aceleras como si vas a subir una colina, el patinete superará cada situación con facilidad para que puedas disfrutar de una experiencia de conducción fluida y sencilla.
