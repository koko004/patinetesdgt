      - generic [ref=f52e147]:
        - generic [ref=f52e148]: Conducción más cómoda con ruedas ampliadas mejoradas de 10"
        - generic [ref=f52e150]: La superficie mejorada de la rueda se ha ampliado de 54 mm a 60 mm*, cuenta con una mayor capacidad de aire y ofrece una mejor absorción de impactos. La rueda cuenta con una mayor superficie de contacto con el suelo que mejora el agarre al inclinarse en giros y ofrece una experiencia de conducción más estable y segura en general.
      - generic [ref=f52e154]:
        - generic [ref=f52e155]: El panel de mandos multifunción muestra los datos de un vistazo
        - generic [ref=f52e157]: El panel de mandos está colocado en un ángulo cómodo que permite al conductor ver la velocidad, el nivel de batería restante, los intermitentes y el estado del patinete durante el trayecto.
      - generic [ref=f52e159]:
        - generic [ref=f52e161]:
          - generic [ref=f52e162]: Tres modos de velocidad al alcance de la mano
          - generic [ref=f52e164]: Alterna entre los diferentes modos de velocidad con solo tocar dos veces el botón de encendido de la parte inferior de la pantalla para satisfacer tus necesidades de conducción.
        - generic [ref=f52e166]:
          - generic [ref=f52e169]:
            - generic [ref=f52e170]: Modo peatón
            - generic [ref=f52e172]: 6 km/h
          - generic [ref=f52e176]:
            - generic [ref=f52e177]: Modo estándar
            - generic [ref=f52e179]: 20 km/h
          - generic [ref=f52e183]:
            - generic [ref=f52e184]: Modo deportivo
            - generic [ref=f52e186]: 25 km/h*
      - generic [ref=f52e190]:
        - generic [ref=f52e191]: Mayor capacidad de la batería para una autonomía ultralarga de 60 km*
        - generic [ref=f52e193]: La batería de litio de gran capacidad de 468 Wh* proporciona gran autonomía por carga, para que puedas disfrutar tanto de los desplazamientos diarios como de trayectos cortos durante el fin de semana.
      - generic [ref=f52e197]:
        - generic [ref=f52e198]: Varios modos de recuperación de energía para que disfrutes de una experiencia de conducción completamente nueva
        - generic [ref=f52e200]: La energía cinética generada durante el frenado y el deslizamiento se convierte en energía eléctrica utilizable para aumentar todavía más la autonomía.
        - generic [ref=f52e202]: "* La recuperación de energía se puede activar y configurar en la aplicación Mi Home/Xiaomi Home."
      - generic [ref=f52e204]:
        - generic [ref=f52e206]:
          - generic [ref=f52e207]: Sistema de gestión inteligente de la batería para la seguridad de la batería
          - generic [ref=f52e209]: El sistema de gestión inteligente de la batería (BMS) supervisa continuamente el estado de la batería y proporciona seis medidas inteligentes para protegerla frente a sobrecargas, sobredescargas, sobrecalentamientos y sobrecorrientes. Estas medidas prolongan la duración de la batería del patinete y garantizan la seguridad durante la conducción.
        - generic [ref=f52e211]:
          - generic [ref=f52e212]:
            - generic [ref=f52e213]: Protección contra cortocircuitos
            - generic [ref=f52e217]: Protección contra sobrecorriente
            - generic [ref=f52e221]: Protección contra sobrecarga
          - generic [ref=f52e225]:
            - generic [ref=f52e226]: Protección contra sobredescarga
            - generic [ref=f52e230]: Protección por temperatura excesiva
            - generic [ref=f52e234]: Suspensión automática con baja tensión
      - generic [ref=f52e240]:
        - generic [ref=f52e241]: Aplicación Mi Home/Xiaomi Home para cada trayecto
        - generic [ref=f52e243]: Conecta tu Xiaomi Electric Scooter 4 Pro (2nd Gen) a la aplicación Mi Home/Xiaomi Home mediante Bluetooth para ver tanto información sobre el estado, la batería y el kilometraje del patinete, como para controlar la iluminación, bloquear el motor, configurar la luz delantera autoadaptable y actualizar el firmware.
      - generic [ref=f52e246]:
        - generic [ref=f52e247]:
          - generic [ref=f52e249]:
            - generic [ref=f52e250]: Giros más seguros con el indicador de dirección integrado
            - generic [ref=f52e252]: El intermitente de alta intensidad con certificación E-Mark estándar se enciende inmediatamente después de pulsar el botón de giro, mientras que el timbre suena para alertar a los peatones y a los vehículos que circulan detrás y hacer que cada giro sea seguro.
          - generic [ref=f52e254]: Certificación E-Mark
        - generic [ref=f52e258]:
          - generic [ref=f52e261]:
            - generic [ref=f52e262]: Tranquilidad durante los trayectos nocturnos gracias a la brillante luz delantera automática
            - generic [ref=f52e264]: La luz delantera automática se puede activar en la aplicación Mi Home/Xiaomi Home. Cuando hay poca luz ambiental, la luz delantera se enciente automáticamente para facilitar la conducción.
          - generic [ref=f52e268]:
            - generic [ref=f52e269]: Frenado fiable y luz trasera llamativa
            - generic [ref=f52e271]: La luz trasera se enciende automáticamente cuando se enciende la delantera. Al frenar, la llamativa luz trasera alerta de forma eficaz a los peatones y a los vehículos que circulan detrás. También puedes configurar la luz trasera para que permanezca encendida en la aplicación Mi Home/Xiaomi Home para mejorar la seguridad.
      - generic [ref=f52e275]:
        - generic [ref=f52e276]: Marco de acero al carbono rígido y fiable de alta resistencia
        - generic [ref=f52e278]: Elaborado con acero al carbono grueso de 1,5 mm*, el marco puede soportar una carga estática máxima de 500 kg* y una carga dinámica máxima de 120 kg, lo que garantiza la durabilidad y resistencia del patinete.
      - generic [ref=f52e282]:
        - generic [ref=f52e283]: Freno doble para el doble de protección
        - generic [ref=f52e285]: El freno de tambor de la rueda delantera y el E-ABS de la rueda trasera funcionan juntos para acortar la distancia de frenado y mejorar la seguridad.
      - generic [ref=f52e287]: Diseñado para plegarlo fácilmente en solo 3 pasos
      - generic [ref=f52e292]:
        - generic [ref=f52e293]: "* Notas:"
        - generic [ref=f52e295]: "* Potencia máx. del motor de 1000 W: se utilizó un medidor de potencia para medir la potencia de entrada del motor con una tensión máxima de 54,6 V de CC y la corriente máxima de corte. Requisito de conformidad: 1000 W ± 50 W. Datos de la prueba de TIRT, número de informe: OTA1-202304763."
        - generic [ref=f52e297]: "* Pendiente máxima del 22 %: El patinete, con una carga total de 75 kg ± 5 kg y un nivel de batería del 70 % ± 10 %, subió una rampa de 10 m a 15 km/h desde la parte inferior. Se desplazó de forma constante sin atascos ni fallos de alimentación durante la prueba y salió de la rampa a una velocidad superior a 6 km/h. Datos de la prueba de TIRT, número de informe: OTA1-202304763."
        - generic [ref=f52e299]: "* Velocidad máxima de 25 km/h: A (25 ± 5)° C y una velocidad media del viento de ≤3 m/s, con una carga total de 75 kg ± 5 kg y un nivel de batería del 70 % ± 10 %, el patinete aceleró en una zona de conducción adicional y mantuvo la velocidad máxima hasta alcanzar el área de prueba. La velocidad máxima en el área de prueba se midió con un tacómetro. Velocidad máxima: 25 km/h ± 10 %. Datos de la prueba de TIRT, número de informe: OTA1-202304763."
        - generic [ref=f52e301]: "* Anchura de la superficie de la rueda de 60 mm: La anchura de la rueda se midió con un calibre y el valor obtenido no fue inferior al valor de diseño, lo que indica que se cumplió el requisito. La anchura de la rueda del Xiaomi Electric Scooter 4 Pro (2nd Gen) es de 60 mm y la anchura de la rueda del Xiaomi Electric Scooter 4 es de 54,1 mm. Los datos están probados por los fabricantes."
        - generic [ref=f52e303]: "* Modo peatón: 6 km/h. Modo estándar: 20 km/h. Modo deportivo: 25 km/h. A (25 ± 5)° C y una velocidad media del viento de ≤3 m/s, con una carga total de 75 kg ± 5 kg y un nivel de batería del 70 % ± 10 %, el patinete aceleró en una zona de conducción adicional y mantuvo la velocidad máxima hasta alcanzar el área de prueba. La velocidad máxima en el área de prueba se midió con un tacómetro o por Bluetooth y el panel de mandos respectivamente. Los datos están probados por los fabricantes."
        - generic [ref=f52e305]: "* Autonomía del patinete de 60 km: La prueba se inició después de cargar por completo el patinete mediante el adaptador incluido y una vez que el indicador luminoso del adaptador se volvió de color verde. El patinete se probó a (25 ± 5)° C y con una velocidad media del viento de ≤3 m/s, con una carga total de 75 kg ± 5 kg. Se condujo en una carretera plana a una velocidad media de 15 km/h hasta que se ralentizó significativamente y dejó de moverse. Datos de la prueba de TIRT, número de informe: OTA1-202304763."
        - generic [ref=f52e307]: "*Capacidad de la batería de 468 Wh: La capacidad real de la batería se midió en una batería cargada completamente en modo estándar, como se especifica en el manual, y después de dejarla reposar una hora. A continuación, la batería se mantuvo a una temperatura normal (25 ± 5)° C y se descargó con una corriente de 0,5 C hasta que se alcanzó la tensión de corte especificada o se activó la protección de la batería. En la prueba, la capacidad de la batería fue de 484,6 Wh después de 2 ciclos de carga y descarga de la batería, durante los cuales se utilizó la capacidad de descarga máxima como capacidad probada. Los datos están probados por los fabricantes."
        - generic [ref=f52e309]: "* La recuperación de energía se puede activar y configurar en la aplicación Mi Home/Xiaomi Home."
        - generic [ref=f52e311]: "* Anchura del marco de 1,5 mm: La anchura del marco se midió con un calibre y el valor obtenido no fue inferior al valor de diseño, lo que indica que se cumplió el requisito. La anchura del marco medido fue de 1,67 mm. Los datos están probados por los fabricantes."
        - generic [ref=f52e313]: "* Carga estática de 500 kg: Con el patinete detenido, se aplicó una carga de 500 kg en el centro de la plataforma, con un área de carga de 100 mm x 100 mm. La carga estática se mantuvo durante 5 minutos. Después de la prueba, se inspeccionaron los componentes del marco para detectar grietas, fracturas o deformaciones visibles. Los datos están probados por los fabricantes."
