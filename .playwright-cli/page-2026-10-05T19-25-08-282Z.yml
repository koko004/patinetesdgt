        - generic [ref=e292]:
          - generic [ref=e295]:
            - heading "Kukirin.es – Tienda oficial KuKirin en España" [level=2] [ref=e296]
            - paragraph [ref=e297]: "No todos los patinetes eléctricos ofrecen la misma experiencia, y tampoco todos los sitios donde comprarlos. En Kukirin.es nos centramos en algo muy concreto: que compres con tranquilidad y sepas que detrás hay un servicio que responde."
            - paragraph [ref=e298]:
              - text: Somos
              - strong [ref=e299]: tienda oficial de KuKirin en España
              - text: ", lo que significa que todos los modelos son originales, con garantía real y soporte técnico gestionado desde aquí. Sin intermediarios, sin procesos complicados y sin depender de terceros."
            - paragraph [ref=e300]:
              - text: Además, trabajamos con stock en España, lo que nos permite ofrecer
              - strong [ref=e301]: envíos rápidos en 24/72 horas
              - text: y sin costes adicionales. Compras hoy y en pocos días puedes estar utilizándolo.
            - heading "Por qué elegir Kukirin.es" [level=3] [ref=e302]
            - paragraph [ref=e303]: "Cuando compras un patinete eléctrico no solo eliges un modelo, también eliges el servicio que lo acompaña. Estas son algunas de las razones por las que cada vez más usuarios confían en Kukirin.es:"
            - list [ref=e304]:
              - listitem [ref=e305]:
                - strong [ref=e306]: Tienda oficial en España.
                - text: Producto original con respaldo directo de la marca.
              - listitem [ref=e307]:
                - strong [ref=e308]: Entrega rápida.
                - text: Sin esperas largas ni envíos internacionales.
              - listitem [ref=e309]:
                - strong [ref=e310]: Garantía de hasta 3 años.
                - text: Cobertura real, sin letra pequeña.
              - listitem [ref=e311]:
                - strong [ref=e312]: Servicio técnico nacional.
                - text: Talleres en España y recogida a domicilio si es necesario.
              - listitem [ref=e313]:
                - strong [ref=e314]: Pago a plazos.
                - text: Divide tu compra fácilmente sin intereses.
              - listitem [ref=e315]:
                - strong [ref=e316]: Atención al cliente directa.
                - text: Respuestas claras y sin automatismos.
            - generic [ref=e317]:
              - text: Si necesitas más información, tutoriales de mantenimiento o comparativas con otros patinetes eléctricos, ponemos a tu disposición nuestro
              - link "blog" [ref=e318] [cursor=pointer]:
                - /url: https://kukirin.es/blog/
              - text: para mantenerte actualizado y al día de todo lo relevante al rededor del ecosistema de patinetes Kukirin en España.
            - heading "Patinetes eléctricos KuKirin más vendidos" [level=3] [ref=e320]
            - paragraph [ref=e321]: "Dentro de la gama KuKirin encontrarás opciones tanto para uso urbano como para recorridos más exigentes. Estos son algunos de los modelos más buscados en España:"
            - paragraph [ref=e322]:
              - link [ref=e323] [cursor=pointer]:
                - /url: https://kukirin.es/producto/patinete-electrico-kukirin-g2/
                - strong [ref=e324]: KuKirin G2
              - text: – Uno de los modelos más equilibrados. Fiable, cómodo y con versión homologada por la DGT, lo que lo convierte en una opción muy completa para el día a día.
            - paragraph [ref=e325]:
              - link [ref=e326] [cursor=pointer]:
                - /url: https://kukirin.es/producto/patinete-electrico-kukirin-g2-pro-homologado-dgt-vmp/
                - strong [ref=e327]: KuKirin G2 Pro
              - text: – Un clásico, fiable y ligero, manteniendo un manejo sencillo. Muy buena opción si quieres algo más sin complicarte. También con versión homologada por la DGT.
            - paragraph [ref=e328]:
              - link [ref=e329] [cursor=pointer]:
                - /url: https://kukirin.es/producto/patinete-electrico-kukirin-g2-master/
                - strong [ref=e330]: KuKirin G2 Master
              - text: – Pensado para un uso más intensivo. Destaca por su potencia, rendimiento y su relación calidad-precio.
            - paragraph [ref=e331]:
              - link [ref=e332] [cursor=pointer]:
                - /url: https://kukirin.es/producto/patinete-electrico-kukirin-g4/
                - strong [ref=e333]: KuKirin G4
              - text: – uno de los modelos más potente de la marca, orientado a quienes buscan prestaciones superiores en todos los aspectos.
            - paragraph [ref=e334]:
              - link [ref=e335] [cursor=pointer]:
                - /url: https://kukirin.es/producto/patinete-electrico-kukirin-g2-max/
                - strong [ref=e336]: KuKirin G2 Max
              - text: – Perfecto si priorizas autonomía y comodidad en trayectos largos.
            - paragraph [ref=e337]:
              - link [ref=e338] [cursor=pointer]:
                - /url: https://kukirin.es/producto/patinete-electrico-kugoo-kirin-g3/
                - strong [ref=e339]: KuKirin G3
              - text: – Estabilidad, robustez y conducción suave incluso en superficies más irregulares.
            - heading "Servicio técnico KuKirin en España" [level=3] [ref=e340]
            - paragraph [ref=e341]: Una de las principales dudas al comprar un patinete eléctrico es qué ocurre si necesitas asistencia. En Kukirin.es ese aspecto está cubierto desde el primer momento.
            - paragraph [ref=e342]:
              - text: Disponemos de
              - strong [ref=e343]: servicio técnico en distintas ciudades de España
              - text: ", y si no tienes uno cercano, gestionamos la recogida a domicilio durante el periodo de garantía. Todo el proceso se realiza aquí, sin envíos internacionales ni esperas innecesarias."
            - paragraph [ref=e344]: Esto marca la diferencia en el uso a largo plazo.
            - paragraph [ref=e345]: Cuando necesites hacer uso de la garantía, contacta con nosotros y te indicaremos cómo proceder y si hay un taller autorizado cerca de tu domicilio o recogemos el patinete (necesitarás la caja).
            - heading "Movilidad eléctrica para el día a día" [level=3] [ref=e346]
            - paragraph [ref=e347]: El patinete eléctrico se ha consolidado como una alternativa real al coche en ciudad. Permite ahorrar tiempo, evitar atascos y reducir costes en desplazamientos diarios.
            - paragraph [ref=e348]: Pero para que realmente sea una buena inversión, necesitas un modelo fiable y un servicio que esté a la altura. KuKirin apuesta por ese equilibrio entre potencia, autonomía y durabilidad, pensado para un uso real.
            - paragraph [ref=e349]:
              - strong [ref=e350]: Explora los modelos disponibles, compara y elige el que mejor encaje contigo. En pocos días lo tendrás en casa listo para usar.
