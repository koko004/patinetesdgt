                  - paragraph [ref=f29e473]:
                    - strong [ref=f29e474]: NAVEE XT5 PRO certificado por la DGT
                    - text: está diseñado para riders que exigen potencia, comodidad y fiabilidad. Su núcleo es un motor trasero sin escobillas de 700 W, que proporciona hasta 2200 W de potencia máxima y velocidades de hasta 45 km/h, mientras conquista pendientes de 24°. Una batería de 48 V y 12,75 Ah garantiza una autonomía de hasta 75 km, ampliable a 110 km con una batería externa enchufable. La carga es rápida, sólo 5 horas, o 2,5 horas con un cargador rápido. La estabilidad proviene de los neumáticos híbridos sin cámara de aire de 12 pulgadas montados en ruedas modulares, apoyados por una avanzada suspensión de doble muelle con 60 mm de recorrido. La frenada está asegurada por frenos de disco dobles de 120 mm con asistencia EABS. Un cómodo asiento opcional y un robusto chasis completan este versátil scooter.
                  - paragraph [ref=f29e475]:
                    - strong [ref=f29e476]: Sistema de carga rápida con soporte de carga flash
                  - paragraph [ref=f29e477]:
                    - strong [ref=f29e478]: Navee XT5 Pro
                    - text: está diseñadoa para ofrecer un rendimiento excepcional con su potente motor trasero sin escobillas de 700 W, que alcanza un impresionante máximo de 2200 W. Capaz de superar pendientes de hasta 24° y de alcanzar una velocidad máxima de 45 km/h (limitada a 25 km/h donde se aplique la normativa), equilibra la fuerza bruta con la seguridad. La batería de litio integrada de 48 V y 12,75 Ah proporciona una autonomía de conducción de hasta 75 km, ampliable a 110 km con la batería externa enchufable opcional. La carga es eficiente, requiere sólo 5 horas con el cargador de 5 A incluido o sólo 2,5 horas con un cargador rápido, lo que garantiza un tiempo de inactividad mínimo entre una conducción y otra.
                  - paragraph [ref=f29e479]:
                    - strong [ref=f29e480]: Grandes neumáticos híbridos sin cámara de 12 pulgadas para mayor estabilidad
                  - paragraph [ref=f29e481]: Una base robusta complementa la transmisión, con neumáticos híbridos sin cámara de 12 pulgadas que mejoran la tracción y la estabilidad en terrenos variados. Estos neumáticos están montados sobre ruedas modulares para simplificar el mantenimiento. El sistema de suspensión dual del scooter, que incorpora amortiguadores de muelle delanteros y traseros con 60 mm de recorrido, absorbe las superficies irregulares con facilidad. Los conductores están perfectamente informados gracias a una pantalla LED de 5 pulgadas que muestra claramente la velocidad, la autonomía y el estado de la batería, mientras que el intuitivo acelerador de pulgar proporciona una aceleración suave y controlada.
                  - paragraph [ref=f29e482]:
                    - strong [ref=f29e483]: Triple sistema de frenado con tecnología EABS
                  - paragraph [ref=f29e484]:
                    - text: La seguridad y la visibilidad son primordiales, y el
                    - strong [ref=f29e485]: Navee XT5 Pro
                    - text: integra un completo sistema de iluminación. Un faro delantero LED de 9 W con autodetección se activa en condiciones de poca luz, mientras que las luces traseras LED y los intermitentes integrados garantizan una señalización fiable en el tráfico. El sistema de frenado consta de dos frenos de disco de 120 mm con asistencia electrónica EABS, que proporcionan una potencia de frenado precisa. El control de crucero, los guardabarros, el robusto caballete y el reposapiés antideslizante mejoran la comodidad y la estabilidad del motorista tanto en los desplazamientos diarios como en los viajes de larga distancia.
                  - paragraph [ref=f29e486]:
                    - strong [ref=f29e487]: Desbloqueo automático con sistema NAVEE Flylock
                  - paragraph [ref=f29e488]: Las funciones inteligentes avanzadas distinguen a este scooter. La conectividad Bluetooth y la aplicación NAVEE permiten realizar ajustes precisos, como la recuperación de energía y la iluminación. NAVEE Flylock asegura el desbloqueo automático cuando un dispositivo emparejado está cerca, mientras que la compatibilidad con Apple Find My y Google Find My Device proporciona tranquilidad en caso de pérdida. Un chasis de acero al carbono soporta hasta 150 kg, protegido por la resistencia al agua IPX6 para circular en condiciones adversas. Con el modo boost, el control de tracción TCS y un diseño pensado para la durabilidad, la XT5 Pro se erige como una solución versátil tanto para trayectos urbanos como todoterreno.
                  - heading "Navee XT5 Pro certificado por la DGT especificaciones" [level=2] [ref=f29e489]
