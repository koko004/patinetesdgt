        - generic [ref=f3e213]:
          - generic [ref=f3e214]:
            - generic [ref=f3e215] [cursor=pointer]:
              - generic [ref=f3e216]: Descripción
              - generic [ref=f3e218]: 
            - tabpanel "Descripción" [ref=f3e219]:
              - generic [ref=f3e220]:
                - heading "Descripción" [level=2] [ref=f3e221]
                - heading "Kukirin G2 Pro Homologado DGT – VMP" [level=1] [ref=f3e222]
                - generic [ref=f3e223]:
                  - paragraph [ref=f3e224]:
                    - strong [ref=f3e225]: "AVISO:"
                  - paragraph [ref=f3e226]:
                    - strong [ref=f3e227]: Se envía con la nueva reprogramación que mejora considerablemente la aceleración del patinete y la salida con empuje.
                  - paragraph [ref=f3e228]: El inicio de la marcha se hace mediante empuje con el pie, tal y como marca la regulación de la DGT. Si no se impulsa de forma “manual” el patinete no iniciará la marcha al pulsar el botón del acelerador
                - paragraph [ref=f3e229]:
                  - text: El
                  - strong [ref=f3e230]: patinete eléctrico Kukirin G2 Pro
                  - text: es el modelo más vendido de la marca. Cuenta con un
                  - strong [ref=f3e231]: diseño y unos acabados muy cuidados,
                  - text: demostrando la calidad que pone en todos sus productos una marca como Kukirin.
                - paragraph [ref=f3e232]:
                  - text: Además, ahora llega en su
                  - strong [ref=f3e233]: versión homologada por la DGT,
                  - text: algo que mucha gente estaba esperando. Una versión adaptada de serie a las regulaciones españolas, y en poco tiempo hará que se convierta en el patinete eléctrico más vendido de España.
                - heading "Motor" [level=2] [ref=f3e234]
                - paragraph [ref=f3e235]:
                  - text: Su
                  - strong [ref=f3e236]: motor sin escobillas
                  - text: con una potencia de
                  - strong [ref=f3e237]: 500W
                  - text: ", cumple con la"
                  - strong [ref=f3e238]: regulación de potencia española
                  - text: ", por lo que no tendrás que preocuparte por multas. Cuenta con"
                  - strong [ref=f3e239]: 4 modos de conducción
                  - text: ", desde un modo paseo de 0-6 km/h hasta un modo de velocidad máxima"
                  - strong [ref=f3e240]: limitada de 25 km/h
                  - text: para cumplir con las normativas. Además, su motor es capaz de dar potencia suficiente para subir cuestas de
                  - strong [ref=f3e241]: hasta 19º de inclinación.
                - heading "Batería" [level=2] [ref=f3e242]
                - paragraph [ref=f3e243]:
                  - text: El patinete eléctrico cuenta con una
                  - strong [ref=f3e244]: batería de 15.6Ah y 48V
                  - text: ", dando una gran"
                  - strong [ref=f3e245]: autonomía
                  - text: de hasta
                  - strong [ref=f3e246]: 65 km
                  - text: . Esta autonomía puede variar en función de la velocidad, el peso del conductor, terreno, etc. El tiempo medio para una
                  - strong [ref=f3e247]: carga completa
                  - text: de la batería es de
                  - strong [ref=f3e248]: 7-8 horas
                  - text: ", por lo que podrás cargarlo durante la noche y estará listo al día siguiente."
                - heading "Neumáticos y frenos" [level=2] [ref=f3e249]
                - paragraph [ref=f3e250]:
                  - text: El Kukirin G2 Pro homologado DGT monta unos
                  - strong [ref=f3e251]: neumáticos de aire de 9″ todoterreno
                  - text: ", aptos para cualquier superficie. Desde el asfalto de la ciudad hasta las pistas de tierra."
                - paragraph [ref=f3e252]:
                  - text: Su sistema de frenado está compuesto por frenos de
                  - strong [ref=f3e253]: disco mecánicos con discos de 120mm de diámetro
                  - text: ", tanto en la rueda"
                  - strong [ref=f3e254]: delantera como en la rueda trasera
                  - text: . Un sistema de frenos más que suficiente para el patinete y circular a velocidades legales.
                - heading "Iluminación" [level=2] [ref=f3e255]
                - paragraph [ref=f3e256]:
                  - text: El Kukirin G2 Pro cuenta con un
                  - strong [ref=f3e257]: foco LED principal homologado por la DGT
                  - text: en su parte frontal con
                  - strong [ref=f3e258]: 3 modos de iluminación
                  - text: . Lo que le proporciona al usuario una
                  - strong [ref=f3e259]: gran visibilidad en condiciones de baja luminosidad
                  - text: . En su parte trasera también dispone de una
                  - strong [ref=f3e260]: luz de freno
                  - text: LED homologada, que hará que seas visible en la vía. Por último, dispone de
                  - strong [ref=f3e261]: reflectores en los laterales
                  - text: para dar una mayor seguridad y ser fácilmente visto al hacer un giro. Todo el conjunto de iluminación está homologado por la DGT y te asegura una conducción segura por la noche.
                - heading "Chasis, suspensión, peso y tamaño" [level=2] [ref=f3e262]
                - paragraph [ref=f3e263]:
                  - text: El patinete cuenta con un
                  - strong [ref=f3e264]: chasis de aleación de aluminio y acero
                  - text: ", lo que lo hace ligero y robusto al mismo tiempo. Es capaz de"
                  - strong [ref=f3e265]: soportar hasta 120kg de peso
                  - text: . (No se recomienda montar más de 2 personas aunque no se superen los 120kg).
                - paragraph [ref=f3e266]:
                  - text: El peso del patinete se ve reducido hasta solo
                  - strong [ref=f3e267]: 22.3kg de peso,
                  - text: y sus dimensiones son razonablemente contenidas. Estando abierto sus dimensiones son de
                  - strong [ref=f3e268]: 117 x 59 x 130 cm.
                  - text: Mientas que la
                  - strong [ref=f3e269]: base donde se colocan los pies
                  - text: tiene una anchura de
                  - strong [ref=f3e270]: 18 cm.
                - paragraph [ref=f3e271]:
                  - text: Cuenta con una
                  - strong [ref=f3e272]: suspensión resistente en ambas ruedas
                  - text: ", capaz de absorber las irregularidades del terreno sin problemas. Brindando una conducción mucho más suave y cómoda en cualquier superficie."
                - heading "Pantalla y controles" [level=2] [ref=f3e273]
                - paragraph [ref=f3e274]:
                  - text: En la pantalla del Kukirin G2 Pro DGT encontrarás
                  - strong [ref=f3e275]: toda la información necesaria
                  - text: para el uso del patinete. Te marcará la velocidad, modo de conducción, nivel de batería, distancia del trayecto, distancia total, iluminación, testigo de freno, etc.
                - paragraph [ref=f3e276]:
                  - text: Además, los controles se han visto reducidos respecto a la versión del Kukirin G2 Pro anterior. Contando ahora con una
                  - strong [ref=f3e277]: botonera más sencilla
                  - text: ", intuitiva y fácil de usar."
