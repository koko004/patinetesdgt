    - generic [ref=f40e266]:
      - heading "Odyssr Rodeo Dual" [level=2] [ref=f40e268]
      - generic [ref=f40e270]:
        - 'heading "Patinete Eléctrico Odyssey Rodeo Dual: Potencia y Doble Motor con Certificado DGT" [level=3] [ref=f40e271]'
        - paragraph [ref=f40e272]:
          - text: El
          - strong [ref=f40e273]: Odyssey Rodeo Dual
          - text: representa la cumbre de la evolución en la movilidad urbana de alto rendimiento. Diseñado y fabricado bajo las estrictas directrices de ingeniería de
          - strong [ref=f40e274]: Teverun
          - text: ", este modelo hereda la robustez y la fiabilidad estructural de la aclamada plataforma"
          - emphasis [ref=f40e275]: Space
          - text: ", evolucionando hacia un concepto estético marcadamente deportivo ("
          - emphasis [ref=f40e276]: Sport Design
          - text: ).
        - paragraph [ref=f40e277]: "Este vehículo ha sido concebido para los usuarios más exigentes que no solo buscan un medio de transporte eficiente, sino una máquina capaz de transformar sus desplazamientos diarios en una experiencia de conducción superior. Al integrar tracción total inteligente (doble motor) y un sistema de almacenamiento de energía de alta tensión, el Rodeo Dual elimina de raíz los dos grandes problemas del sector: las pendientes pronunciadas y la necesidad de cargas diarias."
        - heading "CARACTERÍSTICAS PRINCIPALES" [level=3] [ref=f40e278]
        - list [ref=f40e279]:
          - listitem [ref=f40e280]:
            - strong [ref=f40e281]: "Potencia sin Límites (Sistema de Motor Dual 800W):"
            - text: Al contar con un motor síncrono en cada eje, el patinete distribuye de forma inteligente el par motor entre la rueda delantera y la trasera. Esto se traduce en una tracción integral y una aceleración lineal excepcionales, ideales para incorporarse con rapidez al flujo del tráfico urbano o para traccionar sobre superficies mojadas con total seguridad.
          - listitem [ref=f40e282]:
            - strong [ref=f40e283]: "Olvídese de las Cuestas (Potencia Pico de 2900W):"
            - text: Aunque la potencia nominal combinada es de 800W, la electrónica avanzada de Teverun permite liberar una potencia pico máxima de
            - strong [ref=f40e284]: 2900W
            - text: . Esta reserva de fuerza bruta le permite escalar pendientes con un ángulo de inclinación de hasta
            - strong [ref=f40e285]: 35º
            - text: sin perder velocidad ni sobrecalentar los componentes internos.
          - listitem [ref=f40e286]:
            - strong [ref=f40e287]: "Autonomía para Toda la Jornada (Hasta 60 km reales):"
            - text: Equipado con un acumulador de iones de litio de alta densidad energética (
            - strong [ref=f40e288]: 52V y 18Ah
            - text: ), ofrece un rango operativo que oscila entre los 40 y los 60 kilómetros con una sola carga. Podrá ir al trabajo, acudir al gimnasio, realizar gestiones y volver a casa sin experimentar la "ansiedad de rango" ni vigilar constantemente el panel de instrumentos.
          - listitem [ref=f40e289]:
            - strong [ref=f40e290]: "Conducción Premium y Protección Antipinchazos:"
            - text: El patinete incorpora neumáticos de
            - strong [ref=f40e291]: 10 pulgadas con tecnología
            - emphasis [ref=f40e292]:
              - strong [ref=f40e293]: Tubeless
            - strong [ref=f40e294]: (sin cámara de aire)
            - text: . Al eliminar la cámara interna, se reduce en un 90% el riesgo de pinchazos por pellizco. Además, su generoso balón de aire actúa como suspensión natural, absorbiendo baches, juntas de dilatación y adoquines.
          - listitem [ref=f40e295]:
            - strong [ref=f40e296]: "Frenada Hidráulica de Precisión:"
            - text: A diferencia de los frenos mecánicos de cable tradicionales, el Odyssey Rodeo Dual monta un
            - strong [ref=f40e297]: sistema de frenos de disco hidráulicos (delantero y trasero)
            - text: . El fluido hidráulico garantiza una frenada sólida, milimétrica y con un esfuerzo mínimo en las manetas, reduciendo drásticamente la distancia de parada en situaciones de emergencia.
          - listitem [ref=f40e298]:
            - strong [ref=f40e299]: "Legalidad Total (100% Homologado por la DGT):"
            - text: Circule con absoluta tranquilidad jurídica. El vehículo cuenta con el certificado oficial de la Dirección General de Tráfico (DGT), cumpliendo estrictamente con la normativa de Vehículos de Movilidad Personal (VMP) en España. Incluye su correspondiente placa y marcaje técnico de fábrica.
        - heading "ESPECIFICACIONES TÉCNICAS" [level=3] [ref=f40e300]
        - paragraph [ref=f40e301]: Especificación Técnica Oficial Marca y Modelo Odyssey Rodeo Dual (Sport Edition) Ingeniería / FabricanteTeverun (Basado en el chasis del modelo Space) Certificación Legal Homologado por la DGT (Normativa VMP España) Configuración del Motor Motor Dual (Tracción integral en ambos ejes) Potencia Nominal 800W Potencia de Pico Máxima 2900W Voltaje y Capacidad 52V / 18Ah (Batería de Iones de Litio de alta eficiencia) Autonomía Máxima Entre 40 y 60 Kilómetros (dependiendo del modo y peso del piloto)Velocidad Máxima 25 km/h (Limitado electrónicamente de fábrica por ley) Ángulo Máximo de Pendiente 35º de inclinación operativa Sistema de Frenos Discos Hidráulicos de alta presión (Eje delantero y trasero) Medida y Tipo de Rueda 10" Pulgadas - Neumáticos Tubeless (Sin cámara) Panel de Instrumentos Pantalla Display LCD Multifunción de alta visibilidad Estructura y Chasis Aleación de aluminio aeroespacial reforzado (Diseño Sport)Peso Neto del Vehículo 29 - 30 kg (Garantiza estabilidad y aplomo a velocidad máxima) Carga Máxima Admitida Hasta 120 kg de peso útil
        - heading "PANEL DE CONTROL E INTERFAZ DE USUARI" [level=3] [ref=f40e302]
        - paragraph [ref=f40e303]:
          - text: La experiencia de usuario se centraliza en el manillar a través de su
          - strong [ref=f40e304]: pantalla multifunción LCD
          - text: ". De un solo vistazo y sin perder la atención en la calzada, el conductor puede monitorizar:"
        - list [ref=f40e305]:
          - listitem [ref=f40e306]:
            - strong [ref=f40e307]: "Velocímetro digital:"
            - text: Velocidad lineal en tiempo real (km/h).
          - listitem [ref=f40e308]:
            - strong [ref=f40e309]: "Indicador de batería:"
            - text: Gráfico segmentado de alta precisión para medir la energía restante en voltios y porcentaje.
          - listitem [ref=f40e310]:
            - strong [ref=f40e311]: "Odómetro:"
            - text: Kilómetros totales recorridos y kilómetros parciales del viaje (
            - emphasis [ref=f40e312]: Trip
            - text: ).
          - listitem [ref=f40e313]:
            - strong [ref=f40e314]: "Gestión de Modos:"
            - text: Selección de mapas de potencia (Modos Eco, Confort o Sport para activar el doble motor en zonas complejas).
        - 'heading "Características del Odyssey Rodeo Dual: El patinete con motor dual de Teverun para dominar la ciudad" [level=3] [ref=f40e315]'
        - paragraph [ref=f40e316]:
          - text: Si buscas el
          - strong [ref=f40e317]: mejor patinete eléctrico de doble motor
          - text: para tus trayectos diarios, el nuevo
          - strong [ref=f40e318]: Odyssey Rodeo Dual
          - text: es la solución definitiva. Diseñado por la prestigiosa marca
          - strong [ref=f40e319]: Teverun
          - text: ", este modelo de corte deportivo destaca en el mercado de la"
          - strong [ref=f40e320]: movilidad urbana
          - text: gracias a su impresionante
          - strong [ref=f40e321]: motor dual de 800W
          - text: (con una potencia pico de 2900W) y una robusta
          - strong [ref=f40e322]: batería de 52V 18Ah
          - text: . Esta combinación técnica te garantiza una
          - strong [ref=f40e323]: autonomía de hasta 60 km
          - text: con una sola carga, permitiéndote olvidarte por completo de los enchufes a diario y superar fácilmente pendientes de hasta 35º de inclinación sin que el rendimiento disminuya.
        - paragraph [ref=f40e324]:
          - text: Además de su potencia bruta, este
          - strong [ref=f40e325]: patinete eléctrico potente
          - text: prioriza tu integridad en el asfalto. Cuenta con un avanzado sistema de
          - strong [ref=f40e326]: frenos de disco hidráulicos
          - text: "y"
          - strong [ref=f40e327]: ruedas tubeless de 10 pulgadas
          - text: que minimizan el riesgo de pinchazos, asegurando una conducción suave y una frenada precisa en cualquier superficie. Lo mejor de todo es que el
          - strong [ref=f40e328]: Odyssey Rodeo Dual está homologado por la DGT
          - text: ", lo que significa que cumple estrictamente con toda la normativa vigente para"
          - strong [ref=f40e329]: Vehículos de Movilidad Personal (VMP) en España
          - text: . Podrás desplazarte con total seguridad y legalidad, disfrutando de un vehículo deportivo premium a un precio imbatible.
