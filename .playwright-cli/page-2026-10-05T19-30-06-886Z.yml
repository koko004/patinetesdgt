            - text: Sistema completo de iluminacion (faro delantero, luz de freno, intermitentes y luces de advertencia) mas un claxon de alta potencia para asegurar que seas visto y escuchado.
        - heading "Tecnologia y Diseño Funcional" [level=3] [ref=f72e240]
        - paragraph [ref=f72e241]:
          - text: El Dualtron Forever no solo es potente, sino inteligente. Cuenta con la
          - strong [ref=f72e242]: pantalla EY4
          - text: ", una interfaz intuitiva que ofrece datos en tiempo real sobre velocidad, bateria y modos de conduccion, ademas de ser compatible con la"
