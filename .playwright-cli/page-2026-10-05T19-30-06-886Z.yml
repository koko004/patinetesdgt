          - strong [ref=f72e231]: suspension de goma delantera y trasera
          - text: con cartuchos reemplazables. Puedes personalizar tu experiencia de conduccion eligiendo entre 5 niveles de dureza (Soft, Medium-Soft, Medium, Medium-Hard y Hard).
        - list [ref=f72e232]:
          - listitem [ref=f72e233]:
