          - listitem [ref=f72e245]:
            - strong [ref=f72e246]: "Ergonomia:"
            - text: Incluye un reposapies/spoiler trasero que mejora la postura y el equilibrio en trayectos largos.
          - listitem [ref=f72e247]:
            - strong [ref=f72e248]: "Mantenimiento Facil:"
