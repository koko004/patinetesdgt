      - generic [ref=f72e208]:
        - 'heading "Dualtron Forever: El Mejor Patinete Eléctrico de Doble Motor en Relación Calidad-Precio" [level=3] [ref=f72e209]'
        - paragraph [ref=f72e210]:
          - text: El
          - strong [ref=f72e211]: Dualtron Forever
          - text: redefine lo que es posible en el segmento de los patinetes electricos de alto rendimiento. Este modelo traslada la legendaria calidad de construccion de Dualtron a un publico mas amplio, ofreciendo una maquina de
          - strong [ref=f72e212]: doble motor
          - text: con una relacion calidad precio sin precedentes. Es la opcion ideal para quienes buscan potencia, fiabilidad y versatilidad sin renunciar al presupuesto.
        - paragraph [ref=f72e213]: Su chasis elegante y compacto no solo es visualmente atractivo, sino que ha sido diseñado especificamente para el entorno urbano. Con un peso optimizado de aproximadamente 27 kg, es facil de maniobrar en el trafico y practico para transportar en el transporte publico o guardar en interiores.
        - 'heading "Rendimiento de Alto Nivel: Agilidad y Velocidad" [level=3] [ref=f72e214]'
        - paragraph [ref=f72e215]:
          - text: Equipado con un sistema de
          - strong [ref=f72e216]: doble motor de 900W nominales cada uno
          - text: ", el Dualtron Forever garantiza una aceleracion suave y una potencia constante."
        - list [ref=f72e217]:
          - listitem [ref=f72e218]:
            - strong [ref=f72e219]: "Velocidad:"
            - text: Limitado de fabrica a 25 km/h para cumplir con las regulaciones urbanas. En terrenos privados y sin restricciones, es capaz de alcanzar los
            - strong [ref=f72e220]: 65 km/h
