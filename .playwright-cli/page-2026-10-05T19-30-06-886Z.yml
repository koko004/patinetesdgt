          - listitem [ref=f72e249]:
            - strong [ref=f72e250]: "Portabilidad:"
            - text: Su sistema de plegado de cuadro y manillar permite reducir su tamaño para guardarlo en espacios reducidos o maleteros.
        - heading "Especificaciones Tecnicas Detalladas" [level=3] [ref=f72e251]
        - paragraph [ref=f72e252]: Caracteristica Especificacion Motor 900W x 2 (Nominal) Bateria 60V (18.2Ah / 24Ah / 30Ah) Velocidad Maxima 25 km/h (Limitado) / 65 km/h (Deslimitado en terreno privado) Autonomia Maxima Hasta 60 km / 80 km / 100 km (Segun bateria) Tiempo de Carga 10h a 18h (Segun bateria) Carga Rapida (5A) 3h 45m a 6h (Segun bateria)Peso Aprox. 24.5 kg a 27 kg Carga Maxima Hasta 120 kg Suspension Goma F&R con cartuchos intercambiables Frenos Discos Hidraulicos NUTT + Asistencia Electrica Ruedas 10 x 2.5 Pulgadas con camara de aire Pantalla EY4 compatible con App iOS/Android Iluminacion Faro, Luz de freno, Intermitentes, Luces de advertencia Dimensiones Desplegado1220 mm x 620 mm x 1250 mm Dimensiones Plegado1220 mm x 620 mm x 525 mm Distancia al Suelo Aprox. 170 mm Proteccion BMS Sobrecalentamiento, Cortocircuito, Sobrecorriente, Sobredescarga y Sobrecarga
        - paragraph [ref=f72e253]:
          - strong [ref=f72e254]: "Dualtron Forever:"
          - text: La alternativa inteligente para quienes buscan la potencia de la gama alta con un equilibrio perfecto entre coste, comodidad y capacidad.
        - heading "Potencia Urbana y Rendimiento Dualtron al Alcance de Todos" [level=2] [ref=f72e255]
        - paragraph [ref=f72e256]:
          - text: Si buscas
          - strong [ref=f72e257]: comprar un patinete eléctrico potente
          - text: que combine fiabilidad y velocidad sin disparar tu presupuesto, el
          - strong [ref=f72e258]: Dualtron Forever
          - text: es la opción definitiva. Este modelo irrumpe en el mercado como el
          - strong [ref=f72e259]: e-scooter de doble motor
          - text: más equilibrado, ofreciendo una potencia nominal de
          - strong [ref=f72e260]: 2 x 900W
          - text: que garantiza una aceleración ágil y la capacidad de superar pendientes pronunciadas en la ciudad. Gracias a su robusta construcción y su diseño compacto de 27 kg, se posiciona como el vehículo de
          - strong [ref=f72e261]: movilidad urbana
          - text: preferido para quienes necesitan un transporte diario rápido, capaz de alcanzar los 65 km/h en entornos privados.
        - paragraph [ref=f72e262]:
          - text: La versatilidad es el punto fuerte de este
          - strong [ref=f72e263]: patinete Dualtron
          - text: ", ya que permite elegir entre diferentes configuraciones de batería (18.2Ah, 24Ah o 30Ah) para alcanzar una"
          - strong [ref=f72e264]: autonomía de hasta 100 km
          - text: con una sola carga. Equipado con
          - strong [ref=f72e265]: frenos hidráulicos NUTT
          - text: y un avanzado sistema de
