                  - listitem [ref=f146e848]:
                    - text: Actuaciones que inspiran confianza. El
                    - strong [ref=f146e849]: Rovoron R7 Pro
                    - text: está diseñado para la velocidad, pero sobre todo, para una conducción suave. En la vía pública, está limitado a 25 km/h para cumplir con la normativa. En terrenos privados, despliega todo su potencial y puede alcanzar velocidades de hasta 70 km/h. Su estabilidad se mantiene ejemplar, incluso a altas velocidades.
                - paragraph [ref=f146e850]:
                  - strong [ref=f146e851]: Comportamiento y velocidad
                - list [ref=f146e852]:
                  - listitem [ref=f146e853]: Velocidad limitada a 25 km/h para uso legal
                  - listitem [ref=f146e854]: Hasta 70 km/h en terrenos privados
                  - listitem [ref=f146e855]: Excelente estabilidad direccional a alta velocidad.
                  - listitem [ref=f146e856]: Duración de la batería del Rovoron R7 Pro
                  - listitem [ref=f146e857]: Con el Rovoron R7 Pro, supera los límites de tus viajes. Su batería de alta capacidad te permite recorrer kilómetros sin preocupaciones. Ideal para largos desplazamientos diarios y salidas prolongadas, se adapta a tu ritmo, no al revés.
                - paragraph [ref=f146e858]:
                  - strong [ref=f146e859]: Batería y duración de la batería
                - list [ref=f146e860]:
                  - listitem [ref=f146e861]:
                    - strong [ref=f146e862]: Versión disponible en 60 V – 42,4 Ah
                  - listitem [ref=f146e863]: Alcance máximo de hasta 125 km
                  - listitem [ref=f146e864]: Comodidad que transforma cada viaje
                - paragraph [ref=f146e865]: El camino nunca es perfecto. Sin embargo, la Rovoron R7 Pro está preparada para todo. La suspensión delantera y trasera absorbe eficazmente los baches. Las llantas sin cámara de 11 pulgadas ofrecen un excelente agarre y filtran las vibraciones. Disfrutarás de más tiempo con una auténtica sensación de tranquilidad.
                - paragraph [ref=f146e866]:
                  - strong [ref=f146e867]: Comodidad y estabilidad
                - list [ref=f146e868]:
                  - listitem [ref=f146e869]: Suspensión de resorte delantera y trasera
                  - listitem [ref=f146e870]: Neumáticos sin cámara de 11 pulgadas
                  - listitem [ref=f146e871]: Plataforma ancha para una postura estable.
                  - listitem [ref=f146e872]: Conducción suave en carreteras irregulares
                - paragraph [ref=f146e873]:
                  - strong [ref=f146e874]: Frenado preciso para un control total
                - paragraph [ref=f146e875]: A medida que aumenta la velocidad, el control se vuelve esencial. El Rovoron R7 Pro está equipado con un sistema de frenado de alto rendimiento capaz de responder al instante. Cada maniobra de frenado es progresiva, potente y perfectamente modulada.
                - paragraph [ref=f146e876]:
                  - strong [ref=f146e877]: Seguridad activa
                - list [ref=f146e878]:
                  - listitem [ref=f146e879]: Frenos de disco delanteros y traseros
                  - listitem [ref=f146e880]: Sistemas EBS y ABS integrados
                  - listitem [ref=f146e881]: Mayor estabilidad durante el frenado de emergencia
                  - listitem [ref=f146e882]: Iluminación completa para una visibilidad óptima.
                  - listitem [ref=f146e883]: Un diseño inteligente, concebido para la vida cotidiana.
                - paragraph [ref=f146e884]: presume de un diseño moderno y robusto. Su cuadro reforzado inspira confianza a primera vista. Su manillar plegable ofrece una gran ventaja en el uso diario, facilitando su transporte y almacenamiento. El sistema de plegado es sencillo, rápido y seguro.
                - paragraph [ref=f146e885]:
                  - strong [ref=f146e886]: Diseño y practicidad
                - list [ref=f146e887]:
                  - listitem [ref=f146e888]: Chasis robusto diseñado para uso intensivo
                  - listitem [ref=f146e889]: Manillar plegable para fácil transporte.
                  - listitem [ref=f146e890]: Sistema de plegado fiable y seguro
                  - listitem [ref=f146e891]: Excelente distribución del peso
                  - listitem [ref=f146e892]: Una interfaz moderna e intuitiva
                - paragraph [ref=f146e893]: Toda la información esencial es accesible al instante. La pantalla del EY3 muestra claramente la velocidad, el nivel de batería y los modos de conducción. La conectividad te permite personalizar tu experiencia según tus preferencias.
                - paragraph [ref=f146e894]:
                  - strong [ref=f146e895]: Equipo
                - list [ref=f146e896]:
                  - listitem [ref=f146e897]: Pantalla conectada EY3
                  - listitem [ref=f146e898]: Pantalla clara y legible
                  - listitem [ref=f146e899]: Controles ergonómicos
                  - listitem [ref=f146e900]: Intermitentes integrados, luces delanteras y traseras y bocina.
                - paragraph [ref=f146e901]:
                  - text: El
                  - strong [ref=f146e902]: Rovoron R7 Pro
                  - text: es un patinete eléctrico diseñado para quienes buscan superar los límites de sus viajes. Combina potencia, autonomía, comodidad y practicidad gracias a su manillar plegable. Un modelo de alta gama, fiable y de alto rendimiento, listo para acompañarte a diario.
