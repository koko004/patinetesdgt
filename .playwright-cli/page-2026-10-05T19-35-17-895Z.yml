                - heading "Segway Ninebot F3 E, confort y tecnología en los desplazamientos" [level=2] [ref=f75e625]
                - paragraph [ref=f75e626]:
                  - strong [ref=f75e627]: Suspensión delantera y trasera para un confort doble
                - paragraph [ref=f75e628]:
                  - text: La suspensión delantera hidráulica y la suspensión trasera de elastómero de la
                  - strong [ref=f75e629]: Segway
                  - link [ref=f75e630] [cursor=pointer]:
                    - /url: https://www.imoveblue.es/patinetes-electricos-certificados-dgt/1482-ninebot-f3-e.html
                    - strong [ref=f75e631]: Ninebot F3 E
                  - text: garantizan trayectos sin baches, incluso en carreteras de piedra o ladrillo, lo que la hace ideal para desplazamientos urbanos.
                - paragraph [ref=f75e632]:
                  - strong [ref=f75e633]: Suspensión delantera y trasera para un confort doble
                - paragraph [ref=f75e634]:
                  - text: La suspensión delantera hidráulica y la suspensión trasera de elastómero de la
                  - strong [ref=f75e635]: Ninebot F3 E
                  - text: garantizan trayectos sin baches, incluso en carreteras de piedra o ladrillo, lo que la hace ideal para desplazamientos urbanos.
                - paragraph [ref=f75e636]:
                  - strong [ref=f75e637]: Neumáticos autorreparables sin cámara de 10''
                - paragraph [ref=f75e638]: El Ninebot F3 E viene equipado con neumáticos autorreparables sin cámara de 10'', inflados para una mayor estabilidad y comodidad. Los neumáticos pueden sellar instantáneamente los pinchazos, proporcionando un rendimiento fácil y de bajo mantenimiento para una conducción sin problemas.
                - paragraph [ref=f75e639]:
                  - strong [ref=f75e640]: Amplio reposapiés, conducción cómoda
                - paragraph [ref=f75e641]: Con un amplio espacio para los pies, el reposapiés de 180*510 mm de la F3 E garantiza una postura estable y segura en cada trayecto a casa o al trabajo. Además, la técnica a presión de aleación de magnesio integrada mejora la estabilidad general.
                - paragraph [ref=f75e642]:
                  - strong [ref=f75e643]: Facilidad y control ergonómicos
                - paragraph [ref=f75e644]: El manillar curvado, diseñado con un ángulo ergonómico, proporciona un agarre cómodo. Las empuñaduras antibacterianas con absorción de impactos añaden amortiguación adicional, garantizando un confort duradero incluso en viajes largos.
                - paragraph [ref=f75e645]: Mantenga el control con un botón multifunción flexible, que le permite manejar el patinete sin quitar las manos del manillar.
                - paragraph [ref=f75e646]:
                  - strong [ref=f75e647]: Potencia en las cuestas de la ciudad
                - paragraph [ref=f75e648]: El motor sin escobillas de alto par de 1000 W le permite circular suavemente por las diferentes calles de la ciudad, mientras supera fácilmente las pendientes.
                - list [ref=f75e649]:
                  - listitem [ref=f75e650]: 1000 W Potencia máxima
                  - listitem [ref=f75e651]: 20 % Max. Pendiente de subida [1]
                - paragraph [ref=f75e652]:
                  - strong [ref=f75e653]: Mayor autonomía
                - paragraph [ref=f75e654]: Nuestra característica tecnología SegRange™ de desarrollo propio amplía la autonomía, permitiendo recorridos más largos. Con una batería integrada de 477 Wh de capacidad combinada con SegRange™, la Ninebot F3 E ofrece una autonomía de hasta 70 km.
                - list [ref=f75e655]:
                  - listitem [ref=f75e656]: Modo Eco Autonomía [2] 70 km at 15 km/h
                  - listitem [ref=f75e657]: Autonomía en modo Sport [3] 50 km at 25 km/h
                  - listitem [ref=f75e658]: Autonomía total con batería opcional
                  - listitem [ref=f75e659]: Autonomía en modo Eco [4] 131 km a 15 km/h
                  - listitem [ref=f75e660]: Autonomía en modo Sport [5] 93 km a 25 km/h
                - paragraph [ref=f75e661]: La batería externa de 460 Wh puede proporcionar una autonomía adicional de hasta 61 km a 15 km/h. Se puede cargar de forma independiente, adaptándose a varios escenarios de carga para una mayor comodidad y viajes prolongados.
                - paragraph [ref=f75e662]: "*La batería opcional adicional se vende por separado y está disponible para su compra a partir del tercer trimestre de 2025."
                - paragraph [ref=f75e663]:
                  - strong [ref=f75e664]: Conduce de forma más inteligente
                - paragraph [ref=f75e665]: Pantalla TFT inteligente de 2,4 pulgadas
                - paragraph [ref=f75e666]: Navegación[6] A la espera de una futura actualización, la guía de navegación integrada en la pantalla del Ninebot F3 E facilita y agiliza la planificación de rutas (véase la cláusula de exención de responsabilidad 6).
                - paragraph [ref=f75e667]:
                  - strong [ref=f75e668]: Notificación de llamada entrante
                - paragraph [ref=f75e669]: La pantalla te avisa de las llamadas entrantes, para que nunca pierdas una llamada importante mientras mantienes la concentración en la carretera.
                - paragraph [ref=f75e670]:
                  - strong [ref=f75e671]: Información en tiempo real
                - paragraph [ref=f75e672]: Mantente en contacto con el estado de conducción de tu eKickScooter, incluyendo velocidad, duración de la batería, modos, distancia recorrida y mucho más.
                - paragraph [ref=f75e673]:
                  - strong [ref=f75e674]: Tecnología de Desbloqueo Bluetooth
                - paragraph [ref=f75e675]: El sistema Segway Airlock desbloquea tu eKickScooter en función de tu proximidad. El Ninebot F3 E y está listo para conducir cuando te acercas.
                - paragraph [ref=f75e676]: Activa y personaliza la distancia de desbloqueo en la app Segway Mobility.
                - paragraph [ref=f75e677]:
                  - strong [ref=f75e678]: Rastrea tu patinete con Apple Find My [7]
                - paragraph [ref=f75e679]: Simplemente activa Apple Find My a través de la aplicación Segway Mobility y emparéjala con tu eKickScooter. A continuación, detecta fácilmente tu patinete utilizando la App «»Buscar"» en sus dispositivos Apple siempre que sea necesario.
                - paragraph [ref=f75e680]:
                  - strong [ref=f75e681]: BMS 2.0 (Sistema de Gestión de Baterías)
                - list [ref=f75e682]:
                  - listitem [ref=f75e683]:
                    - strong [ref=f75e684]: Control del tiempo de carga
                  - listitem [ref=f75e685]: Control del estado de la batería
                  - listitem [ref=f75e686]: Protección contra temperatura
                  - listitem [ref=f75e687]: Protección contra sobrecarga
                  - listitem [ref=f75e688]: Protección contra cortocircuitos
                  - listitem [ref=f75e689]: Protección contra sobretensión
                  - listitem [ref=f75e690]: Programa de carga inteligente
                  - listitem [ref=f75e691]: Protección contra sobredescarga
                  - listitem [ref=f75e692]: Límite de carga personalizable
                  - listitem [ref=f75e693]: Batería resistente al agua IPX7
                  - listitem [ref=f75e694]: Protección contra baja tensión
                  - listitem [ref=f75e695]: Protección contra sobretensión
                - paragraph [ref=f75e696]:
                  - strong [ref=f75e697]: Conduce con confianza
                - paragraph [ref=f75e698]: Freno de disco delantero, freno electrónico trasero
                - paragraph [ref=f75e699]:
                  - text: Equipado con un freno de disco delantero y un freno trasero electrónico, el
                  - strong [ref=f75e700]: Ninebot F3 E
                  - text: garantiza una frenada más rápida y estable para el piloto.
                - paragraph [ref=f75e701]:
                  - strong [ref=f75e702]: Sistema de mejora de la estabilidad
                - paragraph [ref=f75e703]: Experimenta un control superior de la conducción con el SegRide™ Sistema de mejora de la estabilidad, incluso a altas velocidades, en curvas cerradas y en carreteras resbaladizas. SegRide™ ofrece el equilibrio perfecto entre agilidad y estabilidad.
                - paragraph [ref=f75e704]:
                  - strong [ref=f75e705]: Resistencia a las perturbaciones
                - paragraph [ref=f75e706]: Equipada con una gran distancia de arrastre de 80 mm combinada con un ángulo de la potencia y una amortiguación de la dirección de precisión, mejora la resistencia a las perturbaciones, manteniendo la conducción estable en condiciones impredecibles.
                - paragraph [ref=f75e707]:
                  - strong [ref=f75e708]: Controlabilidad
                - paragraph [ref=f75e709]: El manillar curvado proporciona un agarre cómodo. Nuestro diseño equilibra la distancia de arrastre y la amortiguación de la dirección haciendo que el eKickScooter sea fácil de controlar y suave de conducir.
                - paragraph [ref=f75e710]:
                  - strong [ref=f75e711]: Resistencia al derrape
                - paragraph [ref=f75e712]: El sistema de control de tracción TCS (Traction Control System) desarrollado por Segway utiliza tecnología inteligente para proporcionar al F3 un gran agarre y control, incluso a altas velocidades y en superficies resbaladizas. Esta característica detiene el derrape y el deslizamiento.
                - paragraph [ref=f75e713]: "*TCS está desactivado por defecto. Puedes activarlo a través de la Segway Mobility App»."
                - paragraph [ref=f75e714]:
                  - strong [ref=f75e715]: Sistema de iluminación brillante
                - paragraph [ref=f75e716]: Faro automático de 6W
                - paragraph [ref=f75e717]: Se enciende y apaga automáticamente con las diferentes condiciones de iluminación
                - paragraph [ref=f75e718]: Comparado con el Ninebot F2 E Brillo 3X
                - paragraph [ref=f75e719]: Comparado con el Ninebot F2 E Distancia de iluminación 2X
                - paragraph [ref=f75e720]: Luz de conducción diurna
                - paragraph [ref=f75e721]: Faro automático
                - paragraph [ref=f75e722]: "*Fuente de datos del laboratorio Segway-Ninebot, comparando la luz de Ninebot F3 y F2."
                - paragraph [ref=f75e723]: Intermitentes incorporados
