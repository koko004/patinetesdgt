                - paragraph [ref=f75e727]:
                  - text: El
                  - strong [ref=f75e728]: Ninebot F3 E
                  - text: cuenta ahora con una clasificación de resistencia al agua IPX6 mejorada. Ofrece una sólida protección contra potentes chorros de agua, garantizando un rendimiento fiable incluso en condiciones de humedad. La batería es IPX7.
                - paragraph [ref=f75e729]:
                  - strong [ref=f75e730]: Mayor comodidad de bloqueo
                - paragraph [ref=f75e731]:
