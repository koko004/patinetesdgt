                - generic [ref=f75e552]:
                  - paragraph [ref=f75e553]:
                    - text: En imoveblue.es, tu tranquilidad es lo primero y es lo que nos diferencia del resto de tiendas. Por eso, te ofrecemos un Servicio de Garantía Completo y Servicio postventa Premium para que solo te preocupes de disfrutar de tu vehículo.
                    - strong [ref=f75e554]: Nos diferenciamos por aportar siempre soluciones
                    - text: a cualquier problema que tenga tu vehículo en cualquier punto del país.
                  - heading "Garantía Oficial y Cobertura" [level=2] [ref=f75e555]
                  - list [ref=f75e556]:
                    - listitem [ref=f75e557]:
                      - paragraph [ref=f75e558]: "Garantía Oficial de 3 Años: Todos nuestros vehículos y productos cuentan con la Garantía Oficial del fabricante de 3 años desde la fecha de compra."
                    - listitem [ref=f75e559]:
                      - paragraph [ref=f75e560]: "Excepciones: La garantía cubre fallos de fabricación y componentes principales. Quedan excluidas las piezas consideradas de desgaste (como neumáticos, pastillas de freno, etc...) Las baterías y determinados componentes eléctricos de vehículos tendrán una garantía de 6 meses, 1, 2 o 3 años o límite de km en función de las normas de fabricante-marca."
                  - heading "Servicio Premium de Recogida y Reparación Gratuita" [level=2] [ref=f75e561]
                  - list [ref=f75e562]:
                    - listitem [ref=f75e563]:
                      - paragraph [ref=f75e564]: "Máxima Comodidad: Si tu vehículo presenta un fallo cubierto por la garantía, nosotros nos encargamos de todo."
                    - listitem [ref=f75e565]:
                      - paragraph [ref=f75e566]: "Recogida Gratuita: Recogemos tu producto a domicilio sin coste alguno para ti."
                    - listitem [ref=f75e567]:
                      - paragraph [ref=f75e568]: "Reparación Profesional: Será reparado por Técnicos Oficiales en el taller oficial correspondiente para asegurar la máxima calidad."
                    - listitem [ref=f75e569]:
                      - paragraph [ref=f75e570]: "Devolución sin Coste: Una vez reparado, te lo devolvemos en tu domicilio completamente gratis."
                  - heading "Opciones de Solución de Problemas (Según el Caso)" [level=2] [ref=f75e571]
                  - paragraph [ref=f75e572]: "Una vez que contactes con nosotros, evaluaremos tu caso para ofrecerte la solución más rápida y eficiente:"
                  - list [ref=f75e573]:
                    - listitem [ref=f75e574]:
                      - paragraph [ref=f75e575]: Recogida y Reparación Gratuita en Taller Oficial (la opción estándar y más cómoda para ti).
                    - listitem [ref=f75e576]:
                      - paragraph [ref=f75e577]: Envío de Pieza Defectuosa y reparación por parte del cliente (ideal para fallos menores y clientes con conocimientos técnicos).
                    - listitem [ref=f75e578]:
                      - paragraph [ref=f75e579]: Reparación en Taller Colaborador (si disponemos de un taller asociado cerca de tu ubicación, facilitando una solución local y rápida).
                  - heading "Mantenimiento y Red de Talleres" [level=2] [ref=f75e580]
                  - list [ref=f75e581]:
                    - listitem [ref=f75e582]:
                      - paragraph [ref=f75e583]: "Red de Talleres Colaboradores: Además del servicio de garantía, contamos con una red de talleres colaboradores en crecimiento a nivel nacional."
                    - listitem [ref=f75e584]:
                      - paragraph [ref=f75e585]: "Mantenimiento al Día: Puedes utilizar esta red para realizar las revisiones, puestas a punto y el mantenimiento periódico de tu vehículo de forma cómoda y con profesionales de confianza."
                  - heading "¿Tienes un Problema? ¡Contáctanos!" [level=2] [ref=f75e586]
                  - paragraph [ref=f75e587]:
                    - text: Si tienes cualquier incidencia con tu producto o necesitas gestionar la garantía,
                    - strong [ref=f75e588]:
