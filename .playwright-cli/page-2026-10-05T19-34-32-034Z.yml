              - generic [ref=f129e824]:
                - heading "Rovoron S7 DGT – El patinete eléctrico diseñado para llegar aún más lejos" [level=2] [ref=f129e825]
                - paragraph [ref=f129e826]:
                  - text: El
                  - strong [ref=f129e827]: Rovoron S7
                  - text: es para quienes no hacen concesiones. Desde el momento en que te subes, sabes que este patinete es diferente. Inspira confianza, potencia y control. Cada paseo se vuelve más intenso, suave y emocionante. Ya sea para tus desplazamientos diarios o para viajes largos, el Rovoron S7 transforma tu forma de conducir.
                - paragraph [ref=f129e828]:
                  - strong [ref=f129e829]: Potencia inmediata que cambia la conducción
                - paragraph [ref=f129e830]: Desde la primera aceleración, el Rovoron S7 ofrece una potencia potente y continua. Los dos motores de alto rendimiento trabajan juntos para proporcionar una aceleración potente y controlada. Incluso en pendientes pronunciadas, el scooter mantiene toda su energía. Avanzarás sin esfuerzo, con una sensación de control total.
                - paragraph [ref=f129e831]:
                  - strong [ref=f129e832]: Motor Rovoron S7
                - list [ref=f129e833]:
                  - listitem [ref=f129e834]: Dos motores de alto rendimiento de 2 × 2500 W
                  - listitem [ref=f129e835]: Impresionante potencia total
                  - listitem [ref=f129e836]: Alto par para arranques rápidos y aceleración sin pérdida de velocidad.
                  - listitem [ref=f129e837]: Respuesta inmediata a la aceleración
                  - listitem [ref=f129e838]: Actuaciones que superan los límites
                - paragraph [ref=f129e839]:
                  - text: El
                  - link [ref=f129e840] [cursor=pointer]:
                    - /url: https://www.imoveblue.es/patinetes-electricos-certificados-dgt/1729-rovoron-s7.html
                    - strong [ref=f129e841]: Rovoron S7
                  - text: está diseñado para los amantes de las emociones fuertes. En zonas públicas, puede restringirse según la normativa. En terrenos privados, despliega todo su potencial y alcanza velocidades extremas. A pesar de su alto rendimiento, se mantiene estable y ofrece confianza.
                - paragraph [ref=f129e842]:
                  - strong [ref=f129e843]: Velocidad y comportamiento
                - list [ref=f129e844]:
                  - listitem [ref=f129e845]: Velocidad limitada a 25 km/h para uso legal (deslimitado en zona privada o circuito 100)
                  - listitem [ref=f129e846]: Excelente estabilidad a alta velocidad.
                  - listitem [ref=f129e847]: Chasis diseñado para el rendimiento
                  - listitem [ref=f129e848]: Alcance excepcional para largas distancias
                - paragraph [ref=f129e849]: Con la Rovoron S7, ya no tendrás que preocuparte por recargarla. Su batería de alta capacidad te permite recorrer kilómetros sin preocupaciones. Es ideal para viajes largos o trayectos largos. Llega lejos y vuelve a casa sin preocupaciones.
                - paragraph [ref=f129e850]:
                  - strong [ref=f129e851]: Batería y duración de la batería
                - list [ref=f129e852]:
                  - listitem [ref=f129e853]: Batería de litio 84 V – 37,1 Ah
                  - listitem [ref=f129e854]: Células de alta gama para una mayor longevidad
                  - listitem [ref=f129e855]: Autonomía de hasta 140 km según el modo de conducción
                  - listitem [ref=f129e856]: Gestión energética optimizada
                  - listitem [ref=f129e857]: Comodidad superior, incluso en viajes largos
                - paragraph [ref=f129e858]: La potencia no es suficiente sin comodidad. La Rovoron S7 está equipada con una suspensión ajustable de alta gama que absorbe eficazmente las imperfecciones de la carretera. Los neumáticos anchos de 11 pulgadas mejoran el agarre y reducen las vibraciones. Disfrutarás de más tiempo con menos fatiga.
                - paragraph [ref=f129e859]:
                  - strong [ref=f129e860]: Comodidad y estabilidad
                - list [ref=f129e861]:
                  - listitem [ref=f129e862]: Suspensión delantera y trasera de cartucho ajustable
                  - listitem [ref=f129e863]: Neumáticos sin cámara de 11 pulgadas
                  - listitem [ref=f129e864]: Plataforma grande y estable
                  - listitem [ref=f129e865]: Conducción suave en carreteras en mal estado
                  - listitem [ref=f129e866]: Frenado potente para una seguridad total
                - paragraph [ref=f129e867]: Con un rendimiento tan alto, el frenado debe ser impecable. El Rovoron S7 está equipado con potentes frenos hidráulicos de cuatro pistones. Cada frenado es progresivo, preciso y seguro. Mantienes el control en cualquier circunstancia.
                - paragraph [ref=f129e868]:
                  - strong [ref=f129e869]: Frenado y seguridad
                - list [ref=f129e870]:
                  - listitem [ref=f129e871]: Frenos de disco hidráulicos de 4 pistones delanteros y traseros
                  - listitem [ref=f129e872]: Alto poder de frenado
                  - listitem [ref=f129e873]: Capacidad de respuesta óptima a alta velocidad
                  - listitem [ref=f129e874]: Mayor seguridad durante el frenado de emergencia
                  - listitem [ref=f129e875]: Un diseño masivo y equipamiento de alta gama.
                - paragraph [ref=f129e876]:
                  - text: El
                  - strong [ref=f129e877]: Rovoron S7
                  - text: destaca por su diseño. Su chasis reforzado irradia robustez y durabilidad. La pantalla EY4 conectada muestra toda la información esencial en tiempo real. Cada detalle está diseñado para un uso intensivo y exigente.
                - list [ref=f129e878]:
                  - listitem [ref=f129e879]: Diseño y equipamiento
                  - listitem [ref=f129e880]: Chasis reforzado para máxima durabilidad.
                  - listitem [ref=f129e881]: Pantalla LCD EY4 con conectividad Bluetooth
                  - listitem [ref=f129e882]: Controles ergonómicos
                  - listitem [ref=f129e883]: Posición de conducción cómoda y natural
                - paragraph [ref=f129e884]:
                  - strong [ref=f129e885]: ¿Por qué elegir el Rovoron S7?
                - paragraph [ref=f129e886]: Porque llega más lejos que la mayoría de los patinetes eléctricos. Porque ofrece potencia extrema sin sacrificar la comodidad. Porque está diseñado para los usuarios más exigentes. El Rovoron S7 es un referente para quienes buscan lo mejor.
                - paragraph [ref=f129e887]: "Puntos fuertes:"
                - list [ref=f129e888]:
                  - listitem [ref=f129e889]: Dos motores ultra potentes
                  - listitem [ref=f129e890]: Batería de alta capacidad de 84 V
                  - listitem [ref=f129e891]: Alcance de hasta 140 km
                  - listitem [ref=f129e892]: Suspensión ajustable premium
                  - listitem [ref=f129e893]: Frenos hidráulicos de 4 pistones
                  - listitem [ref=f129e894]: Neumáticos sin cámara de 11 pulgadas
                  - listitem [ref=f129e895]: Equipamiento completo y de alta gama
                - paragraph [ref=f129e896]:
