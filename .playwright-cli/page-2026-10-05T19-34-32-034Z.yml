                  - list [ref=f129e762]:
                    - listitem [ref=f129e763]:
                      - paragraph [ref=f129e764]: "Máxima Comodidad: Si tu vehículo presenta un fallo cubierto por la garantía, nosotros nos encargamos de todo."
                    - listitem [ref=f129e765]:
