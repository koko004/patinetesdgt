    - generic [ref=f34e252]:
      - heading "Odyssr Drift Dual" [level=2] [ref=f34e254]
      - generic [ref=f34e256]:
        - paragraph [ref=f34e257]:
          - text: El
          - strong [ref=f34e258]: Odyssr Drift Dual
          - text: representa una evolución estratégica dentro de la movilidad urbana de alto rendimiento. Desarrollado en colaboración bajo las líneas de fabricación de la prestigiosa marca
          - strong [ref=f34e259]: Teverun
          - text: ", este modelo hereda directamente la arquitectura electromecánica, la robustez del chasis y los componentes premium del reconocido"
          - emphasis [ref=f34e260]: Blade Mini Ultra
          - text: .
        - paragraph [ref=f34e261]:
          - text: Su gran valor competitivo radica en ofrecer
          - strong [ref=f34e262]: las mismas especificaciones de gama alta pero a un precio significativamente más económico
          - text: ", adoptando un diseño más estilizado, urbano y compacto. Es el vehículo ideal para usuarios que buscan un patinete de tamaño medio, sumamente versátil y con una potencia superlativa para \"devorar\" kilómetros en el día a día sin sufrir por la autonomía."
        - heading "DESGLOSE DETALLADO POR COMPONENTES" [level=3] [ref=f34e263]
        - heading "Sistema de Energía y Batería (\"Batería Infinita\")" [level=3] [ref=f34e264]
        - list [ref=f34e265]:
          - listitem [ref=f34e266]:
            - strong [ref=f34e267]: "Tecnología de las Celdas:"
            - text: Batería de iones de litio de alta densidad y estabilidad térmica.
          - listitem [ref=f34e268]:
            - strong [ref=f34e269]: "Voltaje Nominal:"
            - strong [ref=f34e270]: 60V
            - text: . Un voltaje elevado que garantiza una entrega de potencia inmediata, mejor aceleración y una gestión eficiente de la energía en condiciones de alta exigencia (subidas o carga máxima).
          - listitem [ref=f34e271]:
            - strong [ref=f34e272]: "Capacidad Nominal:"
            - strong [ref=f34e273]: 27Ah
            - text: (Amperios-hora). Una capacidad masiva para un patinete de tamaño medio, lo que le confiere el adjetivo de "batería infinita".
          - listitem [ref=f34e274]:
            - strong [ref=f34e275]: "Autonomía Real/Estimada:"
            - strong [ref=f34e276]: Entre 80 y 100 kilómetros
            - text: con una sola carga.
            - emphasis [ref=f34e277]: "(Nota: La autonomía final varía según el peso del conductor, la velocidad media, el modo de conducción y el desnivel del terreno)."
        - heading "Tren Motriz y Rendimiento Dinámico" [level=3] [ref=f34e278]
        - list [ref=f34e279]:
          - listitem [ref=f34e280]:
            - strong [ref=f34e281]: "Configuración del Motor:"
            - strong [ref=f34e282]: Dual Motor
            - text: (Un motor magnético sin escobillas —Brushless— situado en la rueda delantera y otro en la trasera).
          - listitem [ref=f34e283]:
            - strong [ref=f34e284]: "Potencia:"
            - strong [ref=f34e285]: 1000W en cada motor
            - text: (Potencia nominal conjunta de
            - strong [ref=f34e286]: 2000W
            - text: ).
          - listitem [ref=f34e287]:
            - strong [ref=f34e288]: "Tracción:"
            - text: Integral (2WD). Al traccionar ambas ruedas, se elimina el derrape en salidas, mejora drásticamente el agarre en curvas y proporciona una estabilidad sobresaliente sobre asfalto mojado.
          - listitem [ref=f34e289]:
            - strong [ref=f34e290]: "Velocidad Máxima Legal:"
            - text: Limitado estrictamente de fábrica a
            - strong [ref=f34e291]: 25 km/h
            - text: para cumplir con la legislación española de VMP.
          - listitem [ref=f34e292]:
            - strong [ref=f34e293]: "Capacidad de Escalada:"
            - text: Capaz de afrontar pendientes con un
            - strong [ref=f34e294]: ángulo de inclinación de hasta 30º
            - text: sin caídas drásticas de velocidad, gracias al alto par motor de su sistema de 60V.
        - heading "Chasis, Dimensiones y Seguridad Ciclo" [level=3] [ref=f34e295]
        - list [ref=f34e296]:
          - listitem [ref=f34e297]:
            - strong [ref=f34e298]: "Sistema de Frenado:"
            - strong [ref=f34e299]: Freno de disco asistido por circuito hidráulico
            - text: tanto en el eje delantero como en el trasero. El accionamiento hidráulico reduce la fatiga en las manetas y multiplica la presión sobre los discos, logrando una distancia de frenado extremadamente corta y segura.
          - listitem [ref=f34e300]:
            - strong [ref=f34e301]: "Neumáticos:"
            - text: Ruedas de
            - strong [ref=f34e302]: 10 pulgadas
            - text: . Su diámetro medio-alto proporciona un excelente confort de marcha, absorbiendo baches urbanos, juntas de dilatación y desniveles de forma mucho más eficaz que las ruedas estándar de 8.5".
          - listitem [ref=f34e303]:
            - strong [ref=f34e304]: "Dimensiones del Patinete:"
            - strong [ref=f34e305]: 1233 mm de largo $\times$ 650 mm de ancho $\times$ 1271 mm de alto
            - text: ". Geometría optimizada de tamaño medio-compacto: mantiene la agilidad entre el tráfico urbano pero ofrece una base (deck) amplia para la posición de los pies."
          - listitem [ref=f34e306]:
            - strong [ref=f34e307]: "Peso del Vehículo:"
            - strong [ref=f34e308]: 30 kg
            - text: . Un peso equilibrado considerando la enorme batería y el doble motor que incorpora.
          - listitem [ref=f34e309]:
            - strong [ref=f34e310]: "Capacidad de Carga Útil:"
            - text: Soporta un
            - strong [ref=f34e311]: peso máximo de hasta 120 kg
            - text: sin comprometer la amortiguación ni el rendimiento estructural.
        - heading "Electrónica, Interfaz y Seguridad Anti-robo" [level=3] [ref=f34e312]
        - list [ref=f34e313]:
          - listitem [ref=f34e314]:
            - strong [ref=f34e315]: "Pantalla (Display):"
            - text: Panel
            - strong [ref=f34e316]: LCD Multifunción
            - text: central. Permite visualizar en tiempo real parámetros críticos como la velocidad actual, el odómetro (kilómetros totales y parciales), el modo de potencia seleccionado y el voltaje exacto de la batería.
          - listitem [ref=f34e317]:
            - strong [ref=f34e318]: "Sistema de Encendido NFC:"
            - text: Sistema de seguridad
            - emphasis [ref=f34e319]: contactless
            - text: . El patinete cuenta con un lector de tarjetas/llaveros NFC. Si no se aproxima la llave digital autorizada, el sistema eléctrico permanece completamente bloqueado, actuando como un inmovilizador electrónico eficaz contra robos.
          - listitem [ref=f34e320]:
            - strong [ref=f34e321]: "Control Remoto de Seguridad:"
            - text: Incluye un mando a distancia dotado de un limitador/deslimitador de velocidad a distancia. Este elemento es de uso exclusivo para entornos cerrados, circuitos privados o regulaciones específicas de países que permitan velocidades superiores a los 25 km/h.
        - heading "¿Por qué elegirlo?" [level=2] [ref=f34e322]
        - list [ref=f34e323]:
          - listitem [ref=f34e324]:
            - strong [ref=f34e325]: "Certificación DGT Oficial:"
            - text: Cuenta con el número de certificado
            - strong [ref=f34e326]: B1145
            - text: otorgado por la Dirección General de Tráfico. Esto garantiza que el vehículo cumple con todos los requisitos de iluminación, frenado, catadióptricos y limitaciones técnicas exigidos por la ley, evitando multas y permitiendo su libre circulación.
          - listitem [ref=f34e327]:
            - strong [ref=f34e328]: "La alternativa inteligente al Blade Mini Ultra:"
            - text: Al ser fabricado por Teverun con los mismos componentes internos pero bajo un diseño de marca más urbano, el usuario adquiere un patinete de gama súper alta pagando un precio notablemente inferior.
          - listitem [ref=f34e329]:
            - strong [ref=f34e330]: "Adiós a la \"ansiedad por la batería\":"
            - text: Sus 100 km potenciales de autonomía permiten realizar trayectos diarios de larga distancia de ida y vuelta durante toda la semana laboral sin necesidad de cargar el dispositivo cada noche.
          - listitem [ref=f34e331]:
            - strong [ref=f34e332]: "Seguridad Pasiva Superior:"
            - text: El combo de doble freno hidráulico + tracción integral en las dos ruedas + neumáticos de 10" minimiza drásticamente el riesgo de caídas provocadas por frenazos de emergencia o pérdida de tracción en firmes deslizantes.
