                  - strong [ref=f3e852]:
                    - generic [ref=f3e853]: Inmotion Climber, escalador nato
                - paragraph [ref=f3e854]:
                  - generic [ref=f3e855]: Estableciendo un nuevo estándar, cada motor cuenta con una potencia máxima de 750 W, lo que da como resultado una impresionante potencia máxima total de 1.500 W. Este extraordinario rendimiento se concentra en una máquina compacta y ligera, lo que convierte al Climber en un auténtico motor. Con esta excepcional potencia de motor, el Climber conquista sin miedo pendientes de hasta el 36%, desafiando las limitaciones y abriendo un mundo de posibilidades.
                - paragraph [ref=f3e856]:
                  - strong [ref=f3e857]:
                    - generic [ref=f3e858]: BMS con alta tecnología
                - paragraph
                - paragraph [ref=f3e859]:
                  - generic [ref=f3e860]: Para aumentar su confiabilidad y longevidad, el Climber está equipado con un sistema inteligente de gestión de baterías (BMS). El BMS supervisa constantemente el estado de cada célula de la batería y optimiza la capacidad disponible, garantizando un suministro de energía constante y eficiente. Además, la batería cuenta con un ecualizador de celdas que realiza una función de equilibrado durante los procesos de carga y descarga, mejorando aún más la vida útil general de cada celda.
                - paragraph [ref=f3e861]:
                  - strong [ref=f3e862]:
                    - generic [ref=f3e863]: Inmotion Climber es indestructible
                - paragraph [ref=f3e864]:
                  - generic [ref=f3e865]: Fabricado con aluminio de calidad aeronáutica, el Climber exhibe una resistencia y durabilidad incomparables. Su robusta construcción permite una capacidad de carga máxima de 140 kg, adaptándose a una amplia gama de usuarios. Con su robusta construcción y rendimiento excepcional, el InMotion Climber se erige como un scooter eléctrico confiable y formidable, capaz de adaptarse sin problemas a diversos terrenos, condiciones desafiantes y transportar cargas pesadas sin esfuerzo.
                - paragraph [ref=f3e866]:
                  - generic [ref=f3e867]: Experimenta la potencia, durabilidad y adaptabilidad del scooter eléctrico Inmotion Climber, un verdadero compañero para todas sus aventuras y viajes.
