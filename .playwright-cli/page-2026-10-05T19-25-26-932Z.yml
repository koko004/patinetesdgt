                - generic [ref=f3e747]:
                  - paragraph [ref=f3e748]:
                    - text: En imoveblue.es, tu tranquilidad es lo primero y es lo que nos diferencia del resto de tiendas. Por eso, te ofrecemos un Servicio de Garantía Completo y Servicio postventa Premium para que solo te preocupes de disfrutar de tu vehículo.
                    - strong [ref=f3e749]: Nos diferenciamos por aportar siempre soluciones
                    - text: a cualquier problema que tenga tu vehículo en cualquier punto del país.
                  - heading "Garantía Oficial y Cobertura" [level=2] [ref=f3e750]
                  - list [ref=f3e751]:
                    - listitem [ref=f3e752]:
                      - paragraph [ref=f3e753]: "Garantía Oficial de 3 Años: Todos nuestros vehículos y productos cuentan con la Garantía Oficial del fabricante de 3 años desde la fecha de compra."
                    - listitem [ref=f3e754]:
                      - paragraph [ref=f3e755]: "Excepciones: La garantía cubre fallos de fabricación y componentes principales. Quedan excluidas las piezas consideradas de desgaste (como neumáticos, pastillas de freno, etc...) Las baterías y determinados componentes eléctricos de vehículos tendrán una garantía de 6 meses, 1, 2 o 3 años o límite de km en función de las normas de fabricante-marca."
                  - heading "Servicio Premium de Recogida y Reparación Gratuita" [level=2] [ref=f3e756]
                  - list [ref=f3e757]:
                    - listitem [ref=f3e758]:
                      - paragraph [ref=f3e759]: "Máxima Comodidad: Si tu vehículo presenta un fallo cubierto por la garantía, nosotros nos encargamos de todo."
                    - listitem [ref=f3e760]:
                      - paragraph [ref=f3e761]: "Recogida Gratuita: Recogemos tu producto a domicilio sin coste alguno para ti."
                    - listitem [ref=f3e762]:
                      - paragraph [ref=f3e763]: "Reparación Profesional: Será reparado por Técnicos Oficiales en el taller oficial correspondiente para asegurar la máxima calidad."
                    - listitem [ref=f3e764]:
                      - paragraph [ref=f3e765]: "Devolución sin Coste: Una vez reparado, te lo devolvemos en tu domicilio completamente gratis."
                  - heading "Opciones de Solución de Problemas (Según el Caso)" [level=2] [ref=f3e766]
                  - paragraph [ref=f3e767]: "Una vez que contactes con nosotros, evaluaremos tu caso para ofrecerte la solución más rápida y eficiente:"
                  - list [ref=f3e768]:
                    - listitem [ref=f3e769]:
                      - paragraph [ref=f3e770]: Recogida y Reparación Gratuita en Taller Oficial (la opción estándar y más cómoda para ti).
                    - listitem [ref=f3e771]:
                      - paragraph [ref=f3e772]: Envío de Pieza Defectuosa y reparación por parte del cliente (ideal para fallos menores y clientes con conocimientos técnicos).
                    - listitem [ref=f3e773]:
                      - paragraph [ref=f3e774]: Reparación en Taller Colaborador (si disponemos de un taller asociado cerca de tu ubicación, facilitando una solución local y rápida).
                  - heading "Mantenimiento y Red de Talleres" [level=2] [ref=f3e775]
                  - list [ref=f3e776]:
                    - listitem [ref=f3e777]:
                      - paragraph [ref=f3e778]: "Red de Talleres Colaboradores: Además del servicio de garantía, contamos con una red de talleres colaboradores en crecimiento a nivel nacional."
                    - listitem [ref=f3e779]:
                      - paragraph [ref=f3e780]: "Mantenimiento al Día: Puedes utilizar esta red para realizar las revisiones, puestas a punto y el mantenimiento periódico de tu vehículo de forma cómoda y con profesionales de confianza."
