            - strong [ref=f114e222]: "BMS Inteligente:"
            - text: Sistema de gestión de batería que monitoriza voltaje, corriente y temperatura en tiempo real para prevenir sobrecalentamientos y cortocircuitos.
        - heading "Ingeniería de Control y Seguridad Avanzada" [level=3] [ref=f114e223]
        - paragraph [ref=f114e224]: El Dualtron Sonic redefine la seguridad en patinetes de alta velocidad mediante la integración de sistemas de frenado coordinados.
        - list [ref=f114e225]:
          - listitem [ref=f114e226]:
            - strong [ref=f114e227]: "Frenos Hidráulicos NUTT de 4 pistones:"
            - text: Con discos de 160 mm para una potencia de frenado inigualable.
          - listitem [ref=f114e228]:
            - strong [ref=f114e229]: "Tecnología CBS (Sistema de Frenado Combinado):"
            - text: Al accionar el freno delantero, el sistema distribuye automáticamente la potencia de frenado (50% delantero / 50% trasero) para una parada equilibrada.
          - listitem [ref=f114e230]:
            - strong [ref=f114e231]: "Asistencia Electrónica:"
            - text: Incluye sistemas ABS y EBS para evitar bloqueos y optimizar la recuperación de energía.
          - listitem [ref=f114e232]:
            - strong [ref=f114e233]: "Suspensión Ajustable:"
            - text: Chasis robusto con amortiguación delantera y trasera ajustable, diseñada para aislar vibraciones incluso en condiciones extremas.
        - heading "Centro de Control y Conectividad" [level=3] [ref=f114e234]
        - paragraph [ref=f114e235]: La cabina del piloto ha sido diseñada para ofrecer una experiencia inteligente y ergonómica.
        - list [ref=f114e236]:
          - listitem [ref=f114e237]:
