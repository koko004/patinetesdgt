          - listitem [ref=f114e210]:
            - strong [ref=f114e211]: "Homologación:"
            - text: Este modelo cumple con las normativas actuales, incluyendo el certificado de circulación de la DGT.
        - heading "Autonomía y Tecnología de Batería" [level=3] [ref=f114e212]
        - paragraph [ref=f114e213]:
