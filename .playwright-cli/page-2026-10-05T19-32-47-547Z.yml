          - text: El
          - strong [ref=f114e199]: Dualtron Sonic Modelo A
          - text: ", conocido bajo el nombre en clave"
          - strong [ref=f114e200]: ALIEN
          - text: ", representa la cúspide de la movilidad eléctrica de alto rendimiento. Diseñado por Minimotors para usuarios que no aceptan compromisos, este patinete combina una potencia bruta con tecnología de grado automotriz y un sistema de seguridad avanzado. No es solo un vehículo, es una nueva categoría de movilidad eléctrica diseñada para dominar tanto la ciudad como los trayectos de largo alcance."
        - heading "Potencia y Rendimiento Extremo" [level=3] [ref=f114e201]
        - paragraph [ref=f114e202]:
          - text: En el núcleo del Sonic Modelo A late un sistema de
          - strong [ref=f114e203]: motor dual
          - text: capaz de entregar una potencia nominal de 2 x 2000W (4000W constantes), alcanzando un
          - strong [ref=f114e204]: pico máximo de potencia de 8000W
          - text: . Esta configuración permite una aceleración fulgurante y la capacidad de superar pendientes pronunciadas sin pérdida de rendimiento.
        - list [ref=f114e205]:
          - listitem [ref=f114e206]:
            - strong [ref=f114e207]: "Velocidad máxima:"
            - text: Hasta 100 km/h (Uso limitado exclusivamente a vías privadas).
          - listitem [ref=f114e208]:
